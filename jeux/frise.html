<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Le jeu de la frise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mise en page : un plateau de jeu (tapis de table) ; la frise de cartes court de gauche à droite au centre, la carte à jouer attend en bas */
:root{
  --felt:#155e56;--felt-deep:#0d433d;--felt-line:rgba(255,255,255,.14);
  --paper:#fbf5e6;--paper-edge:#e9dcc0;--ink:#2c2418;--ink2:#6f6250;
  --gold:#f4b73e;--gold-deep:#c98a12;--ok:#3ccf76;--ko:#ff5a4e;--text:#f5fbf9;--text2:rgba(245,251,249,.72);
  --p-pre:#a8743f;--p-ant:#d99a1b;--p-moy:#8a5ad1;--p-mod:#2f7fd4;--p-con:#239a5c;
  --display:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 20%,var(--felt) 0%,var(--felt-deep) 100%) fixed;color:var(--text);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 5px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;position:relative;z-index:1}
/* accueil */
.home{overflow:auto;height:100%;padding:18px 0 30px}
.logo{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.logo .fan{position:relative;width:64px;height:64px;flex:none}
.logo .fan i{position:absolute;left:14px;top:4px;width:36px;height:52px;border-radius:7px;background:var(--paper);box-shadow:0 3px 8px rgba(0,0,0,.3);transform-origin:50% 100%}
.logo .fan i:nth-child(1){transform:rotate(-20deg);background:#f1e4c4}.logo .fan i:nth-child(2){transform:rotate(0)}.logo .fan i:nth-child(3){transform:rotate(20deg);background:#fff9ec}
.logo .fan i:nth-child(3)::before{content:"";position:absolute;inset:0 0 auto;height:15px;border-radius:7px 7px 0 0;background:var(--p-moy)}
h1{font:700 34px/1.05 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.sub{color:var(--text2);margin:4px 0 0;max-width:56ch}
.sh{font:600 14px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:22px 2px 10px}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.deck{position:relative;text-align:left;padding:0;border-radius:14px;transition:transform .15s}
.deck .face{position:relative;z-index:2;background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.deck::before,.deck::after{content:"";position:absolute;inset:0;border-radius:12px;background:#efe2c2;box-shadow:0 3px 8px rgba(0,0,0,.25);transform:rotate(-3deg) translate(-3px,3px)}
.deck::after{background:#e6d6b0;transform:rotate(3.5deg) translate(4px,4px)}
.deck .band{height:52px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c)}
.deck .band svg{width:30px;height:30px}
.deck .tx{padding:9px 12px 11px}.deck b{font:600 16px/1.2 var(--display);display:block}.deck span{font-size:12.5px;color:var(--ink2);font-weight:600}
.deck.on{transform:translateY(-4px)}.deck.on .face{box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.35)}
.deck:hover{transform:translateY(-3px)}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--text2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.foot{font-size:13.5px;color:var(--text2);margin:8px 2px 0}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;margin-top:26px;border-radius:16px;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3a2600;font:700 21px var(--display);box-shadow:0 5px 0 #8f600a,0 10px 20px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 #8f600a,0 4px 10px rgba(0,0,0,.3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 2px 0;font-size:13px;color:var(--text2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:4px}
.demo{font-size:12px;color:var(--text2);text-align:center;margin-top:12px}
/* partie */
.hud{display:flex;align-items:center;gap:10px;padding:10px 0 6px;flex:none}
.hbtn{width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:var(--text)}
.dots{flex:1;display:flex;gap:4px;align-items:center}
.dots i{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.25)}.dots i.ok{background:var(--ok)}.dots i.ko{background:var(--ko)}
.hearts{display:flex;gap:3px}.hearts svg{width:20px;height:20px}
.score{font:700 20px var(--display);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.streak{position:absolute;left:50%;top:58px;transform:translateX(-50%) scale(.6);opacity:0;background:var(--gold);color:#3a2600;font:700 17px var(--display);padding:6px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;z-index:30;transition:all .25s}
.streak.show{opacity:1;transform:translateX(-50%) scale(1)}
.msg{flex:none;text-align:center;min-height:44px;padding:2px 8px 4px;font-weight:700;font-size:15px;color:var(--text2);text-wrap:balance}
.msg.ok{color:#8ff0b5}.msg.ko{color:#ffb1aa}
.table{flex:1;min-height:0;position:relative;display:flex;align-items:center}
.track{display:flex;align-items:flex-start;gap:0;overflow-x:auto;overflow-y:hidden;padding:26px 30px 40px;scroll-behavior:smooth;width:100%;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.track>:first-child{margin-left:auto}.track>:last-child{margin-right:auto}
.track::before{content:"";position:absolute;left:0;right:0;top:calc(50% + 70px);height:3px;background:var(--felt-line);border-radius:2px}
.slot{flex:none;width:34px;height:196px;display:flex;align-items:center;justify-content:center;margin:0 3px;position:relative}
.slot span{width:26px;height:168px;border-radius:12px;border:2.5px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font:700 22px var(--display);transition:all .15s}
.slot:hover span,.slot.hot span{border-color:var(--gold);background:rgba(244,183,62,.18);color:var(--gold);width:30px}
.slot.hot{width:120px}.slot.hot span{width:110px}
/* cartes */
.card{flex:none;width:128px;height:196px;perspective:700px;position:relative}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.card .f{position:absolute;inset:0;border-radius:13px;background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--paper-edge),0 6px 14px rgba(0,0,0,.3);overflow:hidden;backface-visibility:hidden;display:flex;flex-direction:column}
.card .back{transform:rotateY(180deg)}
.card .top{height:56px;flex:none;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.card .top svg{width:36px;height:36px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.card .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:radial-gradient(circle at 6px -2px,transparent 6px,var(--paper) 6.5px) 0 0/12px 10px repeat-x}
.card .nm{padding:7px 9px 2px;font-weight:800;font-size:13.5px;line-height:1.2;flex:none;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;text-wrap:balance}
.card .pr{padding:0 9px;font-size:11.5px;color:var(--ink2);font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .yr{margin:auto 8px 8px;border-radius:8px;background:color-mix(in srgb,var(--c) 16%,var(--paper));color:var(--c);text-align:center;font:700 17px var(--display);padding:3px 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .yr.q{color:var(--ink2);letter-spacing:.2em;background:rgba(0,0,0,.06)}
.card.flip .in{transform:rotateY(180deg)}
.card.ok .back{box-shadow:0 0 0 3px var(--ok),0 6px 14px rgba(0,0,0,.3)}
.card.ko .back{box-shadow:0 0 0 3px var(--ko),0 6px 14px rgba(0,0,0,.3)}
.card .era{position:absolute;left:4px;right:4px;top:204px;height:5px;border-radius:3px;background:var(--c)}
.card .eral{position:absolute;left:2px;right:0;top:214px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--c);filter:brightness(1.35)}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px) rotate(-2deg)}40%,80%{transform:translateX(7px) rotate(2deg)}}
/* main du joueur */
.hand{flex:none;height:230px;display:flex;align-items:center;justify-content:center;gap:16px;position:relative;padding-bottom:env(safe-area-inset-bottom,0px)}
.hand::before{content:"";position:absolute;inset:14px -16px 0;background:rgba(0,0,0,.16);border-radius:26px 26px 0 0}
.hand .card{width:140px;height:208px;cursor:grab;touch-action:none;z-index:2;animation:float 3s ease-in-out infinite;transform:rotate(-4deg)}
.hand .card .nm{font-size:14.5px}
@keyframes float{50%{transform:rotate(-4deg) translateY(-6px)}}
.hand .tip{position:relative;z-index:2;max-width:170px;font-weight:700;color:var(--text2);font-size:14px;line-height:1.35}
.hand .tip b{display:block;font:600 18px var(--display);color:var(--text);margin-bottom:4px}
.chip{display:inline-block;margin-top:8px;font:600 12px var(--display);letter-spacing:.04em;padding:3px 10px;border-radius:999px;color:#fff;background:var(--c)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(4deg) scale(1.05);filter:drop-shadow(0 16px 20px rgba(0,0,0,.4))}
.ghost .card{animation:none}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
/* fin de partie */
.end{overflow:auto;height:100%;padding:18px 0 30px;text-align:center}
.stars{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.stars svg{width:58px;height:58px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.stars svg:nth-child(2){transform:translateY(-12px) scale(1.15)}
.stars .on{animation:starIn .5s both}.stars svg:nth-child(2).on{animation-delay:.18s}.stars svg:nth-child(3).on{animation-delay:.36s}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}}
.stars svg:nth-child(2).on{animation-name:starIn2}@keyframes starIn2{0%{transform:translateY(-12px) scale(0) rotate(-40deg)}70%{transform:translateY(-12px) scale(1.4)}100%{transform:translateY(-12px) scale(1.15)}}
.big{font:700 54px var(--display);font-variant-numeric:tabular-nums;line-height:1;margin-top:6px}
.end .track{padding:20px 20px 52px;margin-top:6px}
.end .track::before{display:none}
.end .card{margin:0 5px}
.btns{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:12px auto 0}
.btn2{height:50px;border-radius:14px;background:rgba(0,0,0,.22);font:600 18px var(--display);color:var(--text)}
.btn2.plain{background:none;color:var(--gold)}
@media (max-width:560px){h1{font-size:29px}.card{width:116px;height:184px}.card .era{top:192px}.card .eral{top:202px}.slot{height:184px}.slot span{height:156px}.track::before{top:calc(50% + 64px)}
  .hand{height:226px}.hand .card{width:132px;height:196px}.card .nm{font-size:12.5px}.card .top{height:50px}}
@media (prefers-reduced-motion:reduce){.hand .card{animation:none}.card .in{transition:none}.card.shake{animation:none}.stars .on{animation:none}.track{scroll-behavior:auto}}
/* modes, niveaux, défi */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{background:rgba(0,0,0,.2);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 0 0 2px transparent;transition:transform .12s}
.mode svg{width:30px;height:30px;color:var(--gold);margin-bottom:4px}
.mode b{font:600 16px/1.2 var(--display)}.mode span{font-size:12.5px;color:var(--text2);font-weight:600;line-height:1.3}
.mode.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.3)}.mode.on span{color:var(--ink2)}.mode.on svg{color:var(--gold-deep)}
.mode:hover{transform:translateY(-2px)}
.levels{display:grid;gap:8px}
.lvl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;text-align:left;background:rgba(0,0,0,.2);border-radius:12px;padding:10px 14px}
.lvl b{font:600 16px var(--display);display:flex;align-items:center;gap:6px}.lvl span:not(.mst){grid-column:1;font-size:13px;color:var(--text2);font-weight:600}
.lvl .mst{grid-row:1/3;grid-column:2}
.lvl.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px var(--gold)}.lvl.on span:not(.mst){color:var(--ink2)}
.lvl.locked{opacity:.55;cursor:not-allowed}
.mst{display:inline-flex;gap:3px}.mst i{width:14px;height:14px;background:rgba(0,0,0,.28);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.mst i.on{background:var(--gold)}
.daily{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px;margin-top:16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.daily b{font:600 18px var(--display)}.daily span{color:var(--ink2);font-weight:600;font-size:14px}.daily .dres{color:var(--p-con)}
/* chrono, équipes, score */
.tbar{flex:1;height:12px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd77a);border-radius:6px;transition:width .2s linear}.tbar i.low{background:var(--ko)}
.teams{flex:1;display:flex;gap:6px;justify-content:center}
.team{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.22);font:600 15px var(--display);opacity:.6;transition:all .2s}
.team i{width:12px;height:12px;border-radius:50%;background:var(--team)}.team b{font-size:18px}
.team.on{opacity:1;background:color-mix(in srgb,var(--team) 30%,rgba(0,0,0,.25));box-shadow:0 0 0 2px var(--team)}
.turn{display:inline-block;margin-bottom:6px;padding:3px 10px;border-radius:999px;background:var(--team);color:#2a1d00;font:600 13px var(--display)}
.score small{font-size:13px;color:var(--gold);margin-left:3px}
.dots i.near{background:var(--gold)}
.msg.near{color:#ffe08a}
.tdot{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:2px solid var(--paper);z-index:3}
/* le savais-tu, siècle */
.dyk{display:block;font:600 15px var(--display);color:var(--gold);margin-bottom:4px}
.ft{display:block;font-size:13px;font-weight:600;line-height:1.38;color:var(--text)}
.hand .tip{max-width:210px}
.hand.ask{justify-content:center}
.factp{position:relative;z-index:2;width:min(460px,100%);background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 16px 14px;box-shadow:0 6px 16px rgba(0,0,0,.3);border-top:8px solid var(--c);text-align:left}
.factp .fk{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-deep)}
.factp .fn{display:flex;align-items:center;gap:8px;font:600 16px/1.2 var(--display);margin:4px 0 6px}.factp .fn b{color:var(--c)}
.factp .fi{flex:none;width:30px;height:30px;border-radius:8px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center}.factp .fi svg{width:20px;height:20px}
.factp p{margin:0;font-weight:600;font-size:14.5px;line-height:1.45}
.factp .pose{margin:10px 0 0 auto}
.cent{position:relative;z-index:2;text-align:center;max-width:460px;width:100%}
.cent .ck{font:600 14px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.cent .cy{font-weight:700;margin:4px 0 10px;font-size:15px}.cent .cy b{font:700 19px var(--display);color:var(--gold)}
.copts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.copts button{min-height:46px;border-radius:12px;background:var(--paper);color:var(--ink);font:600 15px var(--display);box-shadow:0 3px 0 var(--paper-edge);padding:4px 6px}
.copts button.ok{background:var(--ok);color:#06331a;box-shadow:none}.copts button.ko{background:var(--ko);color:#fff;box-shadow:none}.copts button:disabled{cursor:default}
.cskip{margin-top:8px;color:var(--text2);font-weight:700;font-size:13px;padding:4px 10px}
.pose{display:block;margin-top:10px;padding:10px 16px;border-radius:12px;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3a2600;font:700 16px var(--display);box-shadow:0 3px 0 #8f600a}
.pose:disabled{opacity:.45;box-shadow:none;cursor:default}
/* règle à l'échelle */
.track.scale{display:block;padding:34px 0 16px;align-self:stretch;overflow-y:auto;scroll-behavior:auto}
.track.scale::before{display:none}
.ruler{position:relative;margin:0 auto;cursor:crosshair;touch-action:pan-x pan-y;outline:none}
.ruler:focus-visible{box-shadow:inset 0 0 0 3px var(--gold);border-radius:10px}
.axis{position:absolute;height:4px;background:rgba(255,255,255,.75);border-radius:2px}
.eband{position:absolute;height:10px;margin-top:6px;border-radius:5px;opacity:.9}
.eband span{position:absolute;left:8px;top:14px;font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.85;white-space:nowrap}
.tick{position:absolute;width:2px;height:20px;margin-left:-1px;background:rgba(255,255,255,.8)}.tick.minor{height:12px;top:auto;opacity:.6}
.tlab{position:absolute;transform:translateX(-50%);font:600 12.5px var(--display);color:var(--text);white-space:nowrap;margin-top:18px}
.stem{position:absolute;width:2px;margin-left:-1px;opacity:.8}
.mini{position:absolute;width:100px;height:64px;border-radius:10px;background:var(--paper);color:var(--ink);display:flex;gap:6px;align-items:center;padding:6px;text-align:left;box-shadow:0 4px 10px rgba(0,0,0,.3);border-top:5px solid var(--c)}
.mini .mi{flex:none;width:26px;height:26px;border-radius:7px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center}.mini .mi svg{width:18px;height:18px}
.mini .mt{font-size:10.5px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.mini .mt b{display:block;font:700 13px var(--display);color:var(--c);white-space:nowrap}
.mini.ok{box-shadow:0 0 0 3px var(--ok),0 4px 10px rgba(0,0,0,.3)}.mini.near{box-shadow:0 0 0 3px var(--gold),0 4px 10px rgba(0,0,0,.3)}.mini.ko{box-shadow:0 0 0 3px var(--ko),0 4px 10px rgba(0,0,0,.3)}
.mini.land{animation:land .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{0%{transform:translateY(-40px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.guess{position:absolute;height:6px;background:repeating-linear-gradient(90deg,var(--ko) 0 6px,transparent 6px 10px);border-radius:3px}
.gpin{position:absolute;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ko);border:2px solid #fff}
.cursor{position:absolute;width:4px;margin-left:-2px;background:var(--gold);border-radius:2px;box-shadow:0 0 12px rgba(244,183,62,.7);pointer-events:none}
.cursor span{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);background:var(--gold);color:#3a2600;font:700 13px var(--display);padding:3px 8px;border-radius:8px;white-space:nowrap}
/* fin */

// Glisser la carte avec le doigt ou la souris (cible : .slot pour la frise, la règle pour l'échelle)
function bindDrag(onDrop, onMove){
  const hc = document.querySelector('#handcard .card'), tr = document.getElementById('track');

  let ghost = null, hot = null, ox = 0, oy = 0, raf = 0, lastX = 0;

function place(i){

  else { G.streak = 0; G.errs++; if (G.mode === 'chrono') G.endAt -= 5000; }
  document.getElementById('track').innerHTML = trackHtml(false);
  const tr = document.getElementById('track'), el = document.getElementById(cur.id);
  tr.style.scrollBehavior = 'auto'; tr.scrollLeft = el.offsetLeft - tr.clientWidth / 2 + el.offsetWidth / 2; tr.style.scrollBehavior = '';

/* ---------- Frise à l'échelle ---------- */
function makeRuler(ys){
  const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo;
  const step = span <= 150 ? 10 : span <= 600 ? 50 : span <= 2600 ? 100 : span <= 6000 ? 500 : 1000;
  const start = Math.floor(lo / step) * step - step, end = Math.ceil(hi / step) * step + step;
  const px = innerWidth < 600 ? 64 : 84, ppy = px / step, pad = 46;
  return { step, start, end, ppy, pad, width: (end - start) * ppy + pad * 2, labelEvery: px < 70 && (end - start) / step > 30 ? 2 : 1 };
}
const rx = y => G.ruler.pad + (y - G.ruler.start) * G.ruler.ppy;
const tickLabel = y => y < 0 ? Math.abs(y) + ' av.' : y === 0 ? 'J.-C.' : String(y);
function rulerHtml(final){
  const R = G.ruler, top = 12, rowH = 78;
  // cartes posées, réparties sur plusieurs rangées pour ne pas se chevaucher
  const rows = [], minis = G.placed.slice().sort((a, b) => a.y - b.y).map(c => { const x = rx(c.y); let r = 0; while (rows[r] != null && x - rows[r] < 104) r++; rows[r] = x; return { c, x, r }; });
  const nRows = Math.max(2, rows.length), axisY = top + nRows * rowH + 14;
  let h = '<div class="ruler" id="ruler" tabindex="0" aria-label="Règle du temps : touche l’endroit de l’événement" style="width:' + R.width + 'px;height:' + (axisY + 64) + 'px">';
  ERAS.forEach((e, i) => { const a = Math.max(R.start, i ? ERAS[i - 1].to : -Infinity), b = Math.min(R.end, e.to); if (b <= a) return;
    h += '<div class="eband" style="left:' + rx(a) + 'px;width:' + (rx(b) - rx(a)) + 'px;top:' + axisY + 'px;background:var(--p-' + e.k + ')">' + ((rx(b) - rx(a)) > 90 ? '<span>' + e.s + '</span>' : '') + '</div>'; });
  for (let y = R.start, k = 0; y <= R.end; y += R.step, k++){
    h += '<div class="tick' + (k % R.labelEvery ? ' minor' : '') + '" style="left:' + rx(y) + 'px;top:' + (axisY - 8) + 'px"></div>' + (k % R.labelEvery ? '' : '<div class="tlab" style="left:' + rx(y) + 'px;top:' + (axisY + 22) + 'px">' + tickLabel(y) + '</div>');
  }
  h += '<div class="axis" style="top:' + axisY + 'px;left:' + R.pad / 2 + 'px;width:' + (R.width - R.pad) + 'px"></div>';
  minis.forEach(({ c, x, r }) => {
    const gx = c.guess != null ? rx(c.guess) : null, yTop = top + r * rowH;
    if (gx != null && c.st !== 'ok') h += '<div class="guess" style="left:' + Math.min(gx, x) + 'px;width:' + Math.abs(gx - x) + 'px;top:' + (axisY - 3) + 'px"></div><div class="gpin" style="left:' + gx + 'px;top:' + (axisY - 12) + 'px"></div>';
    h += '<div class="stem" style="left:' + x + 'px;top:' + (yTop + 64) + 'px;height:' + (axisY - yTop - 64) + 'px;background:var(--p-' + eraOf(c.y).k + ')"></div>' +
      '<button class="mini ' + (c.st || '') + '" data-id="' + c.id + '" style="left:' + (x - 50) + 'px;top:' + yTop + 'px;--c:var(--p-' + eraOf(c.y).k + ')"><span class="mi">' + icon(c.ic) + '</span><span class="mt"><b>' + (c.y < 0 ? Math.abs(c.y) + ' av.' : fmtY(c.y, c.about)) + '</b>' + esc(c.n) + '</span></button>';
  });
  if (!final && G.cur != null) h += '<div class="cursor" style="left:' + rx(G.cur) + 'px;top:' + (top - 4) + 'px;height:' + (axisY - top + 14) + 'px"><span>≈ ' + fmtY(Math.round(G.cur / (R.step <= 50 ? 1 : 10)) * (R.step <= 50 ? 1 : 10)) + '</span></div>';
  return h + '</div>';
}
function renderScale(msg){
  const cur = G.pile[0];
  if (!G.ask && !G.showFact && !cur) return finish();
  $app.innerHTML = hudHtml() + '<div class="msg ' + (msg ? msg[0] : '') + '" aria-live="polite">' + (msg ? esc(msg[1]) : G.ask ? 'Bonus : trouve le siècle !' : 'Touche la règle (ou glisse la carte dessus) à l’endroit de l’événement.') + '</div>' +
    '<div class="table"><div class="track scale" id="track">' + rulerHtml(false) + '</div></div>' +
    handHtml(cur, G.ask || G.showFact ? '' : '<button class="pose" id="pose"' + (G.cur == null ? ' disabled' : '') + '>Poser ici</button>');
  bindHud();
  const tr = document.getElementById('track'), ru = document.getElementById('ruler');
  const setCur = clientX => { const r = ru.getBoundingClientRect(), R = G.ruler; G.cur = Math.max(R.start, Math.min(R.end, R.start + (clientX - r.left - R.pad) / R.ppy)); drawCursor(); };
  const drawCursor = () => { const old = ru.querySelector('.cursor'); if (old) old.remove(); const tmp = document.createElement('div'); tmp.innerHTML = rulerHtml(false); const nc = tmp.querySelector('.cursor'); if (nc) ru.appendChild(nc); const p = document.getElementById('pose'); if (p) p.disabled = G.cur == null; };
  if (G.ask) bindAsk(m => renderScale(m));

  else {
    let down = null;
    ru.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
    ru.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8 && !e.target.closest('.mini')) setCur(e.clientX); down = null; });
    ru.addEventListener('keydown', e => { const R = G.ruler; if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); G.cur = Math.max(R.start, Math.min(R.end, (G.cur == null ? (R.start + R.end) / 2 : G.cur) + (e.key === 'ArrowLeft' ? -1 : 1) * R.step / 5)); drawCursor(); } if (e.key === 'Enter' && G.cur != null) placeScale(); });

}
function placeScale(){

  const cur = G.pile.shift(), R = G.ruler, d = Math.abs(G.cur - cur.y);

  G.res.push(v === 'ok' ? true : v === 'near' ? 'near' : false);
  if (v === 'ok'){ G.pts++; G.streak++; G.best = Math.max(G.best, G.streak); } else if (v === 'near'){ G.pts += .5; G.streak = 0; } else { G.streak = 0; G.errs++; }
  const tr = document.getElementById('track'); tr.innerHTML = rulerHtml(true); tr.scrollLeft = rx(cur.y) - tr.clientWidth / 2;
  document.getElementById('handcard').innerHTML = ''; const p = document.getElementById('pose'); if (p) p.remove();
  const m = document.querySelector('.mini[data-id="' + cur.id + '"]'); if (m){ m.classList.add('land'); const r = m.getBoundingClientRect(); if (v === 'ok'){ SND.ok(); confetti(r.left + r.width / 2, r.top, 40); } else if (v === 'near') SND.near(); else SND.ko(); }
  if (v === 'ok' && G.streak >= 3) pop('Série de ' + G.streak + ' !');
  const off = Math.round(d), unit = off + ' an' + (off > 1 ? 's' : '');
  const msg = v === 'ok' ? ['ok', 'Bravo ! « ' + cur.n + ' » : ' + fmtY(cur.y, cur.about) + '.'] : v === 'near' ? ['near', 'Presque ! « ' + cur.n + ' » : ' + fmtY(cur.y, cur.about) + ' (écart de ' + unit + '). Un demi-point.'] : ['ko', 'Raté : « ' + cur.n + ' » date de ' + fmtY(cur.y, cur.about) + ' (écart de ' + unit + ').'];
  setTimeout(() => { G.busy = false; afterCard(cur, msg, renderScale); }, calm() ? 0 : 1500);

// Toucher une carte posée : son « Le savais-tu ? »

/* ---------- Fin de partie ---------- */
const star = on => '<svg class="' + (on ? 'on' : '') + '" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z" fill="' + (on ? '#f4b73e' : 'rgba(0,0,0,.25)') + '" stroke="' + (on ? '#c98a12' : 'none') + '" stroke-width="1.2" stroke-linejoin="round"/></svg>';
function finish(){
  if (G.timer){ clearInterval(G.timer); G.timer = null; }
  document.querySelectorAll('.ghost').forEach(x => x.remove());
  const M = G.mode, n = G.res.length, pct = n ? G.pts / n : 0, stars = M === 'chrono' || M === 'duel' ? 0 : pct >= .9 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
  const dead = G.lives && G.errs >= G.lives;
  let title = dead ? 'Plus de vies !' : stars === 3 ? 'Magnifique !' : stars === 2 ? 'Bien joué !' : 'Partie terminée', sub = '', extra = '';
  if (M === 'classic'){
    const P = prog(), cur = P[opt.deck] || [], was = unlocked(opt.deck, G.level + 1);
    cur[G.level] = Math.max(cur[G.level] || 0, stars); P[opt.deck] = cur; store.set('frise_levels', P);
    if (!was && G.level < 2 && unlocked(opt.deck, G.level + 1)) extra = '<div class="unlock">' + lockSvg.replace('M8 11V8a4 4 0 0 1 8 0v3', 'M8 11V8a4 4 0 0 1 7.5-2') + ' Niveau ' + (G.level + 2) + ' « ' + LEVELS[G.level + 1].n + ' » débloqué !</div>';
    sub = 'Niveau ' + (G.level + 1) + ' · ' + LEVELS[G.level].n;
  }
  if (M === 'daily'){ const D = store.get('frise_daily') || {}; if (!D[today()] || G.pts > D[today()].ok) D[today()] = { ok: G.pts, n, bonus: G.bonus }; store.set('frise_daily', D); sub = 'Défi du jour'; }
  if (M === 'chrono'){ const B = store.get('frise_chrono') || {}, k = opt.deck + opt.time, rec = !B[k] || G.pts > B[k]; if (rec) B[k] = G.pts; store.set('frise_chrono', B);
    title = G.pts >= 10 ? 'Quelle vitesse !' : 'Temps écoulé !'; sub = (rec && G.pts ? 'Nouveau record · ' : 'Record : ' + B[k] + ' · ') + G.dur / 60 + ' minute' + (G.dur > 60 ? 's' : ''); }
  if (M === 'duel'){ const [a, b] = G.teams; title = a.s === b.s ? 'Égalité !' : (a.s > b.s ? a : b).n + ' gagne !'; }
  const miss = (M === 'scale' ? G.placed : G.line).filter(c => c.st === 'ko');
  if (M !== 'scale') G.line.forEach(c => { c.rev = true; });
  const score = M === 'duel' ? '<div class="duelres">' + G.teams.map(t => '<div style="--team:' + t.c + '"><span>' + t.n + '</span><b>' + fmtN(t.s) + '</b></div>').join('') + '</div>'
    : '<div class="big">' + fmtN(G.pts) + (M === 'chrono' ? '' : ' / ' + n) + '</div><p class="sub" style="margin:6px auto 0">' + (M === 'chrono' ? 'cartes bien placées' : M === 'scale' ? 'points (½ point pour « presque »)' : 'cartes bien placées') + (G.best >= 3 ? ' · meilleure série : ' + G.best : '') + '</p>';
  $app.innerHTML = '<div class="end">' + (sub ? '<div class="sh" style="margin:4px 0 0">' + esc(sub) + '</div>' : '') + '<h1>' + esc(title) + '</h1>' +
    (M === 'chrono' || M === 'duel' ? '' : '<div class="stars">' + [1, 2, 3].map(k => star(k <= stars)).join('') + '</div>') + score +
    (G.bonusN ? '<p class="bonusl">★ Siècles : ' + G.bonus + ' / ' + G.bonusN + '</p>' : '') + extra +
    '<div class="sh" style="margin-top:18px">Ta frise · touche une carte pour en savoir plus</div><div class="track' + (M === 'scale' ? ' scale' : '') + '" id="track">' + (M === 'scale' ? rulerHtml(true) : trackHtml(false, true)) + '</div>' +
    '<div class="factbox" id="factbox" hidden></div>' +
    '<div class="btns">' + (miss.length && M !== 'chrono' && M !== 'daily' && M !== 'duel' ? '<button class="play" id="redo" style="margin-top:0">' + (miss.length > 1 ? 'Rejouer les ' + miss.length + ' cartes ratées' : 'Rejouer la carte ratée') + '</button>' : '') +
    '<button class="' + (miss.length && M !== 'chrono' && M !== 'daily' && M !== 'duel' ? 'btn2' : 'play') + '" id="again" style="margin-top:0">' + (M === 'daily' ? 'Rejouer le défi' : M === 'duel' ? 'Revanche !' : 'Nouvelle partie') + '</button><button class="btn2 plain" id="home">Changer de mode ou de paquet</button></div></div>';
  if (stars >= 2 || M === 'duel' || (M === 'chrono' && G.pts >= 5)){ SND.win(); confetti(innerWidth / 2, innerHeight / 3, 90); }
  bindMinis();
  const tr = document.getElementById('track'); if (M === 'scale') tr.scrollLeft = 0;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => {
    const keep = { redo: true, t0: Date.now(), mode: M, res: [], pts: 0, streak: 0, best: 0, errs: 0, bonus: 0, bonusN: 0, busy: false, ask: null, fact: null, lastId: null, cent: G.cent, lives: 0, hint: G.hint, level: null, teams: null, turn: 0 };
    if (M === 'scale'){ G = Object.assign(keep, { pile: shuffle(miss.map(c => Object.assign({}, c, { st: null, guess: null }))), total: miss.length, placed: G.placed.filter(c => c.st !== 'ko'), cur: null, ruler: G.ruler }); return renderScale(); }
    G = Object.assign(keep, { line: G.line.filter(c => c.st !== 'ko').map(c => Object.assign({}, c, { st: 'start', rev: true })), pile: shuffle(miss.map(c => Object.assign({}, c, { st: null, rev: false }))), total: miss.length });
    render();
  };
  document.getElementById('again').onclick = start;
  document.getElementById('home').onclick = home;
  if (EMB && !G.redo && M !== 'duel' && n){
    const set = M === 'daily' ? 'daily' : M + '+' + opt.deck + (M === 'classic' ? '+' + LVL[G.level] : '');
    post({ type: 'end', game: 'frise', mode: set, n: Math.min(n, 100), ok: Math.min(n, 100, Math.round(G.pts)), s: Math.round((Date.now() - G.t0) / 1000), weak: [] });
  }
  if (EMB && EMB.interro){ ['redo', 'again'].forEach(id => { const b = document.getElementById(id); if (b) b.remove(); }); document.getElementById('home').className = 'play'; }
  if (EMB && EMB.task) document.getElementById('home').textContent = 'Terminer';
}
// Démarrage : un jeu donné par le professeur s'ouvre directement avec son mode, son paquet et son niveau
if (EMB && EMB.task){
  const [m, d, l] = EMB.mode.split('+');
  if (MODES[m] && m !== 'duel'){ opt = Object.assign({}, opt, { mode: m, deck: DECKS[d] ? d : opt.deck, level: Math.max(0, LVL.indexOf(l)) }); start(); }
  else post({ type: 'quit' });
} else home();
</script>
