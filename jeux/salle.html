<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>La salle de jeux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mise en page : même tapis de jeu que « Le jeu de la frise » ; une colonne centrée, la zone de jeu prend la hauteur de l'écran */
:root{
  --felt:#155e56;--felt-deep:#0d433d;--paper:#fbf5e6;--paper-edge:#e9dcc0;--ink:#2c2418;--ink2:#6f6250;
  --gold:#f4b73e;--gold-deep:#c98a12;--ok:#3ccf76;--ko:#ff5a4e;--text:#f5fbf9;--text2:rgba(245,251,249,.74);
  --sea:#2a7fa8;--sea-deep:#1d6286;--land:#e9dfc6;--geo:#5aa9ff;--hist:#c98aff;
  --display:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 20%,var(--felt) 0%,var(--felt-deep) 100%) fixed;color:var(--text);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 5px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.app{min-height:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;position:relative;z-index:1;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
h1{font:700 32px/1.08 var(--display);margin:0;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.18)}
h2{font:700 26px/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--text2);margin:4px 0 0;max-width:58ch}
.sh{font:600 14px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:22px 2px 10px}
.foot{font-size:13.5px;color:var(--text2);margin:8px 2px 0;max-width:62ch}
.seg{display:flex;flex-wrap:wrap;background:rgba(0,0,0,.22);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 10px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--text2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:24px;border-radius:16px;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3a2600;font:700 20px var(--display);box-shadow:0 5px 0 #8f600a,0 10px 20px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 #8f600a,0 4px 10px rgba(0,0,0,.3)}
.play:disabled{opacity:.5;transform:none}
.btn2{display:block;width:100%;height:50px;border-radius:14px;background:rgba(0,0,0,.22);font:600 18px var(--display);color:var(--text)}
.btn2.plain{background:none;color:var(--gold)}
.demo{font-size:12px;color:var(--text2);text-align:center;margin-top:12px}
/* accueil de la salle */
.hall{padding:20px 0 10px}
.logo{display:flex;align-items:center;gap:14px}
.dice{width:60px;height:60px;flex:none;border-radius:16px;background:var(--paper);color:var(--ink);display:grid;grid-template-columns:repeat(3,1fr);padding:10px;gap:4px;transform:rotate(-8deg);box-shadow:0 5px 12px rgba(0,0,0,.3)}
.dice i{border-radius:50%;background:var(--ink)}.dice i.x{background:transparent}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.game{position:relative;text-align:left;background:var(--paper);color:var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,.3);display:flex;flex-direction:column;transition:transform .15s}
.game:hover{transform:translateY(-3px) rotate(-.4deg)}
.game .gb{height:86px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c);position:relative}
.game .gb svg{width:48px;height:48px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.game .gb::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:radial-gradient(circle at 6px -2px,transparent 6px,var(--paper) 6.5px) 0 0/12px 10px repeat-x}
.game .gt{padding:10px 14px 14px}.game b{font:600 19px var(--display);display:block}.game span{font-size:13.5px;color:var(--ink2);font-weight:600;line-height:1.35;display:block;margin-top:2px}
.game .rec{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.28);color:#fff;font:600 12px var(--display);padding:3px 9px;border-radius:999px}
.tag{display:inline-block;font:600 12px var(--display);letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.2);margin-left:8px;vertical-align:2px}
/* barre du haut d'un jeu */
.hud{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.hbtn{width:38px;height:38px;flex:none;border-radius:12px;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:var(--text)}
.htitle{flex:1;min-width:0;font:600 17px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:3px}.hearts svg{width:20px;height:20px}
.score{font:700 20px var(--display);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.msg{text-align:center;min-height:44px;padding:2px 8px 6px;font-weight:700;font-size:15px;color:var(--text2);text-wrap:balance}
.msg.ok{color:#8ff0b5}.msg.ko{color:#ffb1aa}.msg.warn{color:#ffe08a}
.streak{position:fixed;left:50%;top:70px;transform:translateX(-50%) scale(.6);opacity:0;background:var(--gold);color:#3a2600;font:700 17px var(--display);padding:6px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;z-index:30;transition:all .25s}
.streak.show{opacity:1;transform:translateX(-50%) scale(1)}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.setup{padding:8px 0 10px}
.end{text-align:center;padding:14px 0 10px}
.stars{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.stars svg{width:56px;height:56px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.stars svg:nth-child(2){transform:translateY(-12px) scale(1.15)}
.stars .on{animation:starIn .5s both}.stars svg:nth-child(3).on{animation-delay:.36s}
.stars svg:nth-child(2).on{animation:starIn2 .5s .18s both}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}}
@keyframes starIn2{0%{transform:translateY(-12px) scale(0) rotate(-40deg)}70%{transform:translateY(-12px) scale(1.4)}100%{transform:translateY(-12px) scale(1.15)}}
.big{font:700 52px var(--display);font-variant-numeric:tabular-nums;line-height:1;margin-top:6px}
.btns{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:18px auto 0}
.review{max-width:560px;margin:14px auto 0;text-align:left;display:flex;flex-direction:column;gap:8px}
.review div{background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;line-height:1.4}
.review b{font:600 15px var(--display);display:block}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px) rotate(-2deg)}40%,80%{transform:translateX(7px) rotate(2deg)}}

/* ---- Plus ou moins ---- */
.pm{display:flex;flex-direction:column;gap:12px;align-items:stretch;flex:1}
.pmc{position:relative;background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 18px 16px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.3);border-top:10px solid var(--c)}
.pmc .ic{width:44px;height:44px;margin:-4px auto 4px;color:var(--c)}
.pmc .nm{font:700 30px/1.1 var(--display);text-wrap:balance}
.pmc .vl{font:700 26px var(--display);color:var(--c);margin-top:6px;font-variant-numeric:tabular-nums;min-height:34px}
.pmc .un{font-size:14px;font-weight:700;color:var(--ink2)}
.pmc .q{font-size:15px;font-weight:700;color:var(--ink2);margin-top:4px}
.vs{align-self:center;width:52px;height:52px;margin:-26px 0;z-index:2;border-radius:50%;background:var(--gold);color:#3a2600;font:700 18px var(--display);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #8f600a}
.pmb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pmb button{height:58px;border-radius:14px;font:700 20px var(--display);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.pmb .up{background:#23a35a;box-shadow:0 4px 0 #157a40}.pmb .dn{background:#e0533f;box-shadow:0 4px 0 #a8382a}
.pmb button:active{transform:translateY(3px);box-shadow:none}
.pmc.win{box-shadow:0 0 0 4px var(--ok),0 6px 16px rgba(0,0,0,.3)}.pmc.lose{box-shadow:0 0 0 4px var(--ko),0 6px 16px rgba(0,0,0,.3)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{background:rgba(0,0,0,.2);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.cat svg{width:28px;height:28px;color:var(--gold);margin-bottom:4px}.cat b{font:600 16px var(--display)}.cat span{font-size:12.5px;color:var(--text2);font-weight:600}
.cat.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px var(--gold)}.cat.on span{color:var(--ink2)}.cat.on svg{color:var(--gold-deep)}

/* ---- Bataille navale ---- */
.nav{display:flex;flex-direction:column;gap:10px}
.board{position:relative;background:var(--sea);border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15),0 6px 16px rgba(0,0,0,.3)}
.board svg{display:block;width:100%;height:auto}
.board .land{fill:var(--land);stroke:#b7a77e;stroke-width:.8}
.board .grid{stroke:rgba(255,255,255,.35);stroke-width:1}
.board .glab{font-family:var(--display);font-weight:700;font-size:20px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:3px}
.board.eur .glab{font-size:30px}.board.world .glab{font-size:24px}.board.ell .glab{font-size:26px}
.coordrow{display:flex;align-items:center;gap:8px}.coordrow .chips{flex:1;min-width:0}
.hemi{flex:none;flex-wrap:nowrap}.hemi button{flex:none;min-width:40px;padding:8px 10px;font:700 16px var(--display)}.hemi button:disabled{opacity:.35}
.fixh{flex:none;font:700 18px var(--display);color:var(--gold);padding:0 6px}
.board .miss{fill:none;stroke:#fff;stroke-width:2.5;opacity:.9}
.board .hit{stroke:var(--ko);stroke-width:5;stroke-linecap:round}
.board .sunk{fill:#4a5560;stroke:#2c343b;stroke-width:2}
.board .aim{fill:rgba(244,183,62,.28);stroke:var(--gold);stroke-width:3}
.board .boom{animation:boom .6s ease-out}
@keyframes boom{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.4);opacity:1}100%{transform:scale(1)}}
.boom{transform-box:fill-box;transform-origin:center}
.fire{background:rgba(0,0,0,.2);border-radius:16px;padding:10px 12px}
.fire .lab{font:600 13px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin:2px 2px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips button{flex:none;min-width:42px;height:40px;padding:0 10px;border-radius:10px;background:var(--paper);color:var(--ink);font:700 16px var(--display);box-shadow:0 3px 0 var(--paper-edge);white-space:nowrap}
.chips button.on{background:var(--gold);color:#3a2600;box-shadow:0 3px 0 var(--gold-deep)}
.firerow{display:flex;align-items:center;gap:10px;margin-top:10px}
.target{flex:1;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.target small{display:block;font:600 12px var(--body);color:var(--text2)}
.firebtn{height:52px;padding:0 24px;border-radius:14px;background:linear-gradient(180deg,#ff7a5c,#d9452c);color:#fff;font:700 20px var(--display);box-shadow:0 4px 0 #9e2f1d}
.firebtn:disabled{opacity:.45;box-shadow:none}
.fleet{display:flex;flex-wrap:wrap;gap:6px 12px;font-weight:700;font-size:13px;color:var(--text2)}
.fleet span{display:inline-flex;align-items:center;gap:5px}.fleet i{display:inline-flex;gap:2px}.fleet i b{width:10px;height:10px;border-radius:2px;background:#cfd8dc}
.fleet .down{text-decoration:line-through;opacity:.6}.fleet .down i b{background:var(--ko)}
.teams{display:flex;gap:6px}
.team{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.22);font:600 14px var(--display);opacity:.6}
.team i{width:11px;height:11px;border-radius:50%;background:var(--t)}.team.on{opacity:1;box-shadow:0 0 0 2px var(--t)}

/* ---- Anachronismes ---- */
.scene{background:var(--paper);color:var(--ink);border-radius:18px;padding:18px 20px 20px;box-shadow:0 6px 16px rgba(0,0,0,.3);position:relative;border-top:10px solid var(--c)}
.scene .sk{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.scene h3{font:700 22px/1.15 var(--display);margin:2px 0 10px;text-wrap:balance}
.scene p{font-size:18px;line-height:1.75;margin:0;max-width:62ch}
.w{border-radius:5px;padding:1px 1px;cursor:pointer;transition:background .15s}
.w:hover{background:rgba(201,138,18,.18)}
.w.found{background:var(--ko);color:#fff;text-decoration:line-through;text-decoration-thickness:2px;padding:1px 4px}
.w.trap{background:rgba(60,207,118,.25);box-shadow:inset 0 -2px 0 var(--ok)}
.w.nope{background:rgba(0,0,0,.08)}
.w.missed{box-shadow:0 0 0 2px var(--ko);padding:1px 4px}
.w.hintme{animation:hint 1.2s ease-in-out 2}
@keyframes hint{50%{background:rgba(244,183,62,.6)}}
.pic{margin:0 0 12px}.pic svg{display:block;width:100%;height:auto;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pic [data-a]{cursor:pointer;transition:filter .15s}
@media (hover:hover){.pic [data-a]:hover{filter:brightness(1.12) drop-shadow(0 0 2px #fff)}}
.pic .ring{fill:none;stroke:var(--ko);stroke-width:3.5;pointer-events:none}.pic .ring.trap{stroke:#23a35a}.pic .ring.missed{stroke-dasharray:6 4}
.pic [data-a].hintme{animation:hintg .6s ease-in-out 4}
@keyframes hintg{50%{filter:drop-shadow(0 0 6px #f4b73e) brightness(1.4)}}
.expl{margin-top:12px;background:rgba(0,0,0,.22);border-radius:14px;padding:12px 14px;font-weight:600;line-height:1.45;min-height:66px}
.expl b{font:600 16px var(--display);display:block;margin-bottom:2px}
.expl.ok b{color:#8ff0b5}.expl.trap b{color:#ffe08a}.expl.nope b{color:var(--text2)}
.anabar{display:flex;align-items:center;gap:10px;margin-top:10px}
.anabar .cnt{flex:1;font:600 16px var(--display)}
.anabar .cnt i{display:inline-block;width:14px;height:14px;border-radius:4px;background:rgba(0,0,0,.25);margin-right:4px;vertical-align:-2px}.anabar .cnt i.on{background:var(--ko)}
.hintb{padding:9px 14px;border-radius:12px;background:rgba(0,0,0,.22);font:600 15px var(--display)}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

/* ---- Tri du musée ---- */
.mus{flex:1;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;min-height:190px;display:flex;align-items:center;justify-content:center}
.src{width:min(330px,100%);background:var(--paper);color:var(--ink);border-radius:16px;padding:16px 18px 18px;box-shadow:0 8px 18px rgba(0,0,0,.35);text-align:center;touch-action:none;cursor:grab;position:relative}
.src::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(244,183,62,.75);border-radius:3px;transform:rotate(-2deg)}
.src .lbl{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.src .tt{font:700 20px/1.25 var(--display);margin-top:6px;text-wrap:balance}
.src .step{display:inline-block;margin-top:10px;font:600 13px var(--display);padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.07);color:var(--ink2)}
.src.in{animation:slidein .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes slidein{0%{transform:translateX(120%) rotate(8deg);opacity:0}100%{transform:none;opacity:1}}
.src.fly{transition:transform .45s ease-in,opacity .45s;opacity:0}
.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bins.n4{grid-template-columns:repeat(4,1fr)}
.bins.n3{grid-template-columns:repeat(3,1fr)}
.bgroups{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.bgroup{background:rgba(0,0,0,.14);border-radius:16px;padding:8px;min-width:0}
.bgt{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);text-align:center;margin:0 0 6px}
.bgroup .bins.n3{grid-template-columns:minmax(0,1fr);gap:6px}
.bgroup .bin{min-height:64px;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;row-gap:1px;align-content:center;justify-items:start;text-align:left;padding:8px 12px}
.bgroup .bin svg{grid-row:span 2;width:26px;height:26px;align-self:center}
@media (max-width:640px){.bgroups{grid-template-columns:minmax(0,1fr)}.bgroup .bins.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.bgroup .bin{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px;min-height:84px;padding:8px 4px}.bgroup .bin span{font-size:11px;line-height:1.2}}
.bin{min-height:96px;border-radius:16px;background:rgba(0,0,0,.24);border:2.5px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;text-align:center;transition:all .15s}
.bin svg{width:30px;height:30px;color:var(--gold)}
.bin b{font:600 15px/1.15 var(--display)}.bin span{font-size:11.5px;color:var(--text2);font-weight:700;line-height:1.2}
.bin.hot{border-color:var(--gold);background:rgba(244,183,62,.18);transform:scale(1.04)}
.bin.good{border-style:solid;border-color:var(--ok);background:rgba(60,207,118,.2)}
.bin.bad{border-style:solid;border-color:var(--ko);background:rgba(255,90,78,.2)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(4deg) scale(1.03);filter:drop-shadow(0 16px 20px rgba(0,0,0,.4))}
.next{display:block;margin:10px auto 0;padding:10px 22px;border-radius:12px;background:var(--gold);color:#3a2600;font:700 17px var(--display);box-shadow:0 3px 0 var(--gold-deep)}
.mexpl{background:rgba(0,0,0,.22);border-radius:14px;padding:12px 14px;font-weight:600;line-height:1.45;text-align:center;min-height:50px}
/* quiz : paysage, climatogrammes, critique de source */
.qz{display:flex;flex-direction:column;gap:12px;padding-bottom:10px;max-width:680px;width:100%;margin:0 auto}
.qprog{text-align:center;font:600 14px var(--display);color:var(--text2)}
.qbar{height:6px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden}.qbar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .3s}
.qvis{background:var(--paper);border-radius:16px;padding:8px;box-shadow:0 6px 16px rgba(0,0,0,.3);width:100%}
.qvis svg{display:block;width:100%;height:auto;border-radius:10px}
.qvis.tap [data-k]{cursor:pointer}
@media (hover:hover){.qvis.tap g[data-k]:hover{filter:brightness(1.12) drop-shadow(0 0 2px #fff)}.qvis.tap .col:hover{fill:rgba(244,183,62,.18)}}
.qvis .ring{fill:none;stroke:#f4b73e;stroke-width:4;stroke-dasharray:8 5;pointer-events:none;animation:ringp 1.2s ease-in-out infinite}
.qvis .ring.ok,.qvis .ring.want{stroke:#23a35a;animation:none}.qvis .ring.want{stroke-dasharray:6 4}.qvis .ring.ko{stroke:#e5463b;stroke-dasharray:none;animation:none}
@keyframes ringp{50%{stroke-width:6;opacity:.75}}
.ccap{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;color:var(--ink2);font-size:12.5px;font-weight:700;padding:6px 4px 2px}
.ccap i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.qask{font:600 21px/1.25 var(--display);text-align:center;text-wrap:balance;padding:0 6px}

let A = null;
function anaParse(s){
  const out = []; let id = 0;
  s.x.split(/(\[\[[^\]]+\]\])/).forEach(part => {
    const m = /^\[\[([^|]+)\|([AP])\|([^\]]+)\]\]$/.exec(part);
    if (m) out.push({ id: id++, w: m[1], k: m[2], e: m[3] });
    else part.split(/(\s+)/).forEach(tok => {
      if (!tok) return;
      const mm = /^([«(“"]*)([\p{L}\p{N}’'-]+)([^\p{L}\p{N}]*)$/u.exec(tok);
      if (mm && /\p{L}/u.test(mm[2])){ if (mm[1]) out.push({ txt: mm[1] }); out.push({ id: id++, w: mm[2], k: 'N' }); if (mm[3]) out.push({ txt: mm[3] }); }
      else out.push({ txt: tok });
    });
  });
  return out;
}

      expl: 'Mois le plus chaud (' + dec(mx) + ' °C) − mois le plus froid (' + dec(mn) + ' °C) = ' + dec(mx - mn) + ' °C.', rev: 'L’amplitude thermique ' + aV(v[0]) };
  }
  if (kind === 'pluie' || kind === 'temp'){
    const isP = kind === 'pluie', arr = isP ? P : T;
    // un mois dont la valeur se lit bien (pas de pluie nulle)
    const m = pick(arr.map((x, i) => i).filter(i => !isP || arr[i] >= 20)), val = isP ? Math.round(arr[m] / 10) * 10 : Math.round(arr[m]);
    const st = isP ? (Math.max(...P) > 160 ? 50 : 20) : 5;
    const pool = [val - 2 * st, val - st, val + st, val + 2 * st].filter(x => !isP || x >= 0);
    const d = shuffle(pool).slice(0, 3), unit = isP ? ' mm' : ' °C';
    return { w: kind, pre: climPre(v), ask: isP ? 'Combien de <b>précipitations</b> tombe-t-il en ' + MOIS[m] + ' ?' : 'Quelle est la <b>température</b> moyenne en ' + MOIS[m] + ' ?',
      opts: d.concat(val).sort((p, q) => p - q).map(x => [String(x), '≈ ' + String(x).replace('-', '−') + unit]), want: String(val),
      expl: 'En ' + MOIS[m] + ', ' + (isP ? 'la barre bleue monte jusqu’à environ ' + arr[m] + ' mm (axe de droite).' : 'le point rouge est à environ ' + dec(arr[m]) + ' °C (axe de gauche).'),
      rev: (isP ? 'Les précipitations' : 'La température') + ' en ' + MOIS[m] + ' ' + aV(v[0]) };
  }
  // hémisphère : fait-il plus chaud en juin-juillet-août ou en décembre-janvier-février ?
  const north = T[5] + T[6] + T[7] > T[11] + T[0] + T[1];
  return { w: 'hemi', pre: climPre(v), ask: 'Cette ville se trouve-t-elle dans l’<b>hémisphère nord</b> ou dans l’<b>hémisphère sud</b> ?', opts: [['N', 'Hémisphère nord'], ['S', 'Hémisphère sud']], want: v[3],
    expl: (north ? 'Il fait plus chaud en juin-juillet-août : l’été tombe au milieu de l’année, c’est l’hémisphère nord.' : 'Il fait plus chaud en décembre-janvier-février : l’été tombe en fin et début d’année, c’est l’hémisphère sud.') + ' (' + who + ')', rev: 'L’hémisphère ' + deV(v[0]) };
}
function cliRead(v){
  const T = v[4], P = v[5], k = [];
  if (extremum(T, true)[1] >= .5) k.push('mois:chaud');
  if (extremum(T, false)[1] >= .5) k.push('mois:froid');
  if (extremum(P, true)[1] >= 5) k.push('mois:pluvieux');
  if (extremum(P, false)[1] >= 3) k.push('mois:sec');
  k.push('amp', 'temp');
  if (Math.max(...P) >= 20) k.push('pluie');
  if (Math.max(...T) - Math.min(...T) >= 6) k.push('hemi');
  return pick(k);
}
