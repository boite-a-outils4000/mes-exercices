  /* ---------- Climatogrammes pas à pas ---------- */
  climLab(){ this.cl = { plan: ['ex', 'f1', 'solo', 'solo', 'solo'], i: 0, ok: 0, done: 0 }; this.renderClim(); },
  newClim(){
    const R = Math.random, T = [
      { mean: 10.5, amp: 7.5, p: () => 55 + 30 * R() },
      { mean: 6, amp: 14, p: c => 30 + 50 * c + 10 * R() },
      { mean: 17, amp: 7.5, p: c => 80 - 75 * c + 10 * R() },
      { mean: 25, amp: 8, p: () => 8 * R() },
      { mean: 26.5, amp: .6, p: () => 160 + 140 * R(), eq: true },
      { mean: 26, amp: 3, p: c => 5 + 250 * c * c + 10 * R() }
    ];
    const t = T[Math.floor(R() * T.length)], south = !t.eq && R() < .35, temps = [], precs = [];
    for (let m = 0; m < 12; m++){
      const mm = south ? (m + 6) % 12 : m, c = (1 - Math.cos(2 * Math.PI * mm / 12)) / 2;
      temps.push(Math.round(t.mean - t.amp + 2 * t.amp * c + (R() - .5) * 1.2));
      precs.push(Math.max(0, Math.round(t.p(c) / 5) * 5));
    }
    const uniqMax = (a, step) => { const mx = Math.max(...a), ids = a.map((v, i) => v === mx ? i : -1).filter(i => i >= 0); if (ids.length > 1) a[ids[Math.floor(R() * ids.length)]] += step; };
    uniqMax(temps, 1); uniqMax(precs, 5);
    const hot = temps.indexOf(Math.max(...temps)), wet = precs.indexOf(Math.max(...precs)), tmax = temps[hot], tmin = Math.min(...temps);
    return { temps, precs, hot, wet, tmax, tmin, amp: tmax - tmin, hemi: t.eq ? null : ([4, 5, 6, 7, 8].includes(hot) ? 'Nord' : 'Sud') };
  },
  climSvg(c){
    const x0 = 40, x1 = 300, y0 = 22, y1 = 212, w = (x1 - x0) / 12;
    const tLo = Math.min(0, Math.floor((c.tmin - 2) / 10) * 10), tHi = Math.max(tLo + 30, Math.ceil((c.tmax + 2) / 10) * 10);
    const pMax = Math.max(100, Math.ceil(Math.max(...c.precs) * 1.1 / 50) * 50), pStep = pMax <= 150 ? 25 : 50;
    const yT = v => y1 - (v - tLo) / (tHi - tLo) * (y1 - y0), yP = v => y1 - v / pMax * (y1 - y0);
    let g = '';
    for (let v = tLo; v <= tHi; v += 5) g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + yT(v) + '" y2="' + yT(v) + '" style="stroke:var(--sep);stroke-width:' + (v === 0 ? 1.2 : .7) + '"/><text x="' + (x1 + 6) + '" y="' + (yT(v) + 3.5) + '" style="fill:var(--red);font-size:10px">' + v + '</text>';
    for (let v = 0; v <= pMax; v += pStep) g += '<text x="' + (x0 - 6) + '" y="' + (yP(v) + 3.5) + '" text-anchor="end" style="fill:var(--blue);font-size:10px">' + v + '</text>';
    const bars = c.precs.map((v, i) => '<rect x="' + (x0 + i * w + 3) + '" y="' + yP(v) + '" width="' + (w - 6) + '" height="' + (y1 - yP(v)) + '" rx="2" style="fill:var(--blue);opacity:.55"/>').join('');
    const pts = c.temps.map((v, i) => (x0 + i * w + w / 2) + ',' + yT(v)).join(' ');
    const dots = c.temps.map((v, i) => '<circle cx="' + (x0 + i * w + w / 2) + '" cy="' + yT(v) + '" r="3" style="fill:var(--red)"/>').join('');
    const months = 'JFMAMJJASOND'.split('').map((l, i) => '<text x="' + (x0 + i * w + w / 2) + '" y="' + (y1 + 15) + '" text-anchor="middle" style="fill:var(--label2);font-size:11px">' + l + '</text>').join('');
    return '<div class="climbox"><svg viewBox="0 0 340 236" role="img" aria-label="Climatogramme"><text x="' + (x0 - 6) + '" y="12" text-anchor="end" style="fill:var(--blue);font-size:10px;font-weight:600">mm</text><text x="' + (x1 + 6) + '" y="12" style="fill:var(--red);font-size:10px;font-weight:600">°C</text>' +
      g + bars + '<polyline points="' + pts + '" style="fill:none;stroke:var(--red);stroke-width:2.2;stroke-linejoin:round"/>' + dots + '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y1 + '" y2="' + y1 + '" style="stroke:var(--label3);stroke-width:1"/>' + months + '</svg>' +
      '<div class="clim-legend"><span><i style="background:var(--blue);opacity:.55"></i>Précipitations (mm)</span><span><i style="background:var(--red);height:3px;vertical-align:3px"></i>Températures (°C)</span></div></div>';
  },
  renderClim(){
    const L = this.cl, kind = L.plan[L.i];
    if (!kind) return this.labDone(I.clim, 'linear-gradient(160deg,#5ac8fa,#007aff)', 'Climatogrammes terminés', L.ok, L.done, 'réponses justes',
      L.ok === L.done ? 'Parfait : tu sais lire un climatogramme.' : 'Recommence avec d’autres climatogrammes : l’exemple résolu est toujours là pour t’aider.', () => this.climLab());
    const c = L.c = this.newClim();
    const MO = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'], MS = ['jan', 'fév', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
    const Q = [
      { k: 'hot', t: 'Le mois le plus chaud', how: 'Je cherche le point le plus haut de la courbe rouge.', ans: MO[c.hot], type: 'month', v: c.hot },
      { k: 'tmax', t: 'Sa température', how: 'Je lis l’axe rouge, à droite (°C).', ans: c.tmax + ' °C', type: 'num', v: c.tmax, tol: 1, unit: '°C' },
      { k: 'amp', t: 'L’amplitude thermique', how: 'Température du mois le plus chaud moins celle du mois le plus froid.', ans: c.tmax + ' − ' + (c.tmin < 0 ? '(' + c.tmin + ')' : c.tmin) + ' = ' + c.amp + ' °C', type: 'num', v: c.amp, tol: 2, unit: '°C' },
      { k: 'wet', t: 'Le mois le plus pluvieux', how: 'Je cherche la barre bleue la plus haute.', ans: MO[c.wet], type: 'month', v: c.wet }
    ];
    if (c.hemi) Q.push({ k: 'hemi', t: 'L’hémisphère', how: 'S’il fait le plus chaud en juin, juillet ou août : hémisphère Nord. En décembre, janvier ou février : hémisphère Sud.', ans: 'hémisphère ' + c.hemi, type: 'hemi', v: c.hemi });
    const given = kind === 'ex' ? Q.length : kind === 'f1' ? 2 : 0;
    const step = (n, q, i) => {
      const done = i < given;
      let inner = '<div style="color:var(--label2);font-size:15px">' + q.how + '</div>';
      if (done) inner += '<div class="ans">→ ' + esc(q.ans) + '</div>';
      else if (q.type === 'month') inner += '<div class="mgrid" data-q="' + i + '">' + MS.map((m, j) => '<button data-m="' + j + '">' + m + '</button>').join('') + '</div>';
      else if (q.type === 'num') inner += '<div class="num-in"><input data-q="' + i + '" inputmode="decimal" autocomplete="off" aria-label="' + esc(q.t) + '"><span>' + q.unit + '</span></div>';
      else inner += '<div class="mgrid" style="grid-template-columns:1fr 1fr" data-q="' + i + '"><button data-m="Nord">Nord</button><button data-m="Sud">Sud</button></div>';
      return '<div class="step"><span class="n' + (done ? ' done' : '') + '">' + (done ? I.check : n) + '</span><div class="b"><b>' + q.t + '</b>' + inner + '<div class="res" id="cr' + i + '"></div></div></div>';
    };
    const titles = { ex: 'Exemple résolu', f1: 'À toi : la suite', solo: 'À toi tout seul' };
    $app.innerHTML = this.labTop(L.i, L.plan.length, 'Climatogrammes · ' + titles[kind]) +
      '<div class="problem">Voici le climatogramme d’une ville. ' + (kind === 'ex' ? 'Regarde comment on le lit, étape par étape.' : 'Lis-le pour répondre.') + '</div>' + this.climSvg(c) +
      '<div class="steps">' + Q.map((q, i) => step(i + 1, q, i)).join('') + '</div>' +
      (kind === 'ex' ? '<button class="btn mt2" id="go">J’ai compris, à moi !</button>' : '<button class="btn mt" id="chk">Vérifier</button>') + '<div id="sfb"></div></div></div>';
    this.labQuit();
    const go = document.getElementById('go'); if (go) go.onclick = () => { L.i++; this.renderClim(); };
    const pick = {};
    $app.querySelectorAll('.mgrid').forEach(gr => gr.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { if (L.lk) return; pick[gr.dataset.q] = b.dataset.m; gr.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); }));
    L.lk = false;
    const chk = document.getElementById('chk'); if (!chk) return;
    chk.onclick = () => {
      const todo = Q.map((q, i) => i).filter(i => i >= given);
      if (todo.some(i => Q[i].type === 'num' ? parseN($app.querySelector('input[data-q="' + i + '"]').value) == null : pick[i] == null)) return toast('Réponds à chaque étape');
      L.lk = true; let all = true;
      todo.forEach(i => {
        const q = Q[i]; let ok;
        if (q.type === 'num'){ const inp = $app.querySelector('input[data-q="' + i + '"]'); ok = Math.abs(parseN(inp.value) - q.v) <= q.tol; inp.classList.add(ok ? 'ok' : 'ko'); inp.readOnly = true; }
        else { ok = String(pick[i]) === String(q.v); const gr = $app.querySelector('.mgrid[data-q="' + i + '"]'); gr.querySelectorAll('[data-m]').forEach(b => { b.classList.remove('on'); if (b.dataset.m === String(q.v)) b.classList.add('ok'); else if (b.dataset.m === String(pick[i])) b.classList.add('ko'); }); }
        L.done++; if (ok) L.ok++; else all = false;
        document.getElementById('cr' + i).innerHTML = '<span style="color:var(--' + (ok ? 'green' : 'red') + ');font-weight:600">' + (ok ? 'Juste' : 'Réponse : ' + esc(q.ans)) + '</span>' + (ok && q.type === 'num' && q.k === 'amp' ? ' : ' + esc(q.ans) : '');
      });
      chk.remove();
      document.getElementById('sfb').innerHTML = '<div class="' + (all ? 'msg-card' : 'hint-box') + '" style="margin-top:16px">' + (all ? '<b>Bravo, tout est juste !</b>' : '<b>Regarde les corrections</b> sous chaque étape, puis compare avec le graphique.') + '</div><button class="btn mt" id="nx">Continuer</button>';
      document.getElementById('nx').onclick = () => { L.i++; this.renderClim(); };
    };
  },

  async startEval(id){
    loading();
    const { data, error } = await sb.rpc('student_eval_start', { p_code: this.code, p_eval_id: id });
    if (error || !data){ toast(error ? 'Connexion impossible, réessaie' : 'Évaluation introuvable'); return this.loadList(); }
    if (data.status === 'done' || data.status === 'closed') return this.examDone(data);
    this.ev = data;
    const order = seededShuffle(data.questions || [], (data.student_id || '') + data.evaluation_id);
    const ans = {}; (data.answers || []).forEach(a => { ans[a.qid] = a; });
    this.set = { assignment_id: null, title: data.title, pass_score: 0, questions: order, previously_missed: [] };
    this.exam = true; this.examLocked = false; this.preview = false; this.practice = false;
    this.sess = { queue: order.map(q => ({ q, repeat: 0 })), first: {}, given: {}, hintUsed: {}, idx: 0, start: Date.now(), total: order.length, locked: false };
    order.forEach(q => { if (ans[q.id]){ this.sess.first[q.id] = !!ans[q.id].correct; this.sess.given[q.id] = ans[q.id].given; } });
    this.sess.idx = order.filter(q => ans[q.id]).length;
    this.examArm();
    if (data.status === 'locked'){ this.examLocked = true; return this.examLockScreen(); }
    this.renderQuestion();
  },

  examArm(){
    this.examDisarm();
    this._evPoll = setInterval(async () => {
      if (!this.exam || this.examLocked) return;
      const { data } = await sb.rpc('student_eval_status', { p_code: this.code, p_eval_id: this.ev.evaluation_id });
      if (!data || !this.exam) return;
      if (data.status === 'done' || data.eval_status === 'closed'){ this.examDisarm(); this.exam = false; this.examDone(data); }
      else if (data.status === 'locked' && !this.examLocked){ this.examLocked = true; this.examLockScreen(); }
    }, 15000);
    if (!this.ev.anticheat) return;
    const lock = reason => this.examLock(reason);
    this._onVis = () => { if (document.visibilityState === 'hidden') lock('Changement d’application ou d’onglet'); };
    this._onBlur = () => { clearTimeout(this._blurT); this._blurT = setTimeout(() => { if (!document.hasFocus()) lock('Sortie de la page'); }, 1200); };
    this._onFocus = () => clearTimeout(this._blurT);
    this._onHide = () => lock('Page fermée ou rechargée');
    document.addEventListener('visibilitychange', this._onVis);
    window.addEventListener('blur', this._onBlur);
    window.addEventListener('focus', this._onFocus);
    window.addEventListener('pagehide', this._onHide);
  },
  examDisarm(){
    clearInterval(this._evPoll); clearInterval(this._lockPoll); clearTimeout(this._blurT);
    if (this._onVis) document.removeEventListener('visibilitychange', this._onVis);
    if (this._onBlur) window.removeEventListener('blur', this._onBlur);
    if (this._onFocus) window.removeEventListener('focus', this._onFocus);
    if (this._onHide) window.removeEventListener('pagehide', this._onHide);
    this._onVis = this._onBlur = this._onFocus = this._onHide = null;
  },
  examLock(reason){
    if (!this.exam || this.examLocked) return;
    this.examLocked = true; TTS.stop();
    sb.rpc('student_eval_lock', { p_code: this.code, p_eval_id: this.ev.evaluation_id, p_reason: reason }).then(() => {}, () => {});
    this.examLockScreen();
  },
  examLockScreen(){
    clearInterval(this._lockPoll);
    const s = this.sess, answered = Object.keys(s.first).length;
    $app.innerHTML = '<div class="screen center" style="text-align:center"><div class="app-icon" style="background:linear-gradient(160deg,#ff6b5e,#d92a1c);box-shadow:none">' + I.lock + '</div>' +
      '<h1 class="large" style="font-size:30px">Évaluation bloquée</h1><p class="subtitle" style="margin:8px 0 22px">Tu as quitté l’appli pendant l’évaluation. Lève la main : seul ton professeur peut la débloquer.</p>' +
      '<div class="group" style="text-align:left"><div class="row"><div class="main t">Réponses enregistrées</div><span class="val">' + answered + ' sur ' + s.total + '</span></div></div>' +
      '<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-top:22px;color:var(--label2);font-size:15px"><span class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></span>En attente du professeur…</div>' +
      (window.__DEMO__ ? '<button class="btn plain mt2" id="demoun">Démo : simuler le déblocage par le professeur</button>' : '') + '</div>';
    const du = document.getElementById('demoun'); if (du) du.onclick = () => sb.rpc('demo_unlock', { p_code: this.code, p_eval_id: this.ev.evaluation_id });
    this._lockPoll = setInterval(async () => {
      const { data } = await sb.rpc('student_eval_status', { p_code: this.code, p_eval_id: this.ev.evaluation_id });
      if (!data || !this.exam) return;
      if (data.status === 'in_progress'){ clearInterval(this._lockPoll); this.examLocked = false; toast('Ton professeur a débloqué l’évaluation'); this.renderQuestion(); }
      else if (data.status === 'done' || data.eval_status === 'closed'){ this.examDisarm(); this.exam = false; this.examDone(data); }
    }, 3000);
  },
  examAnswers(){
    const s = this.sess;
    return this.set.questions.filter(q => q.id in s.first).map(q => ({ qid: q.id, correct: !!s.first[q.id], given: s.given[q.id] ?? null }));
  },
  examSave(){
    sb.rpc('student_eval_save', { p_code: this.code, p_eval_id: this.ev.evaluation_id, p_current: this.sess.idx, p_answers: this.examAnswers() }).then(({ data }) => {
      if (!this.exam) return;
      if (data === 'locked' && !this.examLocked){ this.examLocked = true; this.examLockScreen(); }
      else if (data === 'closed' || data === 'done'){ this.examDisarm(); this.exam = false; this.examDone({ status: 'done' }); }
    }, () => {});
  },
  async examFinish(){
    $app.innerHTML = '<div class="screen center"><div class="spinner" style="margin:0 auto 16px"></div><p style="text-align:center;color:var(--label2)">Envoi de ta copie…</p></div>';
    const { data, error } = await sb.rpc('student_eval_finish', { p_code: this.code, p_eval_id: this.ev.evaluation_id, p_answers: this.examAnswers() });
    if (error){
      $app.innerHTML = '<div class="screen center"><div class="empty"><b>Ta copie n’a pas pu être envoyée</b>Vérifie ta connexion internet puis réessaie. Tes réponses sont déjà enregistrées au fur et à mesure.</div><button class="btn mt" id="retry">Réessayer l’envoi</button></div>';
      document.getElementById('retry').onclick = () => this.examFinish();
      return;
    }
    this.examDisarm(); this.exam = false;
    this.examDone(data);
  },

  runMistakes(){
    const mis = this.mistakes(); if (!mis.length) return;
    this.practice = true; this.practiceKind = 'mistakes'; this.conf = false;
    const qs = shuffle(mis).slice(0, 15).map(m => ({ ...m.question, id: m.assignment_id + ':' + m.question.id, _aid: m.assignment_id, _qid: m.question.id, _from: m.set_title }));
    this.set = { assignment_id: null, title: 'Mes erreurs', pass_score: 0, questions: qs, previously_missed: [] };
    this.startSession();
  },

  runKey(){ return 'exos_run_' + this.code + '_' + this.set.assignment_id; },
  loadRun(){
    if (this.preview || this.practice || !this.set.assignment_id) return null;
    try {
      const r = JSON.parse(store.get(this.runKey()) || 'null'); if (!r) return null;
      const ids = this.set.questions.map(q => q.id);
      if (r.sig !== ids.join(',') || !r.queue.length || r.idx >= r.queue.length) return null;
      return r;
    } catch(e){ return null; }
  },
  saveRun(){
    if (this.preview || this.practice || !this.set.assignment_id) return;
    const s = this.sess;
    store.set(this.runKey(), JSON.stringify({ sig: this.set.questions.map(q => q.id).join(','), queue: s.queue.map(x => [x.q.id, x.repeat]), first: s.first, given: s.given, hintUsed: s.hintUsed, idx: s.idx, elapsed: Date.now() - s.start, total: s.total, qs: s.qs ? s.qs.map(q => q.id) : null }));
  },
  clearRun(){ if (this.set && this.set.assignment_id) store.del(this.runKey()); },
  resumeSession(r){
    const byId = {}; this.set.questions.forEach(q => { byId[q.id] = q; });
    this.sess = { queue: r.queue.map(([id, rep]) => ({ q: byId[id], repeat: rep })), first: r.first || {}, given: r.given || {}, hintUsed: r.hintUsed || {}, idx: r.idx, start: Date.now() - (r.elapsed || 0), total: r.total, locked: false, qs: r.qs ? r.qs.map(id => byId[id]).filter(Boolean) : null };
    this.renderQuestion();
  },

  async open(id){
    this.conf = false; this.practice = false;
    loading();
    const { data, error } = await sb.rpc('student_get_set', { p_code: this.code, p_assignment_id: id });
    if (error || !data){ toast('Impossible d\u2019ouvrir cet exercice'); return this.loadList(); }
    if (data.control && data.control.available && !anchorInfo(data.passes, data.anchor).anchored) data.control.available = false;
    this.set = data; this.renderIntro();
  },

  renderIntro(){
    const s = this.set, info = this.list.find(a => a.id === s.assignment_id) || {};
    const missed = (s.previously_missed || []).length;
    const saved = this.loadRun();
    const C = s.control;
    const ctlCard = !C ? '' : C.done
      ? '<div class="evcard"><span class="pill ' + (C.percent >= s.pass_score ? 'green' : 'orange') + '">Test de contrôle fait</span><div class="ev-title">' + C.score + ' / ' + C.total + ' · ' + C.percent + ' %</div>' +
        (s.eval_before != null ? '<div style="color:var(--label2);font-size:15px">À l\u2019évaluation : ' + s.eval_before + ' %. ' + (C.percent > s.eval_before ? 'Tu as progressé de ' + (C.percent - s.eval_before) + ' points, bravo !' : 'Continue à t\u2019entraîner : ton professeur voit tes efforts.') + '</div>' : '<div style="color:var(--label2);font-size:15px">Ton professeur voit ton résultat.</div>') + '</div>'
      : C.available
        ? '<div class="evcard"><span class="pill blue">Débloqué</span><div class="ev-title">Test de contrôle</div><div style="color:var(--label2);font-size:15px">Tu as acquis la série. Montre maintenant ce que tu as retenu : ' + C.count + ' questions nouvelles, un seul essai, la correction à la fin.</div><button class="btn mt" id="ctlgo">Commencer le test</button></div>'
        : '';
    $app.innerHTML = nav('<button class="nav-btn" id="back">' + I.chevL + '<span>Mes exercices</span></button>') +
      '<div class="wrap notab"><h1 class="large">' + esc(s.title) + '</h1>' + (s.subject ? '<p class="subtitle">' + esc(s.subject) + '</p>' : '') + ctlCard +
      (s.description ? '<div class="group inner-pad" style="padding:14px 16px;line-height:1.45">' + esc(s.description).replace(/\n/g,'<br>') + '</div>' : '') +
      (s.recap ? '<div class="recap mt"><div class="recap-h">Je retiens</div><div class="course-text">' + mdLite(s.recap) + '</div></div>' : '') +
      (s.course_id ? '<div class="group mt"><button class="row" id="course"><span style="color:var(--blue);display:flex">' + I.book + '</span><div class="main"><div class="t">Revoir le cours</div><div class="s">' + esc(s.course_title || '') + '</div></div><span class="chev">' + I.chevR + '</span></button></div>' : '') +
      '<div class="group mt">' +
      '<div class="row"><div class="main t">Questions</div><span class="val">' + (s.draw_count && s.draw_count < s.questions.length ? s.draw_count + ', nouvelles à chaque essai' : s.questions.length) + '</span></div>' +
      '<div class="row"><div class="main t">Pour valider</div><span class="val">' + s.pass_score + ' %</span></div>' +
      ((s.anchor || 1) > 1 && s.assignment_id ? (() => { const n = anchorInfo(s.passes, s.anchor); return '<div class="row"><div class="main t">Ancrage</div><span class="val">' + (n.anchored ? 'Acquise ✓' : n.level + ' réussite' + (n.level > 1 ? 's' : '') + ' sur ' + n.anchor + (n.next ? (n.due ? ' · à refaire maintenant' : ' · prochaine le ' + fmtDate(n.next)) : '')) + '</span></div>'; })() : '') +
      (C && !C.available && !C.done ? '<div class="row"><div class="main t">Ensuite</div><span class="val">Test de contrôle (' + C.count + ' questions)' + ((s.anchor || 1) > 1 ? ', une fois la série acquise' : '') + '</span></div>' : '') +
      (info.due_date ? '<div class="row"><div class="main t">À faire pour le</div><span class="val">' + fmtDate(info.due_date) + '</span></div>' : '') +
      (info.attempt_count ? '<div class="row"><div class="main t">Tes essais</div><span class="val">' + info.attempt_count + ' · meilleur ' + info.best_percent + ' %</span></div>' : '') +
      '</div>' +
      (missed && !saved ? '<p class="foot">Les ' + missed + ' question' + (missed > 1 ? 's' : '') + ' ratée' + (missed > 1 ? 's' : '') + ' la dernière fois arrivent en premier.</p>' : '') +
      (saved
        ? '<button class="btn mt2" id="resume">Reprendre où tu t’étais arrêté</button><p class="foot" style="text-align:center">' + Object.keys(saved.first).length + ' question' + (Object.keys(saved.first).length > 1 ? 's' : '') + ' déjà faite' + (Object.keys(saved.first).length > 1 ? 's' : '') + ' sur ' + saved.total + '</p><button class="btn plain" id="startq">Recommencer depuis le début</button>'
        : '<button class="btn ' + (C && C.available ? 'plain mt' : 'mt2') + '" id="startq">' + (C && C.available ? 'Refaire la série pour réviser' : info.attempt_count ? 'Recommencer' : 'Commencer') + '</button>') + '</div>';
    document.getElementById('back').onclick = () => this.loadList();
    const sq = document.getElementById('startq'); if (sq) sq.onclick = () => { this.clearRun(); this.startSession(); };
    const rs = document.getElementById('resume'); if (rs) rs.onclick = () => this.resumeSession(saved);
    const cg = document.getElementById('ctlgo'); if (cg) cg.onclick = () => this.startControl();
    const cb = document.getElementById('course'); if (cb) cb.onclick = () => this.courseSheet(s.course_id);
  },

  drawQuestions(){
    const all = this.set.questions || [], n = this.set.draw_count;
    if (!n || n >= all.length) return null;
    const missed = new Set(this.set.previously_missed || []), seen = new Set(this.set.last_seen || []);
    const a = shuffle(all.filter(q => missed.has(q.id))).slice(0, Math.ceil(n / 2));
    const b = shuffle(all.filter(q => !missed.has(q.id) && !seen.has(q.id)));
    const c = shuffle(all.filter(q => !missed.has(q.id) && seen.has(q.id)));
    return [...a, ...b, ...c].slice(0, n);
  },
  startSession(){
    const drawn = this.drawQuestions(), qs = drawn || this.set.questions || [];
    const missed = new Set(this.set.previously_missed || []);
    const ordered = [...shuffle(qs.filter(q => missed.has(q.id))), ...shuffle(qs.filter(q => !missed.has(q.id)))];
    this.sess = { queue: ordered.map(q => ({ q, repeat: 0 })), first: {}, given: {}, hintUsed: {}, idx: 0, start: Date.now(), total: qs.length, locked: false, qs: drawn };
    this.renderQuestion();
  },

  exit(){
    TTS.stop();
    this.conf = false;
    this.ctl = false;
    if (this.preview){ this.preview = false; route(); } else { this.practice = false; this.loadList(); }
  },

  renderQuestion(){
    TTS.stop();
    const s = this.sess, it = s.queue[s.idx];
    if (!it) return this.finish();
    s.locked = false;
    const q = it.q, done = Object.keys(s.first).length;
    const T = this.exam || this.ctl;
    const check = '<div class="check-wrap" id="cw"><button class="btn" id="verif">' + (T ? 'Valider ma réponse' : 'Vérifier') + '</button></div>';
    const hint = q.hint && !T ? '<button class="hint-btn" id="hintb">' + I.bulb + ' Voir l’indice</button><div class="hint-box" id="hintx" hidden>' + esc(q.hint) + '</div>' : '';
    let body = '', speech = '', order = null;
    if (q.type === 'qcm'){
      order = shuffle(q.options.map((t, i) => i));
      body = '<div class="qprompt">' + nb(esc(q.prompt)) + '</div>' + hint + '<div>' + order.map(i => '<button class="opt" data-i="' + i + '">' + esc(q.options[i]) + '</button>').join('') + '</div>';
      speech = q.prompt + '. ' + order.map((i, k) => 'Réponse ' + (k + 1) + ' : ' + q.options[i]).join('. ');
    } else if (q.type === 'vf'){
      body = '<div class="qprompt">' + nb(esc(q.prompt)) + '</div>' + hint + '<div class="vf"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div>';
      speech = q.prompt + '. Vrai ou faux ?';
    } else if (q.type === 'trous'){
      let k = 0;
      const parts = parseTrous(q.text).map(p => {
        if (!p.blank) return esc(p.text).replace(/\n/g, '<br>');
        const w = Math.max(5, ...p.answers.map(a => a.length)) + 2;
        return '<input class="blank" data-b="' + (k++) + '" style="width:' + Math.min(w, 26) + 'ch" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Trou ' + k + '">';
      }).join('');
      body = '<div class="qprompt" style="font-size:19px">' + esc(q.prompt || 'Complète le texte.') + '</div>' + hint + '<div class="trous-text">' + parts + '</div>' + check;
      speech = (q.prompt || 'Complète le texte.') + ' ' + String(q.text).replace(/\{[^}]*\}/g, ', blanc, ');
    } else if (q.type === 'chrono'){
      order = shuffle(q.items.map((t, i) => i));
      for (let k = 0; k < 6 && order.every((v, i) => v === i); k++) order = shuffle(order);
      body = '<div class="qprompt">' + nb(esc(q.prompt || 'Remets dans l’ordre chronologique.')) + '</div>' + hint +
        '<p class="foot" style="margin:-14px 0 2px">En haut : ' + esc(q.top || 'le plus ancien') + '. En bas : ' + esc(q.bottom || 'le plus récent') + '. Utilise les flèches.</p><div id="chl"></div>' + check;
      speech = (q.prompt || 'Remets dans l’ordre chronologique.') + '. ' + order.map((i, k) => (k + 1) + ' : ' + q.items[i]).join('. ');
    } else if (q.type === 'assoc'){
      const rights = shuffle(q.pairs.map(p => p.b));
      body = '<div class="qprompt">' + nb(esc(q.prompt || 'Associe chaque élément à sa paire.')) + '</div>' + hint +
        '<div class="group">' + q.pairs.map((p, k) => '<div class="row leg-row as-row"><div class="as-a">' + esc(p.a) + '</div><select class="field leg" data-l="' + k + '" aria-label="Associer à ' + esc(p.a) + '"><option value="">Choisir…</option>' + rights.map(r => '<option>' + esc(r) + '</option>').join('') + '</select></div>').join('') + '</div>' + check;
      speech = (q.prompt || 'Associe chaque élément à sa paire.') + '. ' + q.pairs.map(p => p.a).join(', ') + '. Les réponses possibles sont : ' + rights.join(', ') + '.';
    } else if (q.type === 'classer'){
      order = shuffle(q.items.map((t, i) => i));
      body = '<div class="qprompt">' + nb(esc(q.prompt || 'Classe chaque élément dans la bonne catégorie.')) + '</div>' + hint +
        '<div class="group">' + order.map(i => '<div class="row cl-row" data-ci="' + i + '"><div class="cl-t">' + esc(q.items[i].text) + '</div><div class="seg cl-seg">' + q.categories.map((c, j) => '<button data-ci="' + i + '" data-cj="' + j + '">' + esc(c) + '</button>').join('') + '</div></div>').join('') + '</div>' + check;
      speech = (q.prompt || 'Classe chaque élément.') + ' Catégories : ' + q.categories.join(', ') + '. Éléments : ' + order.map(i => q.items[i].text).join(', ') + '.';
    } else if (q.type === 'etapes'){
      body = (q.prompt ? '<div class="qprompt" style="font-size:19px">' + nb(esc(q.prompt)) + '</div>' : '') + hint +
        q.steps.map((st, k) => '<div class="stp" data-s="' + k + '"><div class="stp-h">Étape ' + (k + 1) + '</div><div class="stp-q">' + nb(esc(st.prompt)) + '</div>' +
          (st.kind === 'qcm' ? shuffle(st.options.map((o, j) => j)).map(j => '<button class="opt sopt" data-s="' + k + '" data-j="' + j + '">' + esc(st.options[j]) + '</button>').join('')
            : st.kind === 'vf' ? '<div class="vf"><button class="opt sopt" data-s="' + k + '" data-j="1">Vrai</button><button class="opt sopt" data-s="' + k + '" data-j="0">Faux</button></div>'
            : '<input class="field sinp" data-s="' + k + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse">') + '</div>').join('') + check;
      speech = (q.prompt ? q.prompt + '. ' : '') + q.steps.map((st, k) => 'Étape ' + (k + 1) + ' : ' + st.prompt).join('. ');
    } else if (q.type === 'nombre'){
      body = '<div class="qprompt">' + nb(esc(q.prompt)) + '</div>' + hint +
        '<div class="num-row"><input class="field numq" id="numin" inputmode="decimal" autocomplete="off" placeholder="Ta réponse">' + (q.unit ? '<span class="num-u">' + esc(q.unit) + '</span>' : '') + '</div>' + check;
      speech = q.prompt;
    } else if (q.type === 'frise'){
      const span = q.end - q.start, stp = [1, 2, 5, 10, 20, 25, 50, 100].find(x => span / x <= 6) || 100;
      const ticks = []; for (let y = Math.ceil(q.start / stp) * stp; y <= q.end; y += stp) ticks.push(y);
      const pct = y => (y - q.start) / span * 100;
      body = '<div class="qprompt">' + nb(esc(q.prompt || 'Place chaque événement sur la frise.')) + '</div>' + hint +
        '<div class="fr-axis" id="frax"><div class="fr-line"></div>' + ticks.map(y => '<span class="fr-tick" style="left:' + pct(y) + '%"><i></i>' + y + '</span>').join('') +
        q.events.map((e, k) => '<span class="pin fr-pin" data-fp="' + k + '" style="left:50%" hidden>' + (k + 1) + '</span>').join('') + '</div>' +
        '<div class="group mt">' + q.events.map((e, k) => '<div class="row fr-row" data-fr="' + k + '"><div class="fr-h"><span class="pin static">' + (k + 1) + '</span><span class="fr-l">' + esc(e.label) + '</span><b class="fr-y" data-fy="' + k + '">?</b></div>' +
          '<input type="range" class="fr-r" data-k="' + k + '" min="' + q.start + '" max="' + q.end + '" step="1" value="' + Math.round((q.start + q.end) / 2) + '" aria-label="Année de ' + esc(e.label) + '"></div>').join('') + '</div>' +
        '<p class="foot" style="margin:6px 0 0">Fais glisser chaque curseur jusqu’à la bonne année' + (q.tol ? ' (à ' + q.tol + ' an' + (q.tol > 1 ? 's' : '') + ' près)' : '') + '.</p>' + check;
      speech = (q.prompt || 'Place chaque événement sur la frise.') + ' De ' + q.start + ' à ' + q.end + '. ' + q.events.map(e => e.label).join('. ');
    } else if (q.type === 'intrus'){
      order = shuffle(q.items.map((t, i) => i));
      body = '<div class="qprompt">' + nb(esc(q.prompt || 'Trouve l’intrus.')) + '</div>' + hint + '<div class="intrus-grid">' + order.map(i => '<button class="opt" data-i="' + i + '">' + esc(q.items[i]) + '</button>').join('') + '</div>';
      speech = (q.prompt || 'Trouve l’intrus.') + ' ' + order.map(i => q.items[i]).join(', ') + '.';
    } else if (q.type === 'vfc'){
      body = '<div class="qprompt" style="font-size:19px">' + nb(esc(q.prompt || 'Vrai ou faux ? Si c’est faux, corrige.')) + '</div>' + hint +
        '<div class="vfc-text" id="vfct">' + vfcParse(q.text).map((x, k) => (k && !/^[,.;:!?)»]/.test(x.w) ? ' ' : '') + '<span class="vw" data-w="' + k + '">' + esc(x.w) + '</span>').join('') + '</div>' +
        '<div class="vf" id="vfcb"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div><div id="vfcfix"></div>';
      speech = vfcShown(q.text) + '. Vrai ou faux ?';
    } else if (q.type === 'lien'){
      order = shuffle(q.lines.map((t, i) => i));
      body = '<div class="qprompt">' + nb(esc(q.prompt || 'Relie les deux faits par « donc » ou « parce que ».')) + '</div>' + hint +
        '<div class="group">' + order.map(i => '<div class="row cl-row" data-ci="' + i + '"><div class="cl-t">' + esc(q.lines[i].a) + '</div><div class="seg cl-seg">' + LIENS.map((c, j) => '<button data-ci="' + i + '" data-cj="' + j + '">… ' + c + ' …</button>').join('') + '</div><div class="cl-t">' + esc(q.lines[i].b) + '</div></div>').join('') + '</div>' + check;
      speech = (q.prompt || 'Relie les deux faits.') + ' ' + order.map(i => q.lines[i].a + ', donc ou parce que, ' + q.lines[i].b).join('. ');
    } else if (q.type === 'clic'){
      body = '<div class="qprompt">' + nb(esc(q.prompt || ('Touche ' + (q.label || 'le bon endroit') + ' sur la carte.'))) + '</div>' + hint +
        '<div class="img-wrap clic-wrap" id="clk"><img src="' + esc(q.image) + '" alt="Carte"></div><p class="foot" id="clkh" style="margin:6px 0 0">Touche la carte pour placer ton repère. Tu peux le déplacer avant de valider.</p>' + check;
      speech = (q.prompt || ('Touche ' + (q.label || 'le bon endroit') + ' sur la carte.'));
    } else {
      const labels = shuffle(q.points.map(p => p.label));
      body = '<div class="qprompt">' + nb(esc(q.prompt || 'Légende l’image.')) + '</div>' + hint +
        '<div class="img-wrap"><img src="' + esc(q.image) + '" alt="">' + q.points.map((p, k) => '<span class="pin" data-pin="' + k + '" style="left:' + p.x + '%;top:' + p.y + '%">' + (k + 1) + '</span>').join('') + '</div>' +
        '<div class="group mt">' + q.points.map((p, k) => '<div class="row leg-row"><span class="pin static" data-pinl="' + k + '">' + (k + 1) + '</span><select class="field leg" data-l="' + k + '" aria-label="Légende du repère ' + (k + 1) + '"><option value="">Choisir la légende…</option>' + labels.map(l => '<option>' + esc(l) + '</option>').join('') + '</select></div>').join('') + '</div>' + check;
      speech = (q.prompt || 'Légende l’image.') + '. Choisis la bonne légende pour chaque numéro. Les légendes possibles sont : ' + labels.join(', ') + '.';
    }
    $app.innerHTML = '<div class="quiz"><div class="quiz-top">' + (this.exam ? '<span class="pill green" style="flex:none">Évaluation</span>' : '<button class="icon-btn mute" id="quit" aria-label="Quitter">' + I.x + '</button>') +
      '<div class="bar"><i style="width:' + (done / s.total * 100) + '%"></i></div><span class="counter">' + Math.min(done + (it.repeat ? 0 : 1), s.total) + '/' + s.total + '</span>' + (this.set.recap || this.set.course_id ? '<button class="icon-btn" id="crs" aria-label="Revoir le cours">' + I.book + '</button>' : '') + '</div>' +
      (q._from ? '' : '') +
      '<div class="quiz-body">' + (it.repeat ? '<span class="pill orange" style="margin-bottom:12px">On revient sur cette question</span>' : '') +
      (q._from ? '<p class="foot" style="margin:0 0 8px">Série : ' + esc(q._from) + '</p>' : '') +
      '<div class="qhead"><div class="qtype">' + TYPE_LABEL[q.type] + '</div>' + (TTS.ok ? '<button class="speak" id="speak" aria-label="Écouter la question">' + I.speaker + ' Écouter</button>' : '') + '</div>' +
      (q.doc && q.type !== 'image' && q.type !== 'clic' ? '<div class="docbox"><div class="doc-label">' + (q.doc.pin ? 'Carte' : 'Document') + '</div>' + (q.doc.image ? (q.doc.pin ? '<div class="img-wrap" style="margin-bottom:4px"><img src="' + esc(q.doc.image) + '" alt="Carte muette"><span class="pin target" style="left:' + q.doc.pin.x + '%;top:' + q.doc.pin.y + '%">?</span></div>' : '<img src="' + esc(q.doc.image) + '" alt="Document">') : '') +
        (q.doc.text ? '<div class="doc-text">' + nb(esc(q.doc.text)).replace(/\n/g, '<br>') + '</div>' : '') + (q.doc.source ? '<div class="doc-src">' + esc(q.doc.source) + '</div>' : '') + '</div>' : '') +
      body + '</div><div class="feedback" id="fb"></div></div>';
    window.scrollTo(0, 0);
    if (q.doc && q.type !== 'image' && q.type !== 'clic' && q.doc.text) speech = 'Document. ' + q.doc.text + '. ' + (q.doc.source ? 'Source : ' + q.doc.source + '. ' : '') + 'Question. ' + speech;
    const qbtn = document.getElementById('quit');
    if (qbtn) qbtn.onclick = async () => {
      if (await confirmDialog('Quitter l\u2019exercice ?', this.preview ? 'Tu reviendras à l’éditeur.' : 'Ce que tu as fait ne sera pas enregistré.', 'Quitter', true)) this.exit();
    };
    const crs = document.getElementById('crs'); if (crs) crs.onclick = () => this.recapSheet();
    const sp = document.getElementById('speak');
    if (sp) sp.onclick = () => { if (sp.classList.contains('on')) TTS.stop(); else TTS.speak(speech, sp); };
    const hb = document.getElementById('hintb');
    if (hb) hb.onclick = () => { s.hintUsed[q.id] = true; hb.remove(); document.getElementById('hintx').hidden = false; };
    if (q.type === 'qcm'){
      $app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (s.locked) return; s.locked = true;
        const i = +b.dataset.i, ok = i === q.answer;
        if (T || this.conf){ b.classList.add('picked'); return this.answer(ok, q.options[i], q.options[q.answer], q.explanation); }
        $app.querySelectorAll('.opt').forEach(o => { const j = +o.dataset.i; if (j === q.answer) o.classList.add('correct'); else if (o === b) o.classList.add('wrong'); else o.classList.add('dim'); });
        this.answer(ok, q.options[i], q.options[q.answer], q.explanation);
      });
    } else if (q.type === 'vf'){
      $app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (s.locked) return; s.locked = true;
        const v = b.dataset.v === '1', ok = v === !!q.answer;
        if (T || this.conf){ b.classList.add('picked'); return this.answer(ok, v ? 'Vrai' : 'Faux', q.answer ? 'Vrai' : 'Faux', q.explanation); }
        $app.querySelectorAll('.opt').forEach(o => { const ov = o.dataset.v === '1'; if (ov === !!q.answer) o.classList.add('correct'); else o.classList.add(o === b ? 'wrong' : 'dim'); });
        this.answer(ok, v ? 'Vrai' : 'Faux', q.answer ? 'Vrai' : 'Faux', q.explanation);
      });
    } else if (q.type === 'trous'){
      const blanks = parseTrous(q.text).filter(p => p.blank);
      const inputs = [...$app.querySelectorAll('.blank')];
      const verify = () => {
        if (s.locked) return;

    } else if (q.type === 'chrono'){

        s.locked = true; let all = true; const given = [];
        q.steps.forEach((st, k) => {

      $app.querySelectorAll('#vfcb .opt').forEach(b => b.onclick = () => {
        if (s.locked) return;
        const v = b.dataset.v === '1';
        $app.querySelectorAll('#vfcb .opt').forEach(o => { o.disabled = true; o.classList.toggle('picked', o === b); });
        if (v || errK < 0){ s.locked = true; return done(v === (errK < 0), v ? 'Vrai' : 'Faux'); }
        const fix = document.getElementById('vfcfix');
        fix.innerHTML = '<p class="foot" style="margin:14px 0 6px">Touche le mot qui est faux dans la phrase.</p>';
        const words = $app.querySelectorAll('.vw'); words.forEach(w => w.classList.add('vw-tap'));
        let chosen = null;
        words.forEach(w => w.onclick = () => {
          if (s.locked) return; chosen = +w.dataset.w;
          words.forEach(x => x.classList.toggle('vw-on', x === w));
          if (!document.getElementById('vfcin')){
            fix.insertAdjacentHTML('beforeend', '<input class="field" id="vfcin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris le mot juste" style="border-radius:12px;background:var(--card);margin-top:6px">' + check);
            const go = () => {
              if (s.locked) return; const val = document.getElementById('vfcin').value.trim(); if (!val) return toast('Écris la correction');

          }
          setTimeout(() => document.getElementById('vfcin').focus(), 50);
        });
      });
    } else if (q.type === 'lien'){
      const pick = {};
      $app.querySelectorAll('.cl-seg button').forEach(b => b.onclick = () => {
        if (s.locked) return; const i = +b.dataset.ci; pick[i] = +b.dataset.cj;

    } else if (q.type === 'clic'){

          const ok = norm(sel.value) === norm(q.points[k].label); if (!ok) all = false;
          sel.disabled = true; if (T || this.conf) return; sel.closest('.row').classList.add(ok ? 'leg-ok' : 'leg-ko');
