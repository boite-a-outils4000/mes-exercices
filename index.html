        recap: (copy.recap || '').trim() || null, folder: (copy.folder || '').trim().replace(/\s+/g, ' ') || null, course_id: copy.course_id || null, pass_score: copy.pass_score, questions: copy.questions, control_set_id: copy.control_set_id || null, control_count: copy.control_set_id ? (copy.control_count || 10) : null, draw_count: copy.draw_count && copy.draw_count < copy.questions.length ? copy.draw_count : null, anchor: copy.anchor || 3, updated_at: new Date().toISOString() };
      const btn = document.getElementById('save'); btn.disabled = true;
      const res = id ? await sb.from('exercise_sets').update(payload).eq('id', id) : await sb.from('exercise_sets').insert({ ...payload, teacher_id: this.user.id });
      btn.disabled = false;
      if (res.error) return toast('Erreur : ' + esc(res.error.message));
      this.draft = null; await this.load(); go('#/prof/exercices'); toast(I.okCircle.replace('width="26" height="26"', 'width="18" height="18" style="color:var(--green)"') + ' Série enregistrée');
    };
  },

  /* --- Assignation --- */
  assignSheet(set, opts){
    opts = opts || {};
    if (!this.classes.length){ toast('Crée d\u2019abord une classe'); return go('#/prof/classes'); }
    if (!this.sets.length){ toast('Crée d\u2019abord une série d\u2019exercices'); return go('#/prof/exercices'); }
    const fixedStu = opts.student ? this.studentById[opts.student] : null;
    let cls = fixedStu ? fixedStu.class_id : this.classFilter !== 'all' ? this.classFilter : this.classes[0].id;
    const sel = new Set(fixedStu ? [fixedStu.id] : []), sets = new Set(set ? [set.id] : []);
    const groups = this.folderGroups();
    const openF = new Set(groups.filter(([f, list]) => !f || groups.length === 1 || list.some(x => sets.has(x.id))).map(g => g[0]));
    let fev = '';
    const html = '<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-close>Annuler</button><h2>Assigner</h2><button class="nav-btn bold" id="ok" disabled>Assigner</button></div>' +
      (fixedStu ? '<p class="subtitle" style="text-align:center;margin-top:-4px">à ' + esc(fixedStu.first_name) + '</p>' : '') + '<div id="abody"></div>' +
      '<div class="section-h">Détails</div><div class="group"><div class="row"><div class="main t">À faire pour le</div><input type="date" id="due" class="field" style="width:auto;padding:6px 0;text-align:right;color:var(--blue)" min="' + todayLocal() + '"></div>' +
      '<div style="height:.5px;background:var(--sep);margin-left:16px"></div><input class="field" id="why" placeholder="Motif (ex. remédiation éval chapitre 2)">' +
      '<div style="height:.5px;background:var(--sep);margin-left:16px"></div><textarea class="field" id="msg" rows="2" placeholder="Message quand l\u2019élève valide (ex. Bravo {prénom}, tu es prêt pour l\u2019interro !)"></textarea></div>' +
      '<p class="foot">Les élèves verront les séries dès qu\u2019ils ouvriront l\u2019appli avec leur code. {prénom} est remplacé par le prénom de l\u2019élève. La date, le motif et le message s\u2019appliquent à toutes les séries choisies.</p>';
    openSheet(html, (el, close) => {
      const okBtn = el.querySelector('#ok');
      const draw = () => {
        const sh = el.querySelector('.sheet'), y = sh.scrollTop;
        const c = this.classes.find(x => x.id === cls);
        const allSel = c.students.length && c.students.every(s => sel.has(s.id));
        const evs = this.evals.filter(e => e.class_id === cls && e.status !== 'draft');
        if (fev && !evs.some(e => e.id === fev)) fev = '';
        const evPct = sid => { if (!fev) return null; const ea = this.evalAtts.find(x => x.evaluation_id === fev && x.student_id === sid && x.status === 'done'); return ea && ea.total ? Math.round(finalScore(ea) / ea.total * 100) : null; };
        const has = (sid, setId) => this.assignments.some(a => a.set_id === setId && a.student_id === sid);
        const already = sid => [...sets].filter(k => has(sid, k)).length;
        const setRow = x => {
          const on = sets.has(x.id), n = fixedStu && has(fixedStu.id, x.id);
          return '<button class="row" data-set="' + x.id + '"><span class="check ' + (on ? 'on' : '') + '">' + (on ? I.check : '') + '</span><div class="main"><div class="t">' + esc(x.title) + '</div><div class="s">' + x.questions.length + ' questions' + (n ? ' · déjà assignée' : '') + '</div></div></button>';
        };
        el.querySelector('#abody').innerHTML =
          '<div class="section-h">Séries' + (sets.size ? ' (' + sets.size + ' choisie' + (sets.size > 1 ? 's' : '') + ')' : '') + (sets.size ? '<button id="noset">Tout désélectionner</button>' : '') + '</div>' +
          groups.map(([f, list], i) => {
            if (!f) return (groups.length > 1 ? '<div class="section-h" style="margin-top:14px;text-transform:none;font-size:14px">Sans dossier</div>' : '') + '<div class="group">' + list.map(setRow).join('') + '</div>';
            const isOpen = openF.has(f), nOn = list.filter(x => sets.has(x.id)).length, every = nOn === list.length;
            return '<div class="group fold" style="margin-top:' + (i ? 10 : 0) + 'px"><button class="row fold-h' + (isOpen ? ' open' : '') + '" data-af="' + i + '"><span class="fic">' + I.folder + '</span><div class="main"><div class="t" style="font-weight:600">' + esc(f) + '</div><div class="s">' +
              list.length + ' série' + (list.length > 1 ? 's' : '') + (nOn ? ' · ' + nOn + ' choisie' + (nOn > 1 ? 's' : '') : '') + '</div></div><span class="more" data-afall="' + i + '">' + (every ? 'Aucune' : 'Tout') + '</span><span class="chev">' + I.chevR + '</span></button>' +
              (isOpen ? list.map(setRow).join('') : '') + '</div>';
          }).join('') +
          (fixedStu ? '' :
          (this.classes.length > 1 ? '<div class="seg" style="margin:22px 0 4px">' + this.classes.map(x => '<button data-c="' + x.id + '" class="' + (x.id === cls ? 'on' : '') + '">' + esc(x.name) + '</button>').join('') + '</div>' : '') +
          (evs.length ? '<div class="section-h">Suite à une évaluation (facultatif)</div><div class="group"><div class="row"><div class="main t">Évaluation</div><select class="field" id="fev" style="width:auto;max-width:62%;padding:6px 0;text-align:right;color:var(--blue);background:transparent;-webkit-appearance:none;appearance:none;border:0"><option value="">Aucune</option>' +
            evs.map(e => '<option value="' + e.id + '"' + (fev === e.id ? ' selected' : '') + '>' + esc(e.title) + '</option>').join('') + '</select></div>' +
            (fev ? '<button class="row center" id="under">Sélectionner les élèves sous 50 %</button>' : '') + '</div>' : '') +
          '<div class="section-h">Élèves · ' + esc(c.name) + '<button id="all">' + (allSel ? 'Tout désélectionner' : 'Tout sélectionner') + '</button></div>' +
          (c.students.length ? '<div class="group">' + c.students.map(s => { const k = already(s.id);
            return '<button class="row" data-st="' + s.id + '"><span class="check ' + (sel.has(s.id) ? 'on' : '') + '">' + (sel.has(s.id) ? I.check : '') + '</span><div class="main t">' + esc(s.first_name) + '</div>' + (evPct(s.id) != null ? '<span class="pill ' + (evPct(s.id) < 50 ? 'red' : 'green') + '" style="margin-right:6px">' + evPct(s.id) + ' %</span>' : '') +
              (k ? '<span class="pill">' + (sets.size > 1 ? 'déjà ' + k + ' / ' + sets.size : 'déjà assignée') + '</span>' : '') + '</button>'; }).join('') + '</div>'
            : '<div class="empty">Cette classe n\u2019a pas encore d\u2019élèves.</div>'));
        sh.scrollTop = y;
        el.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { const k = b.dataset.set; sets.has(k) ? sets.delete(k) : sets.add(k); draw(); });
        el.querySelectorAll('[data-af]').forEach(b => b.onclick = e => {
          const [f, list] = groups[+b.dataset.af];
          if (e.target.closest('[data-afall]')){ const every = list.every(x => sets.has(x.id)); list.forEach(x => every ? sets.delete(x.id) : sets.add(x.id)); openF.add(f); }
          else openF.has(f) ? openF.delete(f) : openF.add(f);
          draw();
        });
        const ns = el.querySelector('#noset'); if (ns) ns.onclick = () => { sets.clear(); draw(); };
        el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cls = b.dataset.c; draw(); });
        el.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { const k = b.dataset.st; sel.has(k) ? sel.delete(k) : sel.add(k); draw(); });
        const all = el.querySelector('#all'); if (all) all.onclick = () => { c.students.forEach(s => allSel ? sel.delete(s.id) : sel.add(s.id)); draw(); };
        const fs = el.querySelector('#fev'); if (fs) fs.onchange = () => { fev = fs.value; const e = this.evals.find(x => x.id === fev), w = el.querySelector('#why'); if (e && w && !w.value.trim()) w.value = 'Remédiation : ' + e.title; draw(); };
        const un = el.querySelector('#under'); if (un) un.onclick = () => { sel.clear(); c.students.forEach(s => { const v = evPct(s.id); if (v != null && v < 50) sel.add(s.id); }); if (!sel.size) toast('Aucun élève sous 50 % à cette évaluation'); draw(); };
        okBtn.disabled = !sel.size || !sets.size;
        okBtn.textContent = sets.size > 1 ? 'Assigner (' + sets.size + ')' : sel.size > 1 ? 'Assigner (' + sel.size + ')' : 'Assigner';
      };
      draw();
      okBtn.onclick = async () => {
        okBtn.disabled = true;
        const due = el.querySelector('#due').value || null, why = el.querySelector('#why').value.trim() || null, msg = el.querySelector('#msg').value.trim() || null;
        const rows = [];
        [...sets].forEach(setId => [...sel].forEach(sid => rows.push({ teacher_id: this.user.id, set_id: setId, student_id: sid, due_date: due, reason: why, success_message: msg, from_eval_id: fev || null })));
        const { error } = await sb.from('assignments').upsert(rows, { onConflict: 'set_id,student_id' });
        if (error){ okBtn.disabled = false; return toast('Erreur : ' + esc(error.message)); }
        close();
        const y = window.scrollY; await this.load(); await route(); window.scrollTo(0, y);
        toast((sets.size > 1 ? sets.size + ' séries assignées' : 'Assignée') + (fixedStu ? ' à ' + esc(fixedStu.first_name) : ' à ' + sel.size + ' élève' + (sel.size > 1 ? 's' : '')));
      };
    });
  },

  /* --- Classes --- */
  renderClasses(){
    const html = nav('', '<button class="nav-btn" id="newc" aria-label="Nouvelle classe">' + I.plus + '</button>') +
      '<div class="wrap"><h1 class="large">Classes</h1>' +
      (this.classes.length ? '<div class="group">' + this.classes.map(c => '<a class="row" href="#/prof/classes/' + c.id + '"><div class="main t">' + esc(c.name) + '</div><span class="val">' + c.students.length + ' élève' + (c.students.length > 1 ? 's' : '') + '</span><span class="chev">' + I.chevR + '</span></a>').join('') + '</div>'
        : '<div class="empty"><b>Aucune classe</b>Crée une classe avec le bouton +, puis ajoute tes élèves. Chacun recevra un code personnel.</div>') +
      '<p class="foot" style="margin-top:14px">Pour la vie privée, seul le prénom (ou un pseudo) est enregistré. Aucun e-mail n\u2019est demandé aux élèves.</p></div>';

    document.getElementById('newc').onclick = () => this.classNameSheet();
  },

  classNameSheet(cl){
    const html = '<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-close>Annuler</button><h2>' + (cl ? 'Renommer' : 'Nouvelle classe') + '</h2><button class="nav-btn bold" id="ok">OK</button></div>' +
      '<input class="field alone" id="cn" placeholder="Nom (ex. 3P FHG)" value="' + esc(cl ? cl.name : '') + '">';
    openSheet(html, (el, close) => {
      const inp = el.querySelector('#cn'); setTimeout(() => inp.focus(), 300);
      const submit = async () => {
        const name = inp.value.trim(); if (!name) return;
        const res = cl ? await sb.from('classes').update({ name }).eq('id', cl.id) : await sb.from('classes').insert({ name, teacher_id: this.user.id }).select().single();
        if (res.error) return toast('Erreur : ' + esc(res.error.message));
        close(); await this.load();
        if (cl) this.renderClass(cl.id); else go('#/prof/classes/' + res.data.id);
      };
      el.querySelector('#ok').onclick = submit;
      inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
    });
  },

  renderClass(id){
    const c = this.classes.find(x => x.id === id);
    if (!c) return go('#/prof/classes');
    const html = nav(backBtn('#/prof/classes', 'Classes'), c.students.length && !window.__DEMO__ ? '<button class="nav-btn" id="print">Imprimer les codes</button>' : '') +
      '<div class="wrap"><h1 class="large">' + esc(c.name) + '</h1>' +
      '<div class="section-h">Élèves (' + c.students.length + ')</div>' +
      '<div class="group">' + c.students.map(s => '<button class="row" data-st="' + s.id + '"><div class="avatar">' + initials(s.first_name) + '</div><div class="main t">' + esc(s.first_name) + '</div><span class="val code">' + esc(s.code) + '</span><span class="chev">' + I.chevR + '</span></button>').join('') +
      '<button class="row center" id="adds">Ajouter des élèves</button></div>' +
      '<p class="foot">Chaque élève se connecte avec son code personnel, ou en scannant le QR code de sa fiche imprimée.</p>' +
      (() => { const hid = new Set(c.hidden_tools || []), n = STUDY_TOOLS.length - STUDY_TOOLS.filter(t => hid.has(t[0])).length;
        const ch = c.challenge || {}, prog = this.challengeProgress(c);
        return '<div class="section-h">Défi de la semaine</div><div class="group"><div class="inner-pad"><div class="seg">' + [0, 50, 100, 200, 300, 500].map(v => '<button data-ch="' + v + '" class="' + ((ch.target || 0) === v ? 'on' : '') + '">' + (v || 'Aucun') + '</button>').join('') + '</div></div>' +
          (ch.target ? '<div class="row"><div class="main"><div class="t">' + prog + ' / ' + ch.target + ' bonnes réponses</div><div class="bar"><i style="width:' + Math.min(100, prog / ch.target * 100) + '%;background:var(--purple)"></i></div></div></div>' : '') + '</div>' +
          '<p class="foot">Un objectif commun en bonnes réponses aux exercices, du lundi au dimanche. Les élèves voient la progression de la classe, jamais un classement.</p>' +
          '<div class="section-h">Outils de J\u2019étudie</div><div class="group"><button class="row" id="tools"><div class="main"><div class="t">Outils visibles par les élèves</div><div class="s">' + (n === STUDY_TOOLS.length ? 'Tous les outils (' + n + ')' : n + ' sur ' + STUDY_TOOLS.length) + '</div></div><span class="chev">' + I.chevR + '</span></button></div>'; })() +
      '<div class="group mt2"><button class="row center" id="ren">Renommer la classe</button><button class="row danger" id="delc">Supprimer la classe</button></div></div>';
    this.shell('classes', html);
    document.getElementById('adds').onclick = () => this.addStudentsSheet(c);
    document.getElementById('ren').onclick = () => this.classNameSheet(c);
    document.getElementById('tools').onclick = () => this.toolsSheet(c);
    $app.querySelectorAll('[data-ch]').forEach(b => b.onclick = async () => {
      const v = +b.dataset.ch;
      const { error } = await sb.from('classes').update({ challenge: v ? { target: v } : null }).eq('id', c.id);
      if (error) return toast('Erreur : ' + esc(error.message));
      await this.load(); this.renderClass(c.id); toast(v ? 'Défi lancé : ' + v + ' bonnes réponses cette semaine' : 'Défi arrêté');
    });
    const pr = document.getElementById('print'); if (pr) pr.onclick = () => this.printCodes(c);
    document.getElementById('delc').onclick = async () => {
      if (!await confirmDialog('Supprimer « ' + c.name + ' » ?', 'Les élèves de cette classe et tous leurs résultats seront supprimés.', 'Supprimer', true)) return;
      const { error } = await sb.from('classes').delete().eq('id', c.id);
      if (error) return toast('Erreur : ' + esc(error.message));
      await this.load(); go('#/prof/classes'); toast('Classe supprimée');
    };
    $app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => go('#/prof/eleve/' + b.dataset.st));
  },

  challengeProgress(c){
    const ids = new Set(c.students.map(s => s.id)), now = new Date(), monday = new Date(now);
    monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - (now.getDay() + 6) % 7);
    let n = 0;
    this.assignments.filter(a => ids.has(a.student_id)).forEach(a => (a.attempts || []).forEach(at => { if (at.kind !== 'control' && new Date(at.created_at) >= monday) n += (at.answers || []).filter(x => x.correct).length; }));
    return n;
  },
  toolsSheet(c){
    const hid = new Set(c.hidden_tools || []);
    const draw = el => {
      el.querySelector('#tb').innerHTML = '<div class="group"><button class="row" data-preset="simple"><div class="main"><div class="t">Version simple</div><div class="s">Quiz de la semaine, cartes mémoire, consignes, mes erreurs</div></div></button><button class="row" data-preset="all"><div class="main"><div class="t">Tous les outils</div></div></button></div>' +
        ['test', 'train', 'review'].map(f => '<div class="section-h">' + ({ test: 'Se tester', train: 'S’entraîner', review: 'Revoir' })[f] + '</div><div class="group">' + STUDY_TOOLS.filter(t => t[1] === f).map(t => '<label class="row" style="cursor:pointer"><div class="main t">' + t[2] + '</div><span class="switch"><input type="checkbox" data-tool="' + t[0] + '" ' + (hid.has(t[0]) ? '' : 'checked') + ' aria-label="' + t[2] + '"><span></span></span></label>').join('') + '</div>').join('') +
        '<p class="foot">Pour commencer, la version simple suffit. Tu pourras ouvrir d’autres outils plus tard. Les choix s’appliquent à tous les élèves de ' + esc(c.name) + '.</p>';
      el.querySelectorAll('[data-tool]').forEach(i => i.onchange = () => { i.checked ? hid.delete(i.dataset.tool) : hid.add(i.dataset.tool); });
      el.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { hid.clear(); if (b.dataset.preset === 'simple') STUDY_TOOLS.forEach(t => { if (!['week', 'cards', 'cons', 'mist'].includes(t[0])) hid.add(t[0]); }); draw(el); });
    };
    openSheet('<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-close>Annuler</button><h2>Outils de J’étudie</h2><button class="nav-btn bold" id="ok">OK</button></div><div id="tb"></div>', (el, close) => {
      draw(el);
      el.querySelector('#ok').onclick = async () => {
        if (hid.size >= STUDY_TOOLS.length) return toast('Garde au moins un outil');
        const { error } = await sb.from('classes').update({ hidden_tools: [...hid] }).eq('id', c.id);
        if (error) return toast('Erreur : ' + esc(error.message));
        close(); await this.load(); this.renderClass(c.id); toast('Outils mis à jour');
      };
    });
  },

  newEvalSheet(){
    if (!this.sets.length){ toast('Crée d’abord une série d’exercices'); return go('#/prof/exercices'); }
    if (!this.classes.length){ toast('Crée d’abord une classe'); return go('#/prof/classes'); }
    let setId = this.sets[0].id, cls = this.classFilter !== 'all' ? this.classFilter : this.classes[0].id, anti = true, show = true, drawN = 0;
    const html = '<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-close>Annuler</button><h2>Nouvelle évaluation</h2><button class="nav-btn bold" id="ok">Créer</button></div><div id="nb"></div>';
    openSheet(html, (el, close) => {
      let title = '';
      const draw = () => {
        const set = this.sets.find(x => x.id === setId);
        el.querySelector('#nb').innerHTML =
          '<div class="group"><input class="field" id="evt" placeholder="Titre (ex. Interro : la Révolution industrielle)" value="' + esc(title || 'Interro : ' + set.title) + '"></div>' +
          '<div class="section-h">Questions reprises de la série</div>' + this.folderGroups().map(([f, list], k, all) => (all.length > 1 ? '<div class="section-h" style="margin-top:' + (k ? 14 : 4) + 'px;text-transform:none;font-size:14px">' + esc(f || 'Sans dossier') + '</div>' : '') + '<div class="group">' + list.map(x => '<button class="row" data-set="' + x.id + '"><span class="check ' + (x.id === setId ? 'on' : '') + '">' + (x.id === setId ? I.check : '') + '</span><div class="main"><div class="t">' + esc(x.title) + '</div><div class="s">' + x.questions.length + ' questions</div></div></button>').join('') + '</div>').join('') +
          '<div class="section-h">Classe</div><div class="seg">' + this.classes.map(c => '<button data-c="' + c.id + '" class="' + (c.id === cls ? 'on' : '') + '">' + esc(c.name) + '</button>').join('') + '</div>' +
          (set.questions.length >= 8 ? (() => { if (drawN >= set.questions.length) drawN = 0; const opts = [0, 6, 8, 10, 12, 15, 20].filter(k => k < set.questions.length);
            return '<div class="section-h">Questions par élève</div><div class="seg">' + opts.map(k => '<button data-dn="' + k + '" class="' + (drawN === k ? 'on' : '') + '">' + (k ? k : 'Toutes (' + set.questions.length + ')') + '</button>').join('') + '</div>' +
              '<p class="foot">' + (drawN ? 'Banque de questions : chaque élève reçoit ' + drawN + ' questions tirées parmi les ' + set.questions.length + '. Deux voisins n\u2019ont donc pas la même copie. S\u2019il reprend son évaluation, il retrouve les mêmes questions.' : 'Tous les élèves reçoivent les mêmes questions. Choisis un nombre plus petit pour que chacun ait sa propre copie.') + '</p>'; })() : '') +
          '<div class="section-h">Réglages</div><div class="group">' +
          '<label class="row" style="cursor:pointer"><div class="main"><div class="t">Bloquer si l’élève quitte l’appli</div><div class="s">Changement d’application, d’onglet, écran verrouillé</div></div><span class="switch"><input type="checkbox" id="anti" ' + (anti ? 'checked' : '') + '><span></span></span></label>' +
          '<label class="row" style="cursor:pointer"><div class="main"><div class="t">Montrer la note à la fin</div><div class="s">Sinon, tu la communiques toi-même</div></div><span class="switch"><input type="checkbox" id="show" ' + (show ? 'checked' : '') + '><span></span></span></label></div>' +
          '<p class="foot">Les questions sont copiées au moment de la création : modifier la série ensuite ne change pas l’évaluation.</p>';
        el.querySelector('#evt').oninput = e => { title = e.target.value; };
        el.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { if (!title || title.startsWith('Interro : ')) title = ''; setId = b.dataset.set; draw(); });
        el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cls = b.dataset.c; draw(); });
        el.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { drawN = +b.dataset.dn; const y = el.querySelector('.sheet').scrollTop; draw(); el.querySelector('.sheet').scrollTop = y; });
        el.querySelector('#anti').onchange = e => { anti = e.target.checked; };
        el.querySelector('#show').onchange = e => { show = e.target.checked; };
      };
      draw();
      el.querySelector('#ok').onclick = async () => {
        const set = this.sets.find(x => x.id === setId);
        const t = (el.querySelector('#evt').value || '').trim() || 'Interro : ' + set.title;
        const { data, error } = await sb.from('evaluations').insert({ teacher_id: this.user.id, title: t, class_id: cls, set_id: set.id, questions: set.questions, draw_count: drawN && drawN < set.questions.length ? drawN : null, anticheat: anti, show_score: show, status: 'draft' }).select().single();
        if (error) return toast('Erreur : ' + esc(error.message));
        close(); await this.load(); go('#/prof/evals/' + data.id);
      };
    });
  },

  renderEval(id, live){
    const e = this.evals.find(x => x.id === id); if (!e) return go('#/prof/evals');
    const cl = this.classes.find(c => c.id === e.class_id) || { name: '', students: [] };
    const atts = this.evalAtts.filter(x => x.evaluation_id === id), byStu = {};
    atts.forEach(a => { byStu[a.student_id] = a; });
    const total = evQN(e, true);
    const [lab, col] = this.evalStatus(e);
    const rows = cl.students.map(st => ({ st, a: byStu[st.id] })).sort((x, y) => {
      const o = a => !a ? 3 : a.status === 'locked' ? 0 : a.status === 'in_progress' ? 1 : 2;
      return o(x.a) - o(y.a) || x.st.first_name.localeCompare(y.st.first_name, 'fr');
    });
    const n = k => rows.filter(r => k === 'none' ? !r.a : r.a && r.a.status === k).length;
    const done = atts.filter(a => a.status === 'done' && a.score != null);
    const avg = done.length ? done.reduce((t, a) => t + finalScore(a), 0) / done.length : null;
    const penTxt = a => a.penalty ? ' · <span style="color:var(--red)">−' + a.penalty + ' pt' + (a.penalty > 1 ? 's' : '') + '</span>' : '';
    const rowHtml = r => {
      const a = r.a; let meta, right;
      if (!a){ meta = e.status === 'closed' ? 'N’a pas fait l’évaluation' : 'Pas commencé'; right = '<span class="pill">' + (e.status === 'closed' ? 'Absent' : 'En attente') + '</span>'; }
      else if (a.status === 'locked'){ const last = (a.locks || []).slice(-1)[0]; meta = 'Bloqué' + (last ? ' à ' + fmtTime(last.at) : '') + (a.lock_count > 1 ? ' · ' + a.lock_count + ' sorties' : '') + penTxt(a); right = '<button class="btn small orange" data-unlock="' + a.id + '">Débloquer</button>'; }
      else if (a.status === 'in_progress'){ meta = 'Question ' + Math.min((a.current || 0) + 1, total) + ' sur ' + total + (a.lock_count ? ' · ' + a.lock_count + ' sortie' + (a.lock_count > 1 ? 's' : '') : '') + penTxt(a); right = '<span class="pill blue">En cours</span>'; }
      else { meta = 'Terminé' + (a.finished_at ? ' à ' + fmtTime(a.finished_at) : '') + (a.lock_count ? ' · ' + a.lock_count + ' sortie' + (a.lock_count > 1 ? 's' : '') : ''); right = '<span class="score">' + (finalScore(a) ?? '?') + ' / ' + (a.total || total) + (a.penalty ? '<span class="pen">−' + a.penalty + '</span>' : '') + '</span>'; }
      return '<div class="row"' + (a ? ' data-att="' + a.id + '" style="cursor:pointer"' : '') + '><div class="avatar">' + initials(r.st.first_name) + '</div><div class="main"><div class="t">' + esc(r.st.first_name) + '</div><div class="s"' + (a && a.status === 'locked' ? ' style="color:var(--red)"' : '') + '>' + meta + '</div></div>' + right + '</div>';
    };
    const stats = {};
    atts.forEach(a => (a.answers || []).forEach(an => { const r = stats[an.qid] = stats[an.qid] || { n: 0, ok: 0 }; r.n++; if (an.correct) r.ok++; }));
    const hard = (e.questions || []).map(q => ({ q, ...(stats[q.id] || { n: 0, ok: 0 }) })).filter(x => x.n).sort((a, b) => a.ok / a.n - b.ok / b.n).slice(0, 5);
    const html = nav(backBtn('#/prof/evals', 'Évaluations'), '') +
      '<div class="wrap"><span class="pill ' + col + '">' + lab + '</span><h1 class="large" style="margin-top:8px">' + esc(e.title) + '</h1>' +
      '<p class="subtitle">' + esc(cl.name) + ' · ' + evQN(e) + (e.status === 'open' ? ' · <span class="live">En direct</span>' : '') + '</p>' +
      (e.status === 'draft' ? '<button class="btn green" id="launch">Lancer l’évaluation</button><p class="foot">Les élèves de ' + esc(cl.name) + ' la verront aussitôt dans l’onglet Évaluation de leur appli.</p>' : '') +
      (e.status !== 'draft' ? '<div class="tiles">' +
        (e.status === 'open'
          ? '<div class="tile"><div class="n">' + (n('in_progress') + n('none')) + '</div><div class="l">À faire ou en cours</div></div><div class="tile"><div class="n" style="color:var(--red)">' + n('locked') + '</div><div class="l">Bloqués</div></div><div class="tile"><div class="n" style="color:var(--green)">' + n('done') + '</div><div class="l">Terminés</div></div>'
          : '<div class="tile"><div class="n">' + (avg == null ? '—' : (Math.round(avg * 10) / 10).toString().replace('.', ',')) + '</div><div class="l">Moyenne / ' + total + '</div></div><div class="tile"><div class="n" style="color:var(--green)">' + n('done') + '</div><div class="l">Copies</div></div><div class="tile"><div class="n">' + n('none') + '</div><div class="l">Absents</div></div>') +
        '</div>' : '') +
      '<div class="section-h">Élèves (' + rows.length + ')' + (e.status !== 'draft' && done.length ? '<button id="copyres">Copier les notes</button>' : '') + '</div>' +
      '<div class="group">' + (rows.length ? rows.map(rowHtml).join('') : '<div class="row"><div class="main s">Aucun élève dans cette classe.</div></div>') + '</div>' +
      (hard.length && e.status !== 'draft' ? '<div class="section-h">Questions les plus ratées</div><div class="group">' + hard.map(h => { const r = Math.round(h.ok / h.n * 100); return '<div class="row"><div class="main"><div class="t clamp2" style="font-size:15px">' + esc(qLabel(h.q)) + '</div><div class="s">' + TYPE_LABEL[h.q.type] + ' · ' + h.n + ' réponse' + (h.n > 1 ? 's' : '') + '</div></div><span class="pill ' + (r < 50 ? 'red' : r < 75 ? 'orange' : 'green') + '">' + r + ' %</span></div>'; }).join('') + '</div>' : '') +
      '<div class="section-h">Réglages</div><div class="group">' +
        '<div class="row"><div class="main t">Bloquer si l’élève quitte l’appli</div><span class="val">' + (e.anticheat ? 'Oui' : 'Non') + '</span></div>' +
        '<label class="row" style="cursor:pointer"><div class="main t">Montrer la note à la fin</div><span class="switch"><input type="checkbox" id="show" ' + (e.show_score ? 'checked' : '') + '><span></span></span></label></div>' +
      '<div class="group mt2">' + (done.length ? '<button class="row center" id="printall" style="gap:8px">' + I.printer + ' Imprimer les copies (' + done.length + ')</button>' : '') + (e.status === 'open' ? '<button class="row danger" id="close" style="font-weight:600">Terminer l’évaluation et ramasser les copies</button>' : '') +
        (e.status === 'closed' ? '<button class="row center" id="reopen">Rouvrir l’évaluation</button>' : '') +
        '<button class="row danger" id="delev">Supprimer l’évaluation</button></div></div>';
    const y = window.scrollY;
    this.shell('evals', html);
    if (live) window.scrollTo(0, y);
    const reload = async () => { await this.load(); this.renderEval(id, true); };
    const L = document.getElementById('launch');
    if (L) L.onclick = async () => { const { error } = await sb.from('evaluations').update({ status: 'open', opened_at: new Date().toISOString() }).eq('id', id); if (error) return toast('Erreur : ' + esc(error.message)); await reload(); toast('Évaluation lancée'); };
    const C = document.getElementById('close');
    if (C) C.onclick = async () => {
      if (!await confirmDialog('Terminer l’évaluation ?', 'Les copies en cours ou bloquées sont ramassées avec les réponses déjà données.', 'Terminer', true)) return;
      const { error } = await sb.rpc('teacher_close_eval', { p_eval_id: id }); if (error) return toast('Erreur : ' + esc(error.message));
      await reload(); toast('Copies ramassées');
    };
    const R = document.getElementById('reopen');
    if (R) R.onclick = async () => { const { error } = await sb.from('evaluations').update({ status: 'open' }).eq('id', id); if (error) return toast('Erreur : ' + esc(error.message)); await reload(); toast('Évaluation rouverte'); };
    document.getElementById('delev').onclick = async () => {
      if (!await confirmDialog('Supprimer « ' + e.title + ' » ?', 'Les copies et les notes de cette évaluation seront supprimées.', 'Supprimer', true)) return;
      const { error } = await sb.from('evaluations').delete().eq('id', id); if (error) return toast('Erreur : ' + esc(error.message));
      await this.load(); go('#/prof/evals'); toast('Évaluation supprimée');
    };
    document.getElementById('show').onchange = async ev => { const { error } = await sb.from('evaluations').update({ show_score: ev.target.checked }).eq('id', id); if (error) toast('Erreur : ' + esc(error.message)); else e.show_score = ev.target.checked; };
    const pa = document.getElementById('printall'); if (pa) pa.onclick = () => this.printCopies(e, done.slice().sort((x, y) => (this.studentById[x.student_id] || {}).first_name.localeCompare((this.studentById[y.student_id] || {}).first_name, 'fr')));
    const cr = document.getElementById('copyres');
    if (cr) cr.onclick = () => copyText('Prénom\tNote\tSur\n' + rows.map(r => r.st.first_name + '\t' + (r.a && r.a.status === 'done' && r.a.score != null ? finalScore(r.a) : (r.a ? 'en cours' : 'absent')) + '\t' + total).join('\n'), 'Notes copiées : colle-les dans Excel');
    $app.querySelectorAll('[data-unlock]').forEach(b => b.onclick = async ev => {
      ev.stopPropagation(); b.disabled = true;
      const { error } = await sb.from('eval_attempts').update({ status: 'in_progress', resumable: true, updated_at: new Date().toISOString() }).eq('id', b.dataset.unlock);
      if (error){ b.disabled = false; return toast('Erreur : ' + esc(error.message)); }
      await reload(); toast('Copie débloquée');
    });
    $app.querySelectorAll('[data-att]').forEach(rw => rw.onclick = () => this.evalAttemptSheet(atts.find(a => a.id === rw.dataset.att), e));
    if (!live && e.status === 'open'){
      clearInterval(this._poll);
      this._poll = setInterval(async () => {
        if (location.hash !== '#/prof/evals/' + id){ clearInterval(this._poll); return; }
        if (document.querySelector('.sheet-wrap, .alert-wrap')) return;
        const { data } = await sb.from('eval_attempts').select('*').eq('evaluation_id', id);
        if (!data || location.hash !== '#/prof/evals/' + id) return;
        this.evalAtts = this.evalAtts.filter(x => x.evaluation_id !== id).concat(data);
        this.renderEval(id, true);
      }, 4000);
    }
  },

  copyHtml(e, a){
    const st = this.studentById[a.student_id] || { first_name: '?', class_name: '' };
    const qs = e.questions || [], total = qs.length, ans = {}; (a.answers || []).forEach(x => { ans[x.qid] = x; });
    const fin = finalScore(a), when = a.finished_at || a.updated_at || e.closed_at;
    return '<div class="pcopy"><div class="pc-head"><div><div class="pc-school">Évaluation · ' + esc(st.class_name || '') + '</div><h1>' + esc(e.title) + '</h1>' +
      '<div class="pc-meta">' + (when ? new Date(when).toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '') + '</div></div>' +
      '<div class="pc-note"><div class="pc-note-l">Note</div><div class="pc-note-v">' + (fin ?? 0) + ' / ' + total + '</div></div></div>' +
      '<div class="pc-name">Nom : <b>' + esc(st.first_name) + '</b></div>' +
      '<div class="pc-tw"><table class="pc-t"><thead><tr><th class="num">N°</th><th>Question</th><th>Réponse de l’élève</th><th>Bonne réponse</th><th class="pts">Points</th></tr></thead><tbody>' +
      qs.map((q, k) => {
        const r = ans[q.id], ok = r && r.correct;
        const given = !r ? '<span class="ko">Pas de réponse</span>' : (r.given != null && r.given !== '' ? '<span class="gv">' + esc(String(r.given)) + '</span>' : (ok ? 'Bonne réponse' : '—'));
        return '<tr><td class="num">' + (k + 1) + '</td><td>' + esc(qPrint(q)) + '</td><td class="' + (ok ? 'ok' : 'ko') + '">' + given + '</td><td>' + esc(answerText(q)) + '</td><td class="pts ' + (ok ? 'ok' : 'ko') + '">' + (ok ? 1 : 0) + ' / 1</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="pc-sum"><div>Total des réponses : <b>' + (a.score ?? 0) + ' / ' + total + '</b></div>' +
      (a.penalty ? '<div class="pen">Points retirés : −' + a.penalty + (a.penalty_reason ? ' (' + esc(a.penalty_reason) + ')' : '') + '</div>' : '') +
      '<div class="fin">Note finale : ' + (fin ?? 0) + ' / ' + total + '</div></div>' +
      '<div class="pc-sign"><div>Signature des parents<div class="pc-box"></div></div></div></div>';
  },
  printCopies(e, atts){
    const list = atts.filter(a => a.status === 'done');
    if (!list.length) return toast('Aucune copie terminée à imprimer');
    const pages = list.map(a => this.copyHtml(e, a)).join('');
    const el = document.createElement('div'); el.className = 'pv';
    el.innerHTML = '<div class="pv-bar"><button class="nav-btn" id="pvx">Fermer</button><span class="ttl">' + list.length + ' copie' + (list.length > 1 ? 's' : '') + '</span><button class="nav-btn bold" id="pvp">' + I.printer + ' Imprimer</button></div>' + pages;
    document.body.appendChild(el);
    const onKey = ev => { if (ev.key === 'Escape') close(); };
    const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
    document.addEventListener('keydown', onKey);
    el.querySelector('#pvx').onclick = close;
    el.querySelector('#pvp').onclick = () => {
      if (window.__DEMO__) return toast('L’impression n’est pas disponible dans la démo : elle fonctionnera dans la vraie appli');
      document.getElementById('print').innerHTML = pages;
      setTimeout(() => window.print(), 80);
    };
  },

  evalAttemptSheet(a, e){
    const st = this.studentById[a.student_id] || { first_name: '?' };
    const total = (e.questions || []).length, ans = {}; (a.answers || []).forEach(x => { ans[x.qid] = x; });
    const html = '<div class="grabber"></div><div class="sheet-head"><span></span><h2>' + esc(st.first_name) + '</h2><button class="nav-btn bold" data-close>OK</button></div>' +
      '<div class="group"><div class="row"><div class="main t">Note</div><span class="score">' + (a.status === 'done' && a.score != null ? finalScore(a) + ' / ' + total + (a.penalty ? ' <span style="font-weight:400;color:var(--label2);font-size:14px">(' + a.score + ' − ' + a.penalty + ')</span>' : '') : '—') + '</span></div>' +
      '<div class="row"><div class="main t">Commencée à</div><span class="val">' + (a.started_at ? fmtTime(a.started_at) : '—') + '</span></div>' +
      '<div class="row"><div class="main t">Sorties de l’appli</div><span class="val">' + (a.lock_count || 0) + '</span></div></div>' +
      '<div class="section-h">Retirer des points</div><div class="group">' +
        '<div class="row"><div class="main"><div class="t">Points retirés</div><div class="s">En cas de triche ou de comportement</div></div><div class="stepper"><button data-pen="-1" aria-label="Retirer un point de moins">−</button><span id="penv">' + (a.penalty || 0) + '</span><button data-pen="1" aria-label="Retirer un point de plus">+</button></div></div>' +
        '<div class="chips" style="border-top:.5px solid var(--sep)">' + ['Sortie de l\u2019appli', 'Téléphone ou voisin', 'Bavardage'].map(t => '<button class="chip' + (a.penalty_reason === t ? ' on' : '') + '" data-reason="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' +
        '<input class="field" id="preason" value="' + esc(a.penalty_reason || '') + '" placeholder="Motif (facultatif)" style="border-top:.5px solid var(--sep)"></div>' +
      '<button class="btn mt" id="psave" disabled>Enregistrer</button>' +
      (a.status === 'done' ? '<button class="btn tinted mt" id="pprint">' + I.printer + ' Imprimer la copie</button>' : '') +
      (a.status !== 'done' ? '<p class="foot">Le retrait s\u2019applique à la note finale. L\u2019élève peut continuer son évaluation.</p>' : '') +
      ((a.locks || []).length ? '<div class="section-h">Historique des sorties</div><div class="group">' + a.locks.map(l => '<div class="row"><div class="main"><div class="t" style="font-size:15px">' + esc(l.reason || 'Sortie') + '</div></div><span class="val">' + fmtTime(l.at) + '</span></div>').join('') + '</div>' : '') +
      '<div class="section-h">Réponses (' + (a.answers || []).length + ' sur ' + total + ')</div><div class="group">' + (e.questions || []).map((q, k) => {
        const r = ans[q.id];
        return '<div class="row"><div class="main"><div class="t clamp2" style="font-size:15px">' + (k + 1) + '. ' + esc(qLabel(q)) + '</div>' + (r && r.given != null ? '<div class="s">Réponse : ' + esc(String(r.given)) + '</div>' : '') + '</div>' +
          (r ? '<span class="pill ' + (r.correct ? 'green' : 'red') + '">' + (r.correct ? 'Juste' : 'Faux') + '</span>' : '<span class="pill">Pas répondu</span>') + '</div>';
      }).join('') + '</div>';
    openSheet(html, (el, close) => {
      let pen = a.penalty || 0;
      const reason = el.querySelector('#preason'), save = el.querySelector('#psave'), val = el.querySelector('#penv');
      const sync = () => {
        val.textContent = pen;
        el.querySelector('[data-pen="-1"]').disabled = pen <= 0;
        el.querySelector('[data-pen="1"]').disabled = pen >= total;
        save.disabled = pen === (a.penalty || 0) && reason.value.trim() === (a.penalty_reason || '');
        save.textContent = pen === 0 && a.penalty ? 'Annuler le retrait' : pen ? 'Retirer ' + pen + ' point' + (pen > 1 ? 's' : '') : 'Enregistrer';
        save.className = 'btn mt' + (pen ? ' red' : '');
      };
      el.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => { pen = Math.max(0, Math.min(total, pen + +b.dataset.pen)); sync(); });
      el.querySelectorAll('[data-reason]').forEach(b => b.onclick = () => {
        const on = !b.classList.contains('on');
        el.querySelectorAll('[data-reason]').forEach(x => x.classList.remove('on'));
        if (on){ b.classList.add('on'); reason.value = b.dataset.reason; if (!pen) pen = 1; } else reason.value = '';
        sync();
      });
      reason.oninput = () => { el.querySelectorAll('[data-reason]').forEach(x => x.classList.toggle('on', x.dataset.reason === reason.value.trim())); sync(); };
      const pr = el.querySelector('#pprint'); if (pr) pr.onclick = () => { close(); setTimeout(() => this.printCopies(e, [a]), 280); };
      save.onclick = async () => {
        save.disabled = true;
        const { error } = await sb.from('eval_attempts').update({ penalty: pen, penalty_reason: pen ? (reason.value.trim() || null) : null, updated_at: new Date().toISOString() }).eq('id', a.id);
        if (error){ save.disabled = false; return toast('Erreur : ' + esc(error.message)); }
        close(); await this.load(); this.renderEval(e.id, true);
        toast(pen ? pen + ' point' + (pen > 1 ? 's' : '') + ' retiré' + (pen > 1 ? 's' : '') + ' à ' + esc(st.first_name) : 'Retrait annulé pour ' + esc(st.first_name));
      };
      sync();
    });
  },

  renderCourses(){
    const cname = id => (this.classes.find(c => c.id === id) || {}).name;
    const html = nav('', '<button class="nav-btn" id="newco" aria-label="Nouveau cours">' + I.plus + '</button>') +
      '<div class="wrap"><h1 class="large">Cours</h1>' +
      (this.courses.length ? '<div class="group">' + this.courses.map(c => {
        const names = (c.class_ids || []).map(cname).filter(Boolean);
        return '<a class="row" href="#/prof/cours/' + c.id + '"><span style="color:var(--blue);display:flex">' + I.book + '</span><div class="main"><div class="t">' + esc(c.title) + '</div><div class="s">' +
          [c.subject ? esc(c.subject) : null, names.length ? 'Visible pour ' + esc(names.join(', ')) : '<span style="color:var(--orange)">Brouillon, invisible pour les élèves</span>'].filter(Boolean).join(' · ') + '</div></div><span class="chev">' + I.chevR + '</span></a>';
      }).join('') + '</div>'
        : '<div class="empty"><b>Aucun cours</b>Mets ton cours à disposition des élèves : texte, images, PDF ou vidéos. Tu pourras ensuite en tirer des exercices.</div>') +
      '<p class="foot" style="margin-top:14px">Les élèves retrouvent les cours visibles pour leur classe dans leur appli, rubrique « Mes cours ».</p></div>';
    this.shell('cours', html);
    document.getElementById('newco').onclick = () => { this.cdraft = null; go('#/prof/cours/nouveau'); };
  },

  async upload(blob, name, type){
    const safe = String(name || 'fichier').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9._-]+/g, '-').slice(-60);
    const path = this.user.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '-' + safe;
    const { error } = await sb.storage.from('cours').upload(path, blob, { contentType: type || 'application/octet-stream' });
    if (error) throw error;
    return sb.storage.from('cours').getPublicUrl(path).data.publicUrl;
  },

  renderCourseEditor(id){
    const key = id || 'nouveau';
    if (!this.cdraft || this.cdraft._for !== key){
      const src = id ? this.courses.find(c => c.id === id) : null;
      if (id && !src) return go('#/prof/cours');
      this.cdraft = src ? JSON.parse(JSON.stringify(src)) : { title: '', subject: '', blocks: [{ type: 'text', text: '' }], class_ids: [] };
      this.cdraft._for = key;
    }
    const d = this.cdraft;
    const bHtml = (b, i) => {
      const n = d.blocks.length; let inner = '', label = '';
      if (b.type === 'text'){
        label = 'Texte';
        inner = '<div class="tb"><button data-act="fmt" data-k="h" data-b="' + i + '">Titre</button><button data-act="fmt" data-k="kw" data-b="' + i + '">Mot-clé</button><button data-act="fmt" data-k="li" data-b="' + i + '">Liste</button></div>' +
          '<textarea class="field" rows="7" data-b="' + i + '" data-f="text" placeholder="Écris ou colle ton cours ici.">' + esc(b.text || '') + '</textarea>' +
          '<div class="hint">Sélectionne un mot puis touche « Mot-clé » : il est surligné pour les élèves et sert à générer les exercices.</div>';
      } else if (b.type === 'image'){
        label = 'Image';
        inner = b.url ? '<div class="inner-pad"><img src="' + esc(safeUrl(b.url)) + '" alt="Image du cours" style="width:100%;border-radius:10px;display:block"></div><input class="field" data-b="' + i + '" data-f="caption" value="' + esc(b.caption || '') + '" placeholder="Légende (facultatif)" style="border-top:.5px solid var(--sep)">'
          : '<label class="row center" style="min-height:72px;cursor:pointer;flex-direction:column;gap:4px">' + I.image + '<span style="font-size:15px">Choisir une image</span><input type="file" accept="image/*" data-cfile="' + i + '" hidden></label>';
      } else if (b.type === 'file'){
        label = 'Document';
        inner = b.url ? '<div class="row"><span style="color:var(--blue);display:flex">' + I.doc + '</span><input class="field" data-b="' + i + '" data-f="name" value="' + esc(b.name || '') + '" placeholder="Nom du document" style="padding:0"></div>'
          : '<label class="row center" style="min-height:72px;cursor:pointer;flex-direction:column;gap:4px">' + I.doc + '<span style="font-size:15px">Choisir un fichier (PDF, Word, PowerPoint…)</span><input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.odt,.odp" data-cfile="' + i + '" hidden></label>';
      } else {
        label = 'Vidéo ou lien';
        inner = '<input class="field" data-b="' + i + '" data-f="title" value="' + esc(b.title || '') + '" placeholder="Titre (ex. Capsule vidéo sur la machine à vapeur)" style="border-bottom:.5px solid var(--sep)">' +
          '<input class="field" type="url" data-b="' + i + '" data-f="url" value="' + esc(b.url || '') + '" placeholder="Lien (YouTube, site…)" autocapitalize="off" autocorrect="off">';
      }
      return '<div class="qedit"><div class="qedit-head"><span>' + label + '</span><div style="display:flex">' +
        '<button class="icon-btn" data-act="cup" data-b="' + i + '" ' + (i === 0 ? 'disabled' : '') + ' aria-label="Monter">' + I.up + '</button>' +
        '<button class="icon-btn" data-act="cdown" data-b="' + i + '" ' + (i === n - 1 ? 'disabled' : '') + ' aria-label="Descendre">' + I.down + '</button>' +
        '<button class="icon-btn red" data-act="cdel" data-b="' + i + '" aria-label="Supprimer">' + I.trash + '</button></div></div>' + inner + '</div>';
    };
    const html = nav(backBtn('#/prof/cours', 'Cours'), '<button class="nav-btn bold" id="csave">Enregistrer</button>') +
      '<div class="wrap" id="ced"><h1 class="large">' + (id ? 'Modifier le cours' : 'Nouveau cours') + '</h1>' +
      '<div class="group"><input class="field" data-f="title" value="' + esc(d.title) + '" placeholder="Titre (ex. La Révolution industrielle)" style="font-weight:600">' +
      '<div style="height:.5px;background:var(--sep);margin-left:16px"></div><input class="field" data-f="subject" value="' + esc(d.subject || '') + '" placeholder="Cours ou chapitre (facultatif)"></div>' +
      '<div class="section-h">Visible pour</div><div class="group"><div class="chips">' +
        (this.classes.length ? this.classes.map(c => '<button class="chip ' + (d.class_ids.includes(c.id) ? 'on' : '') + '" data-act="cls" data-c="' + c.id + '" aria-pressed="' + d.class_ids.includes(c.id) + '">' + esc(c.name) + '</button>').join('') : '<span style="color:var(--label2);font-size:15px">Crée d’abord une classe.</span>') + '</div></div>' +
      '<p class="foot">Sans classe choisie, le cours reste un brouillon que les élèves ne voient pas.</p>' +
      '<div class="section-h">Contenu</div>' + (d.blocks.length ? d.blocks.map(bHtml).join('') : '<div class="empty">Ajoute un premier bloc avec les boutons ci-dessous.</div>') +
      '<div class="add-row"><button data-act="cadd" data-t="text">' + I.text + 'Texte</button><button data-act="cadd" data-t="image">' + I.image + 'Image</button><button data-act="cadd" data-t="file">' + I.doc + 'Document</button><button data-act="cadd" data-t="link">' + I.play + 'Vidéo ou lien</button></div>' +
      '<div class="group mt2"><button class="row center" data-act="gen" style="gap:8px">' + I.spark + ' Générer des exercices à partir du cours</button><button class="row center" data-act="cprev">Voir comme un élève</button>' +
        (id ? '<button class="row danger" data-act="cdelete">Supprimer le cours</button>' : '') + '</div></div>';
    this.shell('cours', html);
    const ed = document.getElementById('ced');
    const rerender = () => { const y = window.scrollY; this.renderCourseEditor(id); window.scrollTo(0, y); };
    ed.addEventListener('input', e => {
      const t = e.target, f = t.dataset.f; if (!f) return;
      if (t.dataset.b === undefined) d[f] = t.value; else d.blocks[+t.dataset.b][f] = t.value;
    });
    ed.addEventListener('mousedown', e => { if (e.target.closest('[data-act="fmt"]')) e.preventDefault(); });
    ed.addEventListener('change', async e => {
      const t = e.target; if (!t.matches('input[data-cfile]') || !t.files || !t.files[0]) return;
      const b = d.blocks[+t.dataset.cfile], file = t.files[0];
      if (file.size > 25 * 1024 * 1024) return toast('Fichier trop lourd (25 Mo maximum)');
      toast('Envoi en cours…');
      try {
        if (b.type === 'image'){ const url = await loadImage(file); b.url = await this.upload(dataUrlToBlob(url), 'image.jpg', 'image/jpeg'); }
        else { b.url = await this.upload(file, file.name, file.type); b.name = b.name || file.name.replace(/\.[^.]+$/, ''); }
        rerender(); toast('Fichier ajouté');
      } catch(err){ toast('Envoi impossible : ' + esc(err.message || 'réessaie')); }
    });
    ed.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const act = b.dataset.act, i = +b.dataset.b;
      if (act === 'cls'){ const c = b.dataset.c; d.class_ids = d.class_ids.includes(c) ? d.class_ids.filter(x => x !== c) : [...d.class_ids, c]; return rerender(); }
      if (act === 'fmt'){
        const ta = ed.querySelector('textarea[data-b="' + i + '"]'); const st = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
        if (b.dataset.k === 'kw'){
          if (st === en) return toast('Sélectionne d’abord un mot dans le texte');
          const raw = v.slice(st, en), lead = raw.match(/^\s*/)[0], trail = raw.match(/\s*$/)[0], core = raw.trim().replace(/\*\*/g, '');
          ta.value = v.slice(0, st) + lead + '**' + core + '**' + trail + v.slice(en);
        } else {
          const ls = v.lastIndexOf('\n', st - 1) + 1, pre = b.dataset.k === 'h' ? '# ' : '- ';
          ta.value = v.slice(0, ls) + (v.slice(ls).startsWith(pre) ? v.slice(ls + pre.length) : pre + v.slice(ls));
        }
        d.blocks[i].text = ta.value; ta.focus(); return;
      }
      if (act === 'cadd'){
        const t = b.dataset.t;
        d.blocks.push(t === 'text' ? { type: 'text', text: '' } : t === 'image' ? { type: 'image', url: '', caption: '' } : t === 'file' ? { type: 'file', url: '', name: '' } : { type: 'link', url: '', title: '' });
        this.renderCourseEditor(id);
        const cards = document.querySelectorAll('.qedit'); const last = cards[cards.length - 1];
        if (last){ last.scrollIntoView({ behavior: 'smooth', block: 'center' }); const f = last.querySelector('textarea,input:not([type=file])'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 300); }
        return;
      }
      if (act === 'cup' && i > 0){ [d.blocks[i - 1], d.blocks[i]] = [d.blocks[i], d.blocks[i - 1]]; return rerender(); }
      if (act === 'cdown' && i < d.blocks.length - 1){ [d.blocks[i + 1], d.blocks[i]] = [d.blocks[i], d.blocks[i + 1]]; return rerender(); }
      if (act === 'cdel'){ if (await confirmDialog('Supprimer ce bloc ?', '', 'Supprimer', true)){ d.blocks.splice(i, 1); rerender(); } return; }
      if (act === 'cprev') return Student.showCourse(d, () => route(), 'Retour à l’éditeur', true);
      if (act === 'gen') return this.genSheet(d, id);
      if (act === 'cdelete'){
        if (!await confirmDialog('Supprimer « ' + (d.title || 'ce cours') + ' » ?', 'Les élèves n’y auront plus accès. Les séries d’exercices sont conservées.', 'Supprimer', true)) return;
        const { error } = await sb.from('courses').delete().eq('id', id);
        if (error) return toast('Erreur : ' + esc(error.message));
        this.cdraft = null; await this.load(); go('#/prof/cours'); toast('Cours supprimé');
      }
    });
    document.getElementById('csave').onclick = async () => {
      if (!String(d.title || '').trim()) return toast('Donne un titre au cours.');
      const blocks = d.blocks.filter(b => b.type === 'text' ? String(b.text || '').trim() : !!b.url);
      const payload = { title: d.title.trim(), subject: (d.subject || '').trim() || null, blocks, class_ids: d.class_ids, updated_at: new Date().toISOString() };
      const btn = document.getElementById('csave'); btn.disabled = true;
      const res = id ? await sb.from('courses').update(payload).eq('id', id) : await sb.from('courses').insert({ ...payload, teacher_id: this.user.id });
      btn.disabled = false;
      if (res.error) return toast('Erreur : ' + esc(res.error.message));
      this.cdraft = null; await this.load(); go('#/prof/cours'); toast('Cours enregistré');
    };
  },

  genSheet(c, id){
    const html = '<div class="grabber"></div><div class="sheet-head"><span></span><h2>Générer des exercices</h2><button class="nav-btn bold" data-close>Annuler</button></div>' +
      '<div class="group"><button class="row" id="auto"><span style="color:var(--blue);display:flex">' + I.spark + '</span><div class="main"><div class="t">Générer automatiquement</div><div class="s">Textes à trous et choix multiples créés à partir des mots-clés surlignés. Immédiat.</div></div><span class="chev">' + I.chevR + '</span></button>' +
      '<button class="row" id="claude"><span style="color:var(--blue);display:flex">' + I.text + '</span><div class="main"><div class="t">Demander à Claude</div><div class="s">Des questions plus variées. Tu copies la demande, tu la colles dans Claude, puis tu importes sa réponse.</div></div><span class="chev">' + I.chevR + '</span></button></div>' +
      '<p class="foot">Dans les deux cas, la série s’ouvre dans l’éditeur pour que tu la relises avant de l’enregistrer.</p>';
    openSheet(html, (el, close) => {
      el.querySelector('#auto').onclick = () => {
        const qs = genFromCourse(c);
        if (!qs.length) return toast('Marque d’abord des mots-clés dans le texte du cours');
        close();
        this.draft = { _for: 'nouveau', title: 'Exercices : ' + (c.title || 'cours'), subject: c.subject || '', description: '', recap: '', course_id: id || null, pass_score: 70, questions: qs };
        go('#/prof/exercices/nouveau');
        setTimeout(() => toast(qs.length + ' questions créées : relis-les avant d’enregistrer'), 400);
      };
      el.querySelector('#claude').onclick = () => { close(); setTimeout(() => this.claudeSheet(c, id), 280); };

  claudeSheet(c, id){
    const html = '<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-close>Annuler</button><h2>Avec Claude</h2><button class="nav-btn bold" id="doimp">Importer</button></div>' +
      '<div class="group"><div class="row"><span class="step-n">1</span><div class="main" style="font-size:16px">Copie la demande, préparée à partir de ton cours</div></div><button class="row center" id="cpy">Copier la demande</button></div>' +
      '<div class="group mt"><div class="row"><span class="step-n">2</span><div class="main" style="font-size:16px">Colle-la dans une nouvelle conversation avec Claude</div></div></div>' +
      '<div class="group mt"><div class="row"><span class="step-n">3</span><div class="main" style="font-size:16px">Copie la réponse de Claude et colle-la ici</div></div><textarea class="field" id="impt" rows="6" style="font-family:ui-monospace,Menlo,monospace;font-size:13px;border-top:.5px solid var(--sep)" placeholder="Réponse de Claude"></textarea></div>';
    openSheet(html, (el, close) => {

  },

  renderStudent(sid){
    const stu = this.studentById[sid]; if (!stu) return go('#/prof/classes');
    const c = this.classes.find(x => x.id === stu.class_id);
    const ST = { done: ['Validé', 'green'], late: ['En retard', 'red'], progress: ['Pas validé', 'orange'], todo: ['Pas commencé', ''] };
    const order = { late: 0, todo: 1, progress: 2, done: 3 };
    const list = this.assignments.filter(a => a.student_id === sid)
      .map(a => { const st = this.stat(a); const hints = st.atts.reduce((t, at) => t + (at.answers || []).filter(x => x.hint).length, 0); return { a, st, stu, hints, set: this.sets.find(s => s.id === a.set_id) }; })
      .filter(x => x.set)
      .sort((x, y) => order[x.st.status] - order[y.st.status] || (y.a.created_at || '').localeCompare(x.a.created_at || ''));
    const nDone = list.filter(x => x.st.done).length, nLate = list.filter(x => x.st.late).length;
    const scored = list.filter(x => x.st.best != null);
    const avg = scored.length ? Math.round(scored.reduce((t, x) => t + x.st.best, 0) / scored.length) : null;
    const time = list.reduce((t, x) => t + x.st.time, 0);
    const last = list.map(x => x.st.last).filter(Boolean).sort().pop();
    const html = nav(backBtn('#/prof/classes/' + c.id, c.name), '<button class="nav-btn" id="code">Code d’accès</button>') +
      '<div class="wrap"><div style="display:flex;align-items:center;gap:14px;margin:4px 0 16px"><div class="avatar" style="width:58px;height:58px;font-size:23px">' + initials(stu.first_name) + '</div>' +
      '<div style="min-width:0"><h1 class="large" style="margin:0">' + esc(stu.first_name) + '</h1><div class="subtitle" style="margin:0">' + esc(c.name) + '</div></div></div>' +
      '<div class="tiles"><div class="tile"><div class="n">' + list.length + '</div><div class="l">Séries</div></div>' +
      '<div class="tile"><div class="n" style="color:var(--green)">' + nDone + '</div><div class="l">Validées</div></div>' +
      '<div class="tile"><div class="n" style="color:var(--red)">' + nLate + '</div><div class="l">En retard</div></div></div>' +
      '<div class="group mt"><div class="row"><div class="main t">Score moyen</div><span class="val">' + (avg == null ? '—' : avg + ' %') + '</span></div>' +
      '<div class="row"><div class="main t">Temps de travail</div><span class="val">' + fmtDuration(time) + '</span></div>' +
      '<div class="row"><div class="main t">Dernière activité</div><span class="val">' + (last ? fmtDateTime(last) : '—') + '</span></div>' +
      '<div class="row"><div class="main t">« Je n’ai pas compris »</div><span class="val">' + (this.flags || []).filter(f => f.student_id === sid).length + '</span></div></div>' +
      '<p class="foot">Le score moyen se calcule sur le meilleur essai de chaque série commencée.</p>' +
      this.copySection(sid, stu) +
      '<div class="section-h">Séries (' + list.length + ')<button id="asgstu">Assigner des séries</button></div>' +
      (list.length ? '<div class="group">' + list.map(x => {
        const [lab, col] = ST[x.st.status];
        const meta = x.st.count ? 'Meilleur ' + x.st.best + ' % · ' + x.st.count + ' essai' + (x.st.count > 1 ? 's' : '') + ' · ' + fmtDuration(x.st.time) : (x.a.due_date ? 'Pour le ' + fmtDate(x.a.due_date) : 'Aucun essai');
        return '<button class="row" data-a="' + x.a.id + '"><div class="main"><div class="t">' + esc(x.set.title) + '</div><div class="s">' + meta + '</div></div><span class="pill ' + col + '">' + lab + '</span></button>';
      }).join('') + '</div>' : '<div class="empty">Aucune série n’est assignée à ' + esc(stu.first_name) + ' pour l’instant.</div>') +
      '</div>';
    this.shell('classes', html);
    document.getElementById('code').onclick = () => this.studentSheet(c, c.students.find(s => s.id === sid));
    document.getElementById('asgstu').onclick = () => this.assignSheet(null, { student: sid });
    $app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const x = list.find(y => y.a.id === b.dataset.a); this.attemptSheet(x, x.set, true); });
  },

  /* ---------- Copies corrigées ---------- */
  copySection(sid, stu){
    const list = (this.copies || []).filter(c => c.student_id === sid);
    const pill = c => !c.published ? ['Brouillon', 'orange'] : c.seen_at ? ['Vue', 'green'] : ['Envoyée', 'blue'];
    return '<div class="section-h">Copies corrigées (' + list.length + ')</div>' +
      (list.length ? '<div class="group">' + list.map(c => {
