          (c.comments || []).length ? (c.comments || []).length + ' commentaire' + ((c.comments || []).length > 1 ? 's' : '') : null].filter(Boolean).join(' · ');
        const ai = (c.comments || []).some(x => x.ai && !x.ok);
        return '<a class="row" href="#/prof/copie/' + c.id + '"><div class="main"><div class="t">' + esc(c.title) + '</div><div class="s">' + esc(meta || 'Pas encore de commentaire') + (ai ? ' · <span style="color:var(--purple)">commentaires IA à valider</span>' : '') + '</div></div><span class="pill ' + col + '">' + lab + '</span><span class="chev">' + I.chevR + '</span></a>';
      }).join('') + '</div>' : '') +
      '<div class="group' + (list.length ? ' mt' : '') + '"><a class="row center" href="#/prof/copie/nouveau-' + sid + '" style="gap:8px;color:var(--blue)">' + I.plus + ' Ajouter une copie corrigée</a></div>' +
      '<p class="foot">Dépose la copie corrigée et ajoute tes commentaires à côté des exercices. ' + esc(stu.first_name) + ' la retrouve dans l’onglet Évaluation de son appli.</p>';
  },

  async renderCopyEditor(id){
    const isNew = id.startsWith('nouveau-');
    if (!this.pdraft || this.pdraft._for !== id){
      if (isNew){
        const sid = id.slice(8);
        if (!this.studentById[sid]) return go('#/prof/classes');
        this.pdraft = { _for: id, student_id: sid, title: '', copy_date: todayLocal(), score: null, total: null, general: '', comments: [], pages: [], published: false, published_at: null, seen_at: null };
      } else {
        loading();
        const { data, error } = await sb.from('copies').select('*').eq('id', id).maybeSingle();
        if (error || !data){ toast('Copie introuvable'); return go('#/prof/classes'); }
        this.pdraft = { ...data, _for: id, _was: data.published, general: data.general || '', comments: data.comments || [], pages: data.pages || [] };
      }
    }
    const d = this.pdraft, stu = this.studentById[d.student_id];
    if (!stu) return go('#/prof/classes');
    const nP = d.pages.length;
    const pagesHtml = nP ? '<div class="pgrid">' + d.pages.map((p, i) => '<div class="pthumb"><img src="' + esc(p.src) + '" alt="Page ' + (i + 1) + '"><div class="pbar"><span>Page ' + (i + 1) + '</span>' +
        '<button class="icon-btn" data-act="pup" data-i="' + i + '" ' + (i === 0 ? 'disabled' : '') + ' aria-label="Avancer">' + I.up + '</button>' +
        '<button class="icon-btn red" data-act="pdel" data-i="' + i + '" aria-label="Retirer la page">' + I.trash + '</button></div></div>').join('') + '</div>'
      : '<div class="empty" style="padding:22px 16px">Aucune page pour l’instant. Ajoute une photo ou le PDF de la copie corrigée.</div>';
    const comHtml = (c, i) => {
      const n = d.comments.length, pend = c.ai && !c.ok;
      return '<div class="qedit"' + (pend ? ' style="box-shadow:inset 0 0 0 2px var(--purple),var(--shadow)"' : '') + '><div class="qedit-head"><span>' + (c.ai ? (pend ? '<b style="color:var(--purple)">Proposé par l’IA · à relire</b>' : 'Proposé par l’IA · validé') : 'Commentaire') + '</span><div style="display:flex">' +
        '<button class="icon-btn" data-act="cup" data-i="' + i + '" ' + (i === 0 ? 'disabled' : '') + ' aria-label="Monter">' + I.up + '</button>' +
        '<button class="icon-btn" data-act="cdown" data-i="' + i + '" ' + (i === n - 1 ? 'disabled' : '') + ' aria-label="Descendre">' + I.down + '</button>' +
        '<button class="icon-btn red" data-act="cdel" data-i="' + i + '" aria-label="Supprimer">' + I.trash + '</button></div></div>' +
        '<input class="field" data-c="' + i + '" data-f="label" value="' + esc(c.label || '') + '" placeholder="Exercice (ex. Partie A, exercice 2)" style="font-weight:600">' +
        '<textarea class="field" rows="3" data-c="' + i + '" data-f="text" placeholder="Ce qui ne va pas, ce qu’il faut revoir…">' + esc(c.text || '') + '</textarea>' +
        (nP ? '<div class="row"><div class="main t" style="font-size:15px">Afficher sous</div><select class="field" data-c="' + i + '" data-f="page" style="width:auto;padding:0;text-align:right;color:var(--blue)"><option value="">la liste générale</option>' +
          d.pages.map((p, k) => '<option value="' + (k + 1) + '"' + (+c.page === k + 1 ? ' selected' : '') + '>la page ' + (k + 1) + '</option>').join('') + '</select></div>' : '') +
        (pend ? '<button class="row center" data-act="cok" data-i="' + i + '" style="color:var(--purple);font-weight:600;gap:6px">' + I.check + ' J’ai relu, je valide</button>' : '') + '</div>';
    };
    const pend = d.comments.filter(c => c.ai && !c.ok).length;
    const status = !d.published ? 'Brouillon : ' + esc(stu.first_name) + ' ne voit pas encore cette copie.'
      : d.seen_at ? 'Vue par ' + esc(stu.first_name) + ' le ' + fmtDateTime(d.seen_at) + '.' : 'Envoyée' + (d.published_at ? ' le ' + fmtDateTime(d.published_at) : '') + ', pas encore ouverte.';
    const html = nav(backBtn('#/prof/eleve/' + d.student_id, stu.first_name), '<button class="nav-btn bold" id="psave">Enregistrer</button>') +
      '<div class="wrap" id="ped"><h1 class="large">Copie corrigée</h1><p class="subtitle">' + esc(stu.first_name) + ' · ' + esc(stu.class_name || '') + '</p>' +
      '<div class="group"><input class="field" data-f="title" value="' + esc(d.title) + '" placeholder="Titre (ex. Évaluation : les pays d’Europe)" style="font-weight:600">' +
      '<div class="row"><div class="main t">Date</div><input class="field" type="date" data-f="copy_date" value="' + esc(d.copy_date || '') + '" style="width:auto;padding:0;text-align:right"></div>' +
      '<div class="row"><div class="main t">Note</div><input class="field" inputmode="decimal" data-f="score" value="' + (d.score == null ? '' : fmtNum(d.score)) + '" aria-label="Points obtenus" style="width:64px;padding:6px 8px;text-align:right;background:var(--fill);border-radius:8px">' +
        '<span style="margin:0 8px;color:var(--label2)">/</span><input class="field" inputmode="decimal" data-f="total" value="' + (d.total == null ? '' : fmtNum(d.total)) + '" aria-label="Total" style="width:64px;padding:6px 8px;background:var(--fill);border-radius:8px"></div></div>' +
      '<div class="section-h">Pages de la copie (' + nP + ')</div><div class="group">' + pagesHtml + '</div>' +
      '<div class="add-row"><label>' + I.image + 'Photo ou image<input type="file" accept="image/*" multiple data-pfile="img" hidden></label><label>' + I.doc + 'PDF<input type="file" accept="application/pdf,.pdf" data-pfile="pdf" hidden></label></div>' +
      '<p class="foot">Les pages sont enregistrées dans l’appli, pas sur un site public. Pense à cacher le nom de famille avant la photo.</p>' +
      '<div class="section-h">Mot général</div><div class="group"><textarea class="field" rows="3" data-f="general" placeholder="Facultatif. Ex. : Bon travail sur la carte, revois les capitales.">' + esc(d.general) + '</textarea></div>' +
      '<div class="section-h">Commentaires à côté des exercices (' + d.comments.length + ')</div>' +
      (() => { const N = this.exCount(), has = k => d.comments.some(c => c.label === 'Exercice ' + k);
        return '<div class="group"><div class="row" style="padding-bottom:0"><div class="main"><div class="t">Touche le numéro de l’exercice</div><div class="s">Le commentaire se crée avec son titre, il ne reste qu’à écrire.</div></div></div>' +
          '<div class="chips exnum">' + Array.from({ length: N }, (x, k) => '<button class="chip ' + (has(k + 1) ? 'on' : '') + '" data-act="exn" data-i="' + (k + 1) + '" aria-label="Exercice ' + (k + 1) + '">' + (k + 1) + '</button>').join('') +
          '<button class="chip" data-act="exless" aria-label="Moins d’exercices">−</button><button class="chip" data-act="exmore" aria-label="Plus d’exercices">+</button></div></div>'; })() +
      (d.comments.length ? d.comments.map(comHtml).join('') : '<div class="empty">Ajoute un commentaire par exercice à expliquer.</div>') +
      '<div class="group mt"><button class="row center" data-act="cadd" style="gap:8px;color:var(--blue)">' + I.plus + ' Ajouter un commentaire</button></div>' +
      '<p class="foot">Commentaires rédigés par l’IA : envoie la copie corrigée à Claude dans ta conversation. Ses propositions arrivent ici en violet, et tu les relis avant l’envoi.</p>' +
      '<div class="section-h">Envoi</div><div class="group"><label class="row" style="cursor:pointer"><div class="main"><div class="t">Visible par ' + esc(stu.first_name) + '</div><div class="s">' + status + '</div></div><span class="switch"><input type="checkbox" id="ppub" ' + (d.published ? 'checked' : '') + ' aria-label="Visible par l’élève"><span></span></span></label></div>' +
      (pend ? '<p class="foot" style="color:var(--purple)">' + pend + ' commentaire' + (pend > 1 ? 's' : '') + ' de l’IA à valider avant l’envoi.</p>' : '') +
      '<div class="group mt2"><button class="row center" data-act="pprev">Voir comme l’élève</button>' + (isNew ? '' : '<button class="row danger" data-act="pdelete">Supprimer la copie</button>') + '</div></div>';
    this.shell('classes', html);
    const ed = document.getElementById('ped');
    const rerender = () => { const y = window.scrollY; this.renderCopyEditor(id); window.scrollTo(0, y); };
    ed.addEventListener('change', e => { const t = e.target; if (t.matches('select[data-f="page"]')) d.comments[+t.dataset.c].page = t.value ? +t.value : null; });
    ed.addEventListener('input', e => {
      const t = e.target, f = t.dataset.f; if (!f || f === 'page') return;
      if (t.dataset.c !== undefined) d.comments[+t.dataset.c][f] = t.value;
      else if (f === 'score' || f === 'total') d[f] = t.value;
      else d[f] = t.value;
    });
    document.getElementById('ppub').onchange = e => {
      if (e.target.checked && d.comments.some(c => c.ai && !c.ok)){ e.target.checked = false; return toast('Valide d’abord les commentaires proposés par l’IA'); }
      d.published = e.target.checked;
      const sEl = e.target.closest('.row').querySelector('.s');
      if (sEl) sEl.textContent = d.published ? (d._was ? 'Visible. Enregistre pour mettre à jour.' : 'Sera envoyée quand tu touches Enregistrer.') : 'Brouillon : ' + stu.first_name + ' ne verra pas cette copie.';
    };
    ed.addEventListener('change', async e => {
      const t = e.target; if (!t.matches('input[data-pfile]') || !t.files || !t.files.length) return;
      const files = [...t.files]; t.value = '';
      toast('Préparation des pages…');
      try {
        for (const f of files){
          const imgs = t.dataset.pfile === 'pdf' || f.type === 'application/pdf' ? await pdfToPages(f) : [await loadPage(f)];
          imgs.forEach(src => d.pages.push({ src }));
        }
        if (d.pages.length > 12){ d.pages = d.pages.slice(0, 12); toast('12 pages maximum par copie'); }
        rerender();
      } catch(err){ console.error(err); toast('Ce fichier ne peut pas être lu'); }
    });
    ed.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const act = b.dataset.act, i = +b.dataset.i;
      if (act === 'pup' && i > 0){ d.comments.forEach(c => { if (c.page === i + 1) c.page = i; else if (c.page === i) c.page = i + 1; }); [d.pages[i - 1], d.pages[i]] = [d.pages[i], d.pages[i - 1]]; return rerender(); }
      if (act === 'pdel'){ if (await confirmDialog('Retirer la page ' + (i + 1) + ' ?', '', 'Retirer', true)){ d.pages.splice(i, 1); d.comments.forEach(c => { if (c.page === i + 1) c.page = null; else if (c.page > i + 1) c.page--; }); rerender(); } return; }
      if (act === 'cadd'){
        d.comments.push({ label: '', text: '' }); rerender();
        const cards = document.querySelectorAll('#ped .qedit'); const last = cards[cards.length - 1];
        if (last){ last.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => last.querySelector('input').focus({ preventScroll: true }), 300); }
        return;
      }
      if (act === 'cup' && i > 0){ [d.comments[i - 1], d.comments[i]] = [d.comments[i], d.comments[i - 1]]; return rerender(); }
      if (act === 'cdown' && i < d.comments.length - 1){ [d.comments[i + 1], d.comments[i]] = [d.comments[i], d.comments[i + 1]]; return rerender(); }
      if (act === 'cdel'){ if (await confirmDialog('Supprimer ce commentaire ?', '', 'Supprimer', true)){ d.comments.splice(i, 1); rerender(); } return; }
      if (act === 'cok'){ d.comments[i].ok = true; return rerender(); }
      if (act === 'exmore' || act === 'exless'){ this.exCount(Math.max(1, Math.min(40, this.exCount() + (act === 'exmore' ? 1 : -1)))); return rerender(); }
      if (act === 'exn'){
        const lab = 'Exercice ' + i; let k = d.comments.findIndex(c => c.label === lab);
        if (k < 0){
          const num = c => { const m = /^Exercice (\d+)$/.exec(c.label || ''); return m ? +m[1] : null; };
          k = d.comments.findIndex(c => num(c) != null && num(c) > i); if (k < 0) k = d.comments.length;
          d.comments.splice(k, 0, { label: lab, text: '' }); rerender();
        }
        const ta = document.querySelector('#ped textarea[data-c="' + k + '"]');
        if (ta){ ta.closest('.qedit').scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => ta.focus({ preventScroll: true }), 300); }
        return;
      }
      if (act === 'pprev') return Student.showCopy(this.copyView(d), () => this.renderCopyEditor(id), 'Retour à la copie', true);
      if (act === 'pdelete'){
        if (!await confirmDialog('Supprimer cette copie ?', stu.first_name + ' ne la verra plus. Cette action est définitive.', 'Supprimer', true)) return;
        const { error } = await sb.from('copies').delete().eq('id', id);
        if (error) return toast('Erreur : ' + esc(error.message));
        this.pdraft = null; await this.load(); go('#/prof/eleve/' + d.student_id); toast('Copie supprimée');
      }
    });
    document.getElementById('psave').onclick = async () => {
      if (!String(d.title || '').trim()) return toast('Donne un titre à la copie.');
      const sc = parseNum(d.score), tot = parseNum(d.total);
      if (sc === false || tot === false) return toast('La note doit être un nombre (ex. 14,5).');
      if (d.published && d.comments.some(c => c.ai && !c.ok)) return toast('Valide d’abord les commentaires proposés par l’IA');
      const comments = d.comments.filter(c => String(c.text || '').trim() || String(c.label || '').trim()).map(c => ({ label: String(c.label || '').trim(), text: String(c.text || '').trim(), ...(c.page ? { page: +c.page } : {}), ...(c.ai ? { ai: true, ok: !!c.ok } : {}) }));
      const payload = { title: d.title.trim(), copy_date: d.copy_date || null, score: sc, total: tot, general: String(d.general || '').trim() || null,
        comments, pages: d.pages, published: !!d.published, updated_at: new Date().toISOString() };
      if (d.published && !d._was) payload.published_at = new Date().toISOString();
      if (!d.published) payload.published_at = null;
      if (JSON.stringify(payload.pages).length > 9e6) return toast('Copie trop lourde : retire une page.');
      const btn = document.getElementById('psave'); btn.disabled = true;
      const res = isNew ? await sb.from('copies').insert({ ...payload, student_id: d.student_id, teacher_id: this.user.id }).select('id').single()
        : await sb.from('copies').update(payload).eq('id', id);
      btn.disabled = false;
      if (res.error) return toast('Erreur : ' + esc(res.error.message));
      this.pdraft = null; await this.load();
      toast(payload.published ? (d._was ? 'Copie mise à jour' : 'Copie envoyée à ' + esc(stu.first_name)) : 'Brouillon enregistré');
      go('#/prof/eleve/' + d.student_id);
    };
  },
  exCount(n){
    if (n){ try { store.set('exos_nex', String(n)); } catch(e){} return n; }
    const v = +(store.get('exos_nex') || 0); return v >= 1 && v <= 40 ? v : 10;
  },
  copyView(d){
    const sc = parseNum(d.score), tot = parseNum(d.total);
    return { title: d.title || 'Copie corrigée', copy_date: d.copy_date, score: typeof sc === 'number' ? sc : null, total: typeof tot === 'number' ? tot : null,
      general: d.general, comments: (d.comments || []).filter(c => String(c.text || '').trim()).map(c => ({ label: c.label, text: c.text, page: c.page || null, ai: !!c.ai })), pages: d.pages };
  },

  addStudentsSheet(c){
    const html = '<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-close>Annuler</button><h2>Ajouter des élèves</h2><button class="nav-btn bold" id="ok">Ajouter</button></div>' +
      '<textarea class="field alone" id="names" style="min-height:220px" placeholder="Un prénom par ligne&#10;Kevin&#10;Sarah&#10;Yassine"></textarea>' +
      '<p class="foot">Si deux élèves ont le même prénom, ajoute l\u2019initiale du nom (Lucas B., Lucas M.).</p>';
    openSheet(html, (el, close) => {
      setTimeout(() => el.querySelector('#names').focus(), 300);
      el.querySelector('#ok').onclick = async () => {
        const names = el.querySelector('#names').value.split(/\n|,|;/).map(s => s.trim()).filter(Boolean);
        if (!names.length) return;
        const { error } = await sb.from('students').insert(names.map(n => ({ first_name: n.slice(0, 40), class_id: c.id, teacher_id: this.user.id })));
        if (error) return toast('Erreur : ' + esc(error.message));
        close(); await this.load(); this.renderClass(c.id); toast(names.length + ' élève' + (names.length > 1 ? 's ajoutés' : ' ajouté'));
      };
    });
  },

  studentSheet(c, s){
    const link = personalLink(s.code);
    let qr = '';
    try { const q = qrcode(0, 'M'); q.addData(link); q.make(); qr = q.createSvgTag(4, 0); } catch(e){}
    const html = '<div class="grabber"></div><div class="sheet-head"><span></span><h2>' + esc(s.first_name) + '</h2><button class="nav-btn bold" data-close>OK</button></div>' +
      '<div class="group" style="padding:22px;text-align:center"><div style="font-size:13px;color:var(--label2);margin-bottom:6px">Code personnel</div><div class="code" style="font-size:34px">' + esc(s.code) + '</div>' +
      (qr ? '<div style="background:#fff;display:inline-block;padding:10px;border-radius:10px;margin-top:16px;line-height:0">' + qr + '</div>' : '') + '</div>' +
      '<div class="group mt"><button class="row center" id="cp">Copier le lien personnel</button><button class="row center" id="rn">Modifier le prénom</button><button class="row danger" id="del">Supprimer l\u2019élève</button></div>';
    openSheet(html, (el, close) => {
      el.querySelector('#cp').onclick = () => copyText(link, 'Lien copié');
      el.querySelector('#rn').onclick = () => { close(); setTimeout(() => this.renameStudentSheet(c, s), 250); };
      el.querySelector('#del').onclick = async () => {
        if (!await confirmDialog('Supprimer ' + s.first_name + ' ?', 'Ses résultats seront aussi supprimés et son code ne fonctionnera plus.', 'Supprimer', true)) return;
        const { error } = await sb.from('students').delete().eq('id', s.id);
        if (error) return toast('Erreur : ' + esc(error.message));
        close(); await this.load(); go('#/prof/classes/' + c.id); toast('Élève supprimé');
      };
    });
  },

  renameStudentSheet(c, s){
    const html = '<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-close>Annuler</button><h2>Modifier le prénom</h2><button class="nav-btn bold" id="ok">OK</button></div>' +
      '<input class="field alone" id="sn" value="' + esc(s.first_name) + '" placeholder="Prénom">';
    openSheet(html, (el, close) => {
      const inp = el.querySelector('#sn'); setTimeout(() => inp.focus(), 300);
      const submit = async () => {
        const n = inp.value.trim(); if (!n) return;
        const { error } = await sb.from('students').update({ first_name: n.slice(0, 40) }).eq('id', s.id);
        if (error) return toast('Erreur : ' + esc(error.message));
        close(); await this.load(); route();
      };
      el.querySelector('#ok').onclick = submit;
      inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
    });
  },

  printCodes(c){
    const base = location.origin + location.pathname;
    document.getElementById('print').innerHTML = '<div class="pgrid">' + c.students.map(s => {
      let qr = ''; try { const q = qrcode(0, 'M'); q.addData(personalLink(s.code)); q.make(); qr = q.createSvgTag(3, 0); } catch(e){}
      return '<div class="pcard"><div class="pc">' + esc(c.name) + ' · Mes exercices</div><div class="pn">' + esc(s.first_name) + '</div>' + qr +
        '<div class="pk">' + esc(s.code) + '</div><div class="pu">Scanne le QR code ou va sur<br>' + esc(base.replace(/^https?:\/\//, '')) + '</div></div>';
    }).join('') + '</div>';
    setTimeout(() => window.print(), 100);
  }
};

/* ---------- Routeur ---------- */
async function route(){
  if (Student.exam){ Student.examDisarm(); Student.exam = false; }
  clearTimeout(Student._hp);
  if (Prof._poll){ clearInterval(Prof._poll); Prof._poll = null; }
  const h = location.hash || '#/';
  if (/access_token|error_description|type=signup/.test(h)){ await sb.auth.getSession(); history.replaceState(null, '', location.pathname + '#/prof'); return route(); }
  const parts = h.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'e' && parts[1]){
    store.set('exos_code', parts[1].toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6));
    Student.me = null; history.replaceState(null, '', location.pathname + '#/'); return Student.start();
  }
  document.body.classList.toggle('prof', parts[0] === 'prof');
  document.querySelectorAll('.sheet-wrap').forEach(x => x.remove());
  if (parts[0] === 'prof') return Prof.route(parts.slice(1));
  return Student.start();
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (location.hash === '' || location.hash === '#/') && Student.code && !Student.sess_active && document.querySelector('#refresh')) Student.loadList(true);
});
route();
</script>
</body>
