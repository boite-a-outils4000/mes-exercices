<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exos">
<title>Mes exercices</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23007aff'/%3E%3Cpath d='M28 52l14 14 30-32' fill='none' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--elev:#fff;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.2);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--gray:#8e8e93;--segon:#fff;--purple:#af52de;--teal:#30b0c7;--indigo:#5856d6;--pink:#ff2d55;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--elev:#2c2c2e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--gray:#8e8e93;--segon:#636366;--purple:#bf5af2;--teal:#40c8e0;--indigo:#5e5ce6;--pink:#ff375f;--shadow:none;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--elev:#2c2c2e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--gray:#8e8e93;--segon:#636366;--purple:#bf5af2;--teal:#40c8e0;--indigo:#5e5ce6;--pink:#ff375f;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--label);min-height:100vh;
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.wrap.notab{padding-bottom:calc(40px + env(safe-area-inset-bottom))}

/* Barre de navigation */
.nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.nav-inner{max-width:680px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.nav-btn{background:none;border:0;color:var(--blue);font-size:17px;padding:8px;display:flex;align-items:center;gap:5px;text-decoration:none;min-height:44px}
.nav-btn.bold{font-weight:600}
.nav-btn:disabled{opacity:.35}
.nav-side{display:flex;align-items:center;min-width:60px}
.nav-side.r{justify-content:flex-end}
h1.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em;margin:2px 0 6px}
.subtitle{color:var(--label2);font-size:15px;margin-bottom:14px}
.section-h{font-size:13px;text-transform:uppercase;color:var(--label2);margin:26px 16px 7px;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:center}
.section-h button{text-transform:none;font-size:15px;background:none;border:0;color:var(--blue)}
.foot{font-size:13px;color:var(--label2);margin:7px 16px 0;line-height:1.4}

/* Listes groupées */
.group{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;background:var(--card);
  width:100%;border:0;text-align:left;text-decoration:none;color:inherit}
.row+.row::before,.row+.sub-sep::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.row:active,a.row:active{background:var(--fill2)}
.row .main{flex:1;min-width:0}
.row .t{font-size:17px;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--label2);margin-top:2px}
.row .val{color:var(--label2);font-size:17px;white-space:nowrap}
.row .chev{color:var(--label3);flex:none;display:flex}
.fold-h .fic{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.fold-h .chev svg{transition:transform .2s}.fold-h.open .chev svg{transform:rotate(90deg)}
.fold-h .more{flex:none;color:var(--blue);font-size:15px;padding:6px 2px 6px 8px}
.fold+.fold,.fold+.section-h{margin-top:12px}
.row.center{justify-content:center;color:var(--blue)}
.row.danger{color:var(--red);justify-content:center}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--fill2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--label2);flex:none}

.pill{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.orange{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.blue{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:17px;text-decoration:none;transition:opacity .15s,transform .1s}
.btn:active{opacity:.8;transform:scale(.99)}
.btn.tinted{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.btn.plain{background:none;color:var(--blue);font-weight:500}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.gray{background:var(--fill2);color:var(--label)}
.btn:disabled{opacity:.4}
.btn.small{height:34px;width:auto;padding:0 14px;border-radius:999px;font-size:15px}
.stack{display:flex;flex-direction:column;gap:10px}
.hstack{display:flex;gap:8px;flex-wrap:wrap}
.mt{margin-top:16px}.mt2{margin-top:28px}

/* Champs */
.field{width:100%;background:var(--card);border:0;padding:12px 16px;font-size:17px;outline:none;display:block;resize:none}
.field::placeholder{color:var(--label3)}
.field.alone{border-radius:12px}
textarea.field{min-height:80px;line-height:1.4}
.code-field{text-align:center;font:600 30px/1 "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.3em;padding:18px;border-radius:14px;text-transform:uppercase}
.code{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.1em}
.err{color:var(--red);font-size:15px;text-align:center}

/* Contrôle segmenté */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--segon);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}

/* Barre d'onglets */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tabbar a{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 4px;font-size:10.5px;font-weight:500;color:var(--gray);text-decoration:none}
.tabbar a.on{color:var(--blue)}

/* Tuiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .n{font-size:28px;font-weight:700;line-height:1.1}
.tile .l{font-size:13px;color:var(--label2);margin-top:2px}
.sbar{display:flex;gap:2px;height:7px;margin:7px 0 5px;border-radius:4px;overflow:hidden}.sbar i{display:block;height:100%}
.ring{position:relative;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}.ring svg{position:absolute;inset:0}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;line-height:1}
.srow{align-items:center}
.cls-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:20px 4px 2px;color:var(--label);text-align:left}.cls-h .n{font-size:21px;font-weight:700}.cls-h .m{flex:1;font-size:14px;color:var(--label2)}.cls-h .chev{color:var(--label3);display:flex}.cls-h .chev svg{transition:transform .2s}.cls-h.open .chev svg{transform:rotate(90deg)}.sdue{flex:none;text-align:right;font-size:12px;color:var(--label2);line-height:1.25}.sdue b{color:var(--label);font-size:13px}
.bar{height:6px;background:var(--fill2);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.empty{background:var(--card);border-radius:12px;padding:28px 22px;text-align:center;color:var(--label2);font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--label);font-size:17px;margin-bottom:6px}

/* Feuilles (modales) */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);padding:6px 16px calc(28px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.open .sheet{transform:none}.open .sheet-backdrop{opacity:1}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 4px}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px;margin:0 -8px 6px}
.sheet-head h2{font-size:17px;font-weight:600;text-align:center}
.sheet-head .nav-btn:last-child{justify-self:end}
.action-sheet{background:transparent;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
.as-group{background:var(--elev);border-radius:14px;overflow:hidden;margin-bottom:8px}
.as-title{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep)}
.as-btn{display:block;width:100%;border:0;background:none;padding:17px;font-size:19px;color:var(--blue);text-align:center}
.as-btn+.as-btn{border-top:.5px solid var(--sep)}
.as-btn.red{color:var(--red)}.as-btn.bold{font-weight:600}
.alert-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.alert-wrap.open{opacity:1}
.alert{width:270px;background:var(--elev);border-radius:14px;text-align:center;overflow:hidden;transform:scale(1.1);transition:transform .2s}
.alert-wrap.open .alert{transform:none}
.alert .body{padding:20px 16px}
.alert h3{font-size:17px;font-weight:600;margin-bottom:4px}
.alert p{font-size:13px;line-height:1.4}
.alert .btns{display:flex;border-top:.5px solid var(--sep)}
.alert .btns button{flex:1;border:0;background:none;padding:12px;font-size:17px;color:var(--blue)}
.alert .btns button+button{border-left:.5px solid var(--sep);font-weight:600}
.alert .btns button.red{color:var(--red)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-80px);z-index:80;background:var(--elev);
  padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.15);transition:transform .35s cubic-bezier(.32,.72,0,1);display:flex;gap:8px;align-items:center;max-width:90vw}
.toast.show{transform:translate(-50%,0)}

/* Écrans centrés (élève) */
.screen{max-width:460px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
.screen.center{justify-content:center}
.hero{text-align:center;margin-bottom:28px}
.app-icon{width:76px;height:76px;border-radius:18px;background:linear-gradient(160deg,#3d9bff,#0062e0);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 10px 24px rgba(0,98,224,.3)}
.hero p{color:var(--label2);margin-top:4px}
.link-quiet{display:block;text-align:center;margin-top:28px;color:var(--label2);font-size:15px;text-decoration:none}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--label2);animation:spin .8s linear infinite;margin:80px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Exercice */
.quiz{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.quiz-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg)}
.quiz-top .bar{flex:1;margin:0;height:8px;border-radius:4px}
.quiz-top .bar i{background:var(--blue);border-radius:4px}
.counter{font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.quiz-body{padding:14px 18px 360px}
.qtype{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px}
.qprompt{font-size:23px;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin-bottom:22px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:14px;border:0;background:var(--card);margin-top:10px;font-size:17px;line-height:1.35;
  box-shadow:inset 0 0 0 1.5px var(--sep);transition:background .15s,box-shadow .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt.correct{background:color-mix(in srgb,var(--green) 15%,var(--card));box-shadow:inset 0 0 0 2px var(--green)}
.opt.wrong{background:color-mix(in srgb,var(--red) 12%,var(--card));box-shadow:inset 0 0 0 2px var(--red)}
.opt.dim{opacity:.5}
.opt.picked{box-shadow:inset 0 0 0 2px var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{text-align:center;font-weight:600;padding:26px 10px;font-size:19px;margin:0}
.trous-text{font-size:19px;line-height:2.2;background:var(--card);border-radius:16px;padding:16px 18px}
.blank{display:inline-block;border:0;border-bottom:2px solid var(--blue);background:var(--fill);border-radius:6px 6px 0 0;padding:1px 6px;font-size:18px;text-align:center;outline:none;max-width:100%;vertical-align:baseline}
.blank:focus{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.blank.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.blank.ko{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);text-decoration:line-through}
.check-wrap{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.check-wrap .btn{max-width:604px;margin:0 auto}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:20px 20px calc(18px + env(safe-area-inset-bottom));background:var(--elev);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.14);transform:translateY(110%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.feedback.show{transform:none}
.feedback>div{max-width:604px;margin:0 auto}
.feedback h3{display:flex;align-items:center;gap:8px;font-size:20px;margin-bottom:6px}
.feedback.ok h3{color:var(--green)}.feedback.ko h3{color:var(--red)}
.fb-ans{font-size:16px;margin-bottom:6px}
.fb-exp{font-size:15px;color:var(--label2);margin-bottom:4px;line-height:1.4}
.feedback .btn{margin-top:14px}
[hidden]{display:none!important}
.tour{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y}
.tour-top{display:flex;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top)) 12px 0;min-height:54px}
.tour-track{flex:1;display:flex;transition:transform .38s cubic-bezier(.32,.72,0,1)}
.tour-slide{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px;max-width:100%}
.tour-ic{width:96px;height:96px;border-radius:26px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:26px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.tour-ic svg{width:50px;height:50px}
.tour-slide h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:12px;max-width:420px}
.tour-slide p{font-size:18px;line-height:1.5;color:var(--label2);max-width:400px}
.tour-slide p b{color:var(--label)}
.tour-bot{padding:10px 24px calc(22px + env(safe-area-inset-bottom));max-width:480px;width:100%;margin:0 auto}
.tour-dots{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.tour-dots i{width:8px;height:8px;border-radius:4px;background:var(--fill2);transition:width .25s,background .25s}
.tour-dots i.on{width:22px;background:var(--blue)}
body.easy .tour-slide p{font-size:20px}
@media (prefers-reduced-motion:reduce){.tour-track{transition:none}}
@media (max-height:620px){.tour-ic{width:72px;height:72px;margin-bottom:16px}.tour-ic svg{width:38px;height:38px}.tour-slide h2{font-size:24px}.tour-slide p{font-size:16px}}
.progress-card.challenge{margin-top:10px;display:block}
.challenge .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hero{text-align:left;background:var(--card);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow);margin:4px 0 14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--hc,var(--blue))}
.hero-k{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--hc,var(--blue))}
.hero-t{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:6px 0 4px}
.hero-s{font-size:15px;color:var(--label2);line-height:1.4}
.hero .btn{margin-top:14px}
.todo-row .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.todo-row .ic svg{width:19px;height:19px}
.tools-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:22px 4px 6px;font:inherit;color:var(--label);cursor:pointer}
.tools-toggle b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tools-toggle span{color:var(--blue);font-size:15px}
.study-h .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.attn{margin-bottom:12px}
.group + .tiles{margin-top:12px}

function mdLite(t){
  const lines = String(t || '').split('\n'); let out = '', inList = false, para = [];
  const inline = x => nb(esc(x)).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const flush = () => { if (para.length){ out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  lines.forEach(l => {
    const m = l.trim();
    if (/^[-•]\s*/.test(m) && m.length > 1){ flush(); if (!inList){ out += '<ul>'; inList = true; } out += '<li>' + inline(m.replace(/^[-•]\s*/, '')) + '</li>'; return; }
    if (inList){ out += '</ul>'; inList = false; }
    if (/^#+\s+/.test(m)){ flush(); out += '<h3>' + inline(m.replace(/^#+\s+/, '')) + '</h3>'; return; }
    if (!m){ flush(); return; }
    para.push(m);
  });
  flush(); if (inList) out += '</ul>';
  return out;
}

function dataUrlToBlob(u){

  const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });

function parseImport(raw){
  raw = String(raw || '').trim().replace(/^```(json)?/i, '').replace(/```\s*$/, '').trim();
  const i = raw.search(/[\[{]/), j = Math.max(raw.lastIndexOf('}'), raw.lastIndexOf(']'));
  if (i < 0 || j < i) return null;
  let obj; try { obj = JSON.parse(raw.slice(i, j + 1)); } catch(e){ return null; }
  if (Array.isArray(obj)) obj = { questions: obj };
  const questions = normalizeQuestions(obj.questions);
  if (!questions.length) return null;
  return { _for: 'nouveau', title: String(obj.title || obj.titre || ''), subject: String(obj.subject || obj.cours || ''), description: String(obj.description || obj.consigne || ''),
    recap: String(obj.recap || obj.je_retiens || ''), course_id: null, pass_score: Math.min(100, Math.max(0, Number(obj.pass_score) || 70)), questions };
}
function genFromCourse(c){
  const raw = (c.blocks || []).filter(b => b.type === 'text').map(b => b.text || '').join('\n');
  const terms = [...new Set([...raw.matchAll(/\*\*(.+?)\*\*/g)].map(m => m[1].trim()).filter(Boolean))];
  if (!terms.length) return [];
  const sentences = [];
  raw.split('\n').forEach(line => {
    const l = line.replace(/^#+\s+/, '').replace(/^[-•]\s*/, '').trim(); if (!l) return;
    (l.match(/[^.!?]+[.!?]*/g) || []).forEach(x => { x = x.trim(); if (/\*\*.+?\*\*/.test(x) && x.replace(/\*\*/g, '').length >= 25) sentences.push(x); });
  });
  const out = []; let k = 0;
  sentences.forEach(x => {
    if (out.length >= 12) return;
    const m = x.match(/\*\*(.+?)\*\*/), term = m[1].trim(), clean = x.replace(/\*\*/g, '');
    const others = shuffle(terms.filter(t => norm(t) !== norm(term)));
    if (k % 2 === 1 && others.length >= 2){
      const opts = shuffle([term, others[0], others[1]]);
      out.push({ id: uid(), type: 'qcm', prompt: 'Quel mot complète la phrase ? « ' + x.replace(m[0], '……').replace(/\*\*/g, '') + ' »', options: opts, answer: opts.indexOf(term), explanation: clean, hint: '' });
    } else {
      out.push({ id: uid(), type: 'trous', prompt: 'Complète la phrase.', text: x.replace(m[0], '{' + term.replace(/[{}|]/g, '') + '}').replace(/\*\*/g, ''), explanation: '', hint: '' });
    }
    k++;
  });
  return out;
}

function loadImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1100 / Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function qLabel(q){

  if (q.type === 'etapes') return q.prompt || 'Analyse de document';
  if (q.type === 'trous') return String(q.text||'').replace(/\{([^}]*)\}/g, (m, a) => '[' + a.split('|')[0] + ']');
  if (q.type === 'chrono') return (q.prompt || 'Ligne du temps') + ' (' + (q.items || []).length + ' éléments)';
  return q.prompt || '';
}
function normalizeQuestions(arr){
  return (Array.isArray(arr) ? arr : []).map(q => {
    let t = String(q.type || '').toLowerCase().replace(/[^a-z]/g, '');
    if (['vf','vraifaux','vraioufaux','truefalse','tf'].includes(t)) t = 'vf';
    else if (['trous','texteatrous','texteatrou','cloze','fill','lacunes'].includes(t)) t = 'trous';
    else if (['chrono','chronologie','ordre','order','timeline','lignedutemps','classement'].includes(t)) t = 'chrono';
    else if (['image','carte','legende','map','hotspot','imagealegender'].includes(t)) t = 'image';
    else if (['assoc','associer','association','relier','match','matching','paires'].includes(t)) t = 'assoc';
    else if (['classer','tri','trier','categories','categoriser','sort'].includes(t)) t = 'classer';
    else if (['clic','cliquer','toucher','pointer','localiser'].includes(t)) t = 'clic';
    else if (['etapes','analyse','analysededocument','multi','etape'].includes(t)) t = 'etapes';
    else if (['nombre','valeur','numerique','number','lireunevaleur'].includes(t)) t = 'nombre';
    else if (['frise','placersurunefrise','placer'].includes(t)) t = 'frise';
    else if (['intrus','trouverlintrus','oddoneout'].includes(t)) t = 'intrus';
    else if (['vfc','vraifauxcorrige','vraioufauxacorriger','corriger'].includes(t)) t = 'vfc';
    else if (['lien','causeconsequence','causeouconsequence','cause'].includes(t)) t = 'lien';
    else t = 'qcm';
    const dd = q.doc ?? q.document;
    const base = { id: q.id ? String(q.id) : uid(), type: t, explanation: String(q.explanation ?? q.explication ?? ''), hint: String(q.hint ?? q.indice ?? '') };
    if (dd) base.doc = typeof dd === 'string' ? { text: dd, image: '', source: '' } : { text: String(dd.text ?? dd.texte ?? ''), image: String(dd.image ?? ''), source: String(dd.source ?? '') };
    if (t === 'chrono') return { ...base, top: q.top ? String(q.top) : undefined, bottom: q.bottom ? String(q.bottom) : undefined, prompt: String(q.prompt ?? q.question ?? 'Remets dans l\u2019ordre chronologique.'), items: (q.items || q.elements || []).map(x => typeof x === 'string' ? x : String(x.text ?? x.label ?? '')) };
    if (t === 'image') return { ...base, prompt: String(q.prompt ?? q.question ?? 'Légende l\u2019image.'), image: String(q.image ?? q.url ?? ''), points: (q.points || []).map(p => ({ x: Number(p.x) || 0, y: Number(p.y) || 0, label: String(p.label ?? p.legende ?? '') })) };
    if (t === 'etapes') return { ...base, prompt: String(q.prompt ?? ''), doc: base.doc || { text: '', image: '', source: '' }, steps: (q.steps || q.etapes || []).map(st => {
      const k = String(st.kind ?? st.type ?? 'qcm').toLowerCase();
      if (k === 'vf') return { kind: 'vf', prompt: String(st.prompt ?? ''), answer: typeof st.answer === 'string' ? /^(v|vrai|true)/i.test(st.answer) : !!st.answer };
      if (k === 'court' || k === 'trous' || k === 'texte') return { kind: 'court', prompt: String(st.prompt ?? ''), answers: Array.isArray(st.answers) ? st.answers.join('|') : String(st.answers ?? st.answer ?? '') };
      const o = (st.options || []).map(String); let a = st.answer; if (typeof a === 'string') a = Math.max(0, o.indexOf(a));
      return { kind: 'qcm', prompt: String(st.prompt ?? ''), options: o, answer: Number(a) || 0 };
    }) };
    if (t === 'nombre') return { ...base, prompt: String(q.prompt ?? q.question ?? ''), answer: Number(q.answer) || 0, tol: Number(q.tol ?? q.tolerance) || 0, unit: String(q.unit ?? q.unite ?? '') };
    if (t === 'frise') return { ...base, prompt: String(q.prompt ?? 'Place chaque événement sur la frise.'), start: Number(q.start) || 1900, end: Number(q.end) || 2025, tol: Number(q.tol ?? 2), events: (q.events || q.items || []).map(e => ({ label: String(e.label ?? e.text ?? ''), year: Number(e.year ?? e.annee) || 0 })) };
    if (t === 'intrus'){ const it = (q.items || q.options || []).map(String); let a = q.answer; if (typeof a === 'string') a = Math.max(0, it.indexOf(a)); return { ...base, prompt: String(q.prompt ?? 'Trouve l’intrus.'), items: it, answer: Number(a) || 0 }; }
    if (t === 'vfc') return { ...base, prompt: String(q.prompt ?? 'Vrai ou faux ? Si c’est faux, corrige.'), text: String(q.text ?? q.texte ?? '') };
    if (t === 'lien') return { ...base, prompt: String(q.prompt ?? 'Relie les deux faits par « donc » ou « parce que ».'), lines: (q.lines || q.items || []).map(l => ({ a: String(l.a ?? ''), b: String(l.b ?? ''), link: typeof l.link === 'string' ? Math.max(0, LIENS.indexOf(l.link)) : Number(l.link) || 0 })) };
    if (t === 'assoc') return { ...base, prompt: String(q.prompt ?? q.question ?? 'Associe chaque élément à sa paire.'), pairs: (q.pairs || q.paires || []).map(p => Array.isArray(p) ? { a: String(p[0] ?? ''), b: String(p[1] ?? '') } : { a: String(p.a ?? p.left ?? p.gauche ?? ''), b: String(p.b ?? p.right ?? p.droite ?? '') }) };
    if (t === 'classer'){
      const cats = (q.categories || q.categorie || []).map(String);
      return { ...base, prompt: String(q.prompt ?? q.question ?? 'Classe chaque élément dans la bonne catégorie.'), categories: cats, items: (q.items || q.elements || []).map(x => ({ text: String(x.text ?? x.label ?? x[0] ?? ''), cat: typeof (x.cat ?? x.categorie) === 'string' ? Math.max(0, cats.indexOf(x.cat ?? x.categorie)) : Number(x.cat ?? x.categorie ?? x[1]) || 0 })) };
    }
    if (t === 'clic') return { ...base, prompt: String(q.prompt ?? q.question ?? 'Touche le bon endroit sur la carte.'), image: String(q.image ?? q.url ?? ''), label: String(q.label ?? ''), target: q.target ? { x: Number(q.target.x) || 0, y: Number(q.target.y) || 0 } : null, r: Number(q.r) || 8 };
    if (t === 'qcm'){
      const opts = (q.options || q.choices || q.choix || []).map(String);
      let a = q.answer ?? q.reponse;
      if (typeof a === 'string'){ const k = opts.indexOf(a); a = k >= 0 ? k : (/^[A-Za-z]$/.test(a) ? a.toUpperCase().charCodeAt(0) - 65 : 0); }
      a = Number(a) || 0; if (a < 0 || a >= opts.length) a = 0;
      return { ...base, prompt: String(q.prompt ?? q.question ?? ''), options: opts, answer: a };
    }
    if (t === 'vf'){
      let a = q.answer ?? q.reponse; if (typeof a === 'string') a = /^(v|vrai|true|oui)/i.test(a.trim());
      return { ...base, prompt: String(q.prompt ?? q.question ?? ''), answer: !!a };
    }
    const text = q.text ?? q.texte ?? q.prompt ?? '';
    return { ...base, prompt: (q.text || q.texte) ? String(q.prompt || 'Complète le texte.') : 'Complète le texte.', text: String(text) };
  });
}
function cleanAndValidate(d){
  if (!String(d.title||'').trim()) return 'Donne un titre à la série.';
  if (!d.questions.length) return 'Ajoute au moins une question.';
  for (let i = 0; i < d.questions.length; i++){
    const q = d.questions[i], n = 'Question ' + (i + 1) + ' : ';
    if (q.doc){
      const dt = String(q.doc.text || '').trim(), ds = String(q.doc.source || '').trim();
      if (!dt && !q.doc.image || q.type === 'image' || q.type === 'clic') delete q.doc; else q.doc = { text: dt, image: q.doc.image || '', source: ds };
    }
    if (q.type === 'qcm'){
      if (!q.prompt.trim()) return n + 'écris la question.';
      const kept = []; let newAns = -1;
      q.options.forEach((o, k) => { if (String(o).trim()){ if (k === q.answer) newAns = kept.length; kept.push(String(o).trim()); } });
      if (kept.length < 2) return n + 'il faut au moins deux réponses.';
      if (newAns < 0) return n + 'coche la bonne réponse.';
      q.options = kept; q.answer = newAns;
    } else if (q.type === 'vf'){
      if (!q.prompt.trim()) return n + 'écris l\u2019affirmation.';
    } else if (q.type === 'trous'){
      if (!parseTrous(q.text).some(p => p.blank && p.answers.length)) return n + 'mets au moins un mot entre accolades { }.';
    } else if (q.type === 'chrono'){
      q.items = q.items.map(x => String(x).trim()).filter(Boolean);
      if (q.items.length < 3) return n + 'il faut au moins trois éléments à remettre dans l\u2019ordre.';
    } else if (q.type === 'image'){
      if (!q.image) return n + 'ajoute une image.';
      q.points = q.points.filter(p => String(p.label).trim()).map(p => ({ ...p, label: String(p.label).trim() }));
      if (q.points.length < 2) return n + 'place au moins deux repères avec leur légende.';
      if (new Set(q.points.map(p => norm(p.label))).size !== q.points.length) return n + 'deux repères ont la même légende.';
    } else if (q.type === 'assoc'){
      q.pairs = (q.pairs || []).map(p => ({ a: String(p.a || '').trim(), b: String(p.b || '').trim() })).filter(p => p.a || p.b);
      if (q.pairs.some(p => !p.a || !p.b)) return n + 'chaque paire doit avoir ses deux côtés.';
      if (q.pairs.length < 2) return n + 'il faut au moins deux paires.';
      if (new Set(q.pairs.map(p => norm(p.b))).size !== q.pairs.length) return n + 'deux paires ont la même réponse à droite.';
    } else if (q.type === 'classer'){
      const cats = (q.categories || []).map(c => String(c).trim());
      if (cats.length < 2 || cats.some(c => !c)) return n + 'donne un nom à chaque catégorie (au moins deux).';
      q.categories = cats;
      q.items = (q.items || []).map(x => ({ text: String(x.text || '').trim(), cat: Math.min(cats.length - 1, Math.max(0, +x.cat || 0)) })).filter(x => x.text);
      if (q.items.length < 3) return n + 'il faut au moins trois éléments à classer.';
    } else if (q.type === 'etapes'){
      if (!q.doc || !(q.doc.text || q.doc.image)) return n + 'ajoute le document (texte ou image) à analyser.';
      q.steps = (q.steps || []).filter(st => String(st.prompt || '').trim());
      if (q.steps.length < 2) return n + 'il faut au moins deux étapes avec leur question.';
      for (let k = 0; k < q.steps.length; k++){
        const st = q.steps[k]; st.prompt = String(st.prompt).trim();
        if (st.kind === 'qcm'){ const o = (st.options || []).map(x => String(x).trim()); const ans = o[st.answer]; st.options = o.filter(Boolean); st.answer = Math.max(0, st.options.indexOf(ans)); if (st.options.length < 2 || !ans) return n + 'étape ' + (k + 1) + ' : il faut au moins deux réponses et la bonne cochée.'; }
        if (st.kind === 'court' && !String(st.answers || '').split('|').some(x => x.trim())) return n + 'étape ' + (k + 1) + ' : écris la réponse attendue.';
      }
    } else if (q.type === 'nombre'){
      if (!String(q.prompt || '').trim()) return n + 'écris la question.';
      const a = parseNumFR(q.answer), t = parseNumFR(q.tol);
      if (a === null) return n + 'écris la valeur attendue (un nombre).';
      q.answer = a; q.tol = Math.abs(t || 0); q.unit = String(q.unit || '').trim();
    } else if (q.type === 'frise'){
      q.start = parseNumFR(q.start); q.end = parseNumFR(q.end);
      if (q.start === null || q.end === null || q.end <= q.start) return n + 'indique une année de début et une année de fin.';
      q.events = (q.events || []).map(e => ({ label: String(e.label || '').trim(), year: parseNumFR(e.year) })).filter(e => e.label);
      if (q.events.length < 1) return n + 'ajoute au moins un événement.';
      if (q.events.some(e => e.year === null || e.year < q.start || e.year > q.end)) return n + 'chaque événement doit avoir une année entre ' + q.start + ' et ' + q.end + '.';
      q.tol = Math.abs(+q.tol || 0);
    } else if (q.type === 'intrus'){
      const ans = String((q.items || [])[q.answer] || '').trim();
      q.items = (q.items || []).map(x => String(x).trim()).filter(Boolean);
      if (q.items.length < 3) return n + 'il faut au moins trois éléments.';
      if (!ans) return n + 'coche l’intrus.';
      q.answer = q.items.indexOf(ans);
    } else if (q.type === 'vfc'){
      const t = vfcParse(q.text);
      if (!t.length) return n + 'écris la phrase.';
      const errs = t.filter(x => x.err);
      if (errs.length > 1) return n + 'une seule erreur par phrase, entre crochets.';
      if (errs.length && !errs[0].fix.length) return n + 'donne la correction : [mot faux|mot juste].';
    } else if (q.type === 'lien'){
      q.lines = (q.lines || []).map(l => ({ a: String(l.a || '').trim(), b: String(l.b || '').trim(), link: +l.link ? 1 : 0 })).filter(l => l.a || l.b);
      if (q.lines.some(l => !l.a || !l.b)) return n + 'chaque ligne doit avoir ses deux faits.';
      if (q.lines.length < 2) return n + 'il faut au moins deux lignes.';
    } else if (q.type === 'clic'){
      if (!q.image) return n + 'ajoute une image.';
      if (!q.target) return n + 'touche l\u2019image pour placer le bon endroit.';
      q.label = String(q.label || '').trim(); q.r = +q.r || 8;
      if (!String(q.prompt || '').trim()) q.prompt = 'Touche ' + (q.label || 'le bon endroit') + ' sur la carte.';
    }
  }
  return null;
}

const Student = {
  code: null, me: null, list: [], set: null, sess: null, preview: false,

  async start(){
    this.preview = false; this.practice = false;
    const code = store.get('exos_code');
    if (!code) return this.renderLogin();
    this.code = code;
    await this.loadList();
  },

  renderLogin(err){
    $app.innerHTML = '<div class="screen center">' +
      '<div class="hero"><div class="app-icon">' + I.pencil + '</div><h1 class="large">Mes exercices</h1>' +
      '<p>Entre le code personnel donné par ton professeur.</p></div>' +
      '<form id="f" class="stack"><input id="code" class="field code-field" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="••••••" aria-label="Code personnel">' +
      (err ? '<p class="err">' + esc(err) + '</p>' : '') +
      (window.__DEMO__ ? '<p class="foot" style="text-align:center;margin:2px 0 0">Démo : essaie le code <span class="code">DEMO01</span></p>' : '') +
      '<button class="btn" id="go" type="submit" disabled>Continuer</button></form>' +
      '<a class="link-quiet" href="#/prof">Espace enseignant</a></div>';
    const inp = document.getElementById('code'), btn = document.getElementById('go');
    inp.oninput = () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); btn.disabled = inp.value.length !== 6; };
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault(); btn.disabled = true; btn.textContent = 'Vérification…';
      const c = inp.value;
      const { data, error } = await sb.rpc('student_login', { p_code: c });
      if (error) return this.renderLogin('Connexion impossible. Vérifie ta connexion internet.');
      if (!data) return this.renderLogin('Code inconnu. Vérifie-le avec ton professeur.');
      store.set('exos_code', c); this.code = c; this.me = data; this.loadList();
    };
    setTimeout(() => inp.focus(), 50);
  },

  async loadList(silent){
    if (!silent) loading();
    if (!this.me){
      const { data, error } = await sb.rpc('student_login', { p_code: this.code });
      if (error) return this.offline();
      if (!data){ store.del('exos_code'); return this.renderLogin('Ce code n\u2019est plus valide.'); }
      this.me = data;
    }
    const [{ data, error }, cp] = await Promise.all([sb.rpc('student_home', { p_code: this.code }), sb.rpc('student_copies', { p_code: this.code })]);
    if (error || !data) return this.offline();
    this.copies = cp.error ? (this.copies || []) : (cp.data || []);
    this.home = data; this.list = data.assignments || []; this.practice = false;
    this.list.forEach(a => { if (a.control_open && !anchorInfo(a.passes, a.anchor).anchored) a.control_open = false; });
    this.renderList();
    if (!silent && !store.get('exos_tour_' + this.code)) setTimeout(() => this.showTour(), 350);
  },
  showTour(){
    if (document.querySelector('.tour')) return;
    const name = this.me ? this.me.first_name : '';
    const S = [
      ['blue', I.hi, 'Bienvenue' + (name ? ', ' + esc(name) : '') + ' !', 'Ici, tu retrouves les exercices que ton professeur te donne. <b>Quelques minutes par jour</b> suffisent pour progresser.'],
      ['green', I.tabDoc, 'Tes exercices', 'La carte <b>« À faire maintenant »</b> te montre par quoi commencer. Pour valider une série, il faut atteindre le score demandé. Tu peux recommencer autant que tu veux.'],
      ['orange', I.tabStudy, 'J\u2019étudie', 'Des outils pour réviser : cartes mémoire, quiz de la semaine, lire les consignes… Commence par ce que l\u2019appli te propose <b>aujourd\u2019hui</b>.'],
      ['purple', I.eye, 'Ton professeur voit ton travail', 'Il voit les séries faites et tes scores. Quand tu bloques, touche <b>« Je n\u2019ai pas compris »</b> : il le saura. En évaluation, <b>ne quitte pas l\u2019appli</b>, sinon ta copie se bloque.'],
      ['teal', I.phone, 'Garde l\u2019appli à portée de main', 'Ajoute-la sur <b>l\u2019écran d\u2019accueil</b> de ton téléphone pour l\u2019ouvrir comme une vraie appli. Ton code reste enregistré.']
    ];
    const el = document.createElement('div'); el.className = 'tour'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Visite guidée');
    el.innerHTML = '<div class="tour-top"><button class="nav-btn" id="tskip">Passer</button></div><div class="tour-track">' +
      S.map(x => '<div class="tour-slide"><div class="tour-ic" style="background:var(--' + x[0] + ')">' + x[1] + '</div><h2>' + x[2] + '</h2><p>' + x[3] + '</p></div>').join('') + '</div>' +
      '<div class="tour-bot"><div class="tour-dots">' + S.map((x, k) => '<i data-d="' + k + '"></i>').join('') + '</div><button class="btn" id="tnext">Suivant</button><button class="btn plain" id="tinst" hidden>Ajouter à l\u2019écran d\u2019accueil</button></div>';
    document.body.appendChild(el);
    let i = 0;
    const done = () => { store.set('exos_tour_' + this.code, '1'); el.remove(); };
    const go = k => {
      i = Math.max(0, Math.min(S.length - 1, k));
      el.querySelector('.tour-track').style.transform = 'translateX(' + (-100 * i) + '%)';
      el.querySelectorAll('[data-d]').forEach((d, j) => d.classList.toggle('on', j === i));
      const last = i === S.length - 1;
      el.querySelector('#tnext').textContent = last ? 'C\u2019est parti !' : 'Suivant';
      el.querySelector('#tinst').hidden = !last;
      el.querySelector('#tskip').style.visibility = last ? 'hidden' : '';
    };
    el.querySelector('#tnext').onclick = () => i < S.length - 1 ? go(i + 1) : done();
    el.querySelector('#tskip').onclick = done;
    el.querySelector('#tinst').onclick = () => { done(); setTimeout(() => this.installSheet(), 200); };
    let x0 = null;
    el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(i + (dx < 0 ? 1 : -1)); x0 = null; });
    go(0);
    setTimeout(() => el.querySelector('#tnext').focus({ preventScroll: true }), 100);
  },

  offline(){
    $app.innerHTML = '<div class="screen center"><div class="empty"><b>Pas de connexion</b>Vérifie que ton téléphone est connecté à internet.</div><button class="btn mt" id="r">Réessayer</button></div>';
    document.getElementById('r').onclick = () => this.loadList();
  },

  anc(a){ if (!a._anc) a._anc = anchorInfo(a.passes, a.anchor); return a._anc; },

      const done = this.list.filter(a => a.done && !a.control_open && A(a).anchored && !A(a).archived);

        const nMap = (this.study.sets || []).reduce((t, x) => t + (x.questions || []).filter(q => q.type === 'image').reduce((u, q) => u + (q.points || []).length, 0), 0);
        const day = Math.floor(Date.now() / 864e5), w = this.weekState(), wDone = w.weeks[this.weekKey()], nd = this.docList().length;

          ['recall', 'test', I.write, 'Vide ta tête', 'Écris tout ce que tu sais'],

        ].filter(t => !hidden.has(t[0]));

        const COL = { week: 'red', cards: 'blue', recall: 'pink', conf: 'indigo', maps: 'teal', pre: 'purple', err: 'red', cons: 'orange', free: 'green', mist: 'orange', scale: 'indigo', clim: 'blue', doc: 'pink', recaps: 'purple', timer: 'teal' };

        const ico = k => (TOOLS.find(t => t[0] === k) || [])[2] || '';
        let open = TOOLS.length <= 6; try { if (!open) open = store.get('exos_tools_open') === '1'; } catch(e){}
        this._toolsOpen = open;

            '<p class="foot" style="margin:0 0 6px">' + (sc === 'act' ? 'Les outils utilisent tes séries en cours.' : sc === 'arch' ? 'Les outils utilisent tes séries archivées : idéal pour ne pas oublier.' : 'Les outils utilisent toutes tes séries.') + '</p>' : '') +
          (sugg.length ? '<div class="section-h">Pour toi aujourd’hui</div><div class="group">' + sugg.slice(0, 3).map(x => '<button class="row todo-row" data-study="' + x[0] + '"><span class="ic" style="background:var(--' + COL[x[0]] + ')">' + ico(x[0]) + '</span><div class="main"><div class="t">' + x[1] + '</div><div class="s">' + x[2] + '</div></div><span class="chev">' + I.chevR + '</span></button>').join('') + '</div>' : '') +
          (TOOLS.length > 6 ? '<button class="tools-toggle" id="ttog"><b>Tous les outils</b><span>' + (open ? 'Masquer' : 'Afficher (' + TOOLS.length + ')') + '</span></button>' : '<div class="section-h">Mes outils</div>') +
          '<div id="tools"' + (open ? '' : ' hidden') + '>' + ['test', 'train', 'review'].map(f => { const L = TOOLS.filter(t => t[1] === f); return L.length ? '<div class="study-h">' + FAM[f][0] + '</div><div class="study-grid">' + L.map(tile).join('') + '</div>' : ''; }).join('') + '</div>' +
          '<div class="tip"><b>Le conseil du jour</b>' + nb(esc(STUDY_TIPS[day % STUDY_TIPS.length])) + '</div>' +
          '<button class="why-link" data-study="why">' + I.info + ' Pourquoi ces méthodes marchent</button>';
      }
    } else if (tab === 'cours'){
      const courses = h.courses || [];
      body = '<h1 class="large">Mes cours</h1>' +
        (courses.length ? '<div class="group mt">' + courses.map(c => '<button class="row" data-course="' + c.id + '"><span style="color:var(--blue);display:flex">' + I.book + '</span><div class="main"><div class="t">' + esc(c.title) + '</div>' + (c.subject ? '<div class="s">' + esc(c.subject) + '</div>' : '') + '</div><span class="chev">' + I.chevR + '</span></button>').join('') + '</div>'
          : '<div class="empty mt"><b>Aucun cours pour l’instant</b>Ton professeur peut mettre ses cours à ta disposition ici.</div>');
    } else {
      body = this.evalBody(evals, evOpen);
    }

    $app.innerHTML = nav('<button class="nav-btn" id="opts">Réglages</button>', '<button class="nav-btn" id="refresh">Actualiser</button>') +
      '<div class="wrap' + (tab === 'ex' && wideScreen() ? ' wide' : '') + '">' + body + '</div>' +
      '<nav class="tabbar">' + tb('ex', 'Exercices', I.tabDoc) + tb('cours', 'Cours', I.tabBook) + tb('study', 'J\u2019étudie', I.tabStudy) + tb('eval', 'Évaluation', I.tabEval, evOpen.length || (this.copies || []).some(c => !c.seen_at)) + '</nav>';

  /* ---------- Copies corrigées (élève) ---------- */

  async openCopy(id){
    loading();

    const c = (this.copies || []).find(x => x.id === id); if (c && !c.seen_at) c.seen_at = new Date().toISOString();
    this.showCopy(data, () => { this.renderList(); window.scrollTo(0, 0); }, 'Évaluation', false);
  },
  showCopy(c, onBack, backLabel, previewTag){

    const hasAi = all.some(x => x.ai);
    const box = list => '<div class="group">' + list.map(x => '<div class="ccom">' + (x.label ? '<div class="lab">' + esc(x.label) + '</div>' : '') + '<div class="txt">' + nb(esc(x.text)).replace(/\n/g, '<br>') + '</div></div>').join('') + '</div>';
    $app.innerHTML = nav('<button class="nav-btn" id="back">' + I.chevL + '<span>' + esc(backLabel) + '</span></button>') +
      '<div class="wrap notab">' + (previewTag ? '<span class="pill blue">Aperçu élève</span>' : '') +
      '<h1 class="large"' + (previewTag ? ' style="margin-top:8px"' : '') + '>' + esc(c.title || 'Copie corrigée') + '</h1>' + (c.copy_date ? '<p class="subtitle">' + esc(fmtDate(c.copy_date)) + '</p>' : '') +
      (c.score != null && c.total ? '<div class="copy-score"><span class="n">' + fmtNum(c.score) + '</span><span class="t">/ ' + fmtNum(c.total) + '</span></div>' : '') +
      (c.general ? '<div class="msg-card" style="background:color-mix(in srgb,var(--blue) 11%,var(--card))"><div class="from">Le mot de ton professeur</div>' + nb(esc(c.general)).replace(/\n/g, '<br>') + '</div>' : '') +
      (coms.length ? '<div class="section-h">Pour comprendre tes erreurs</div>' + box(coms) : '') +

  /* ---------- J'étudie ---------- */
  async loadStudy(){
    const { data, error } = await sb.rpc('student_study', { p_code: this.code });

  },
  scope(){ const v = store.get('exos_scope'); return ['act', 'arch', 'all'].includes(v) ? v : 'act'; },
  archivedIds(){ return new Set((this.list || []).filter(a => a.done && !a.control_open && this.anc(a).archived).map(a => a.id)); },
  applyScope(){
    if (!this.studyAll) return;
    const arch = this.archivedIds(), sc = this.scope();
    const sets = (this.studyAll.sets || []).filter(x => sc === 'all' || (sc === 'arch') === arch.has(x.assignment_id));
    this.study = { ...this.studyAll, sets };
  },
  buildCards(){
    const st = this.study || { sets: [], courses: [] }, cards = [], seen = new Set();
    const add = c => { const k = norm(c.front); if (!c.front || !c.back || seen.has(k)) return; seen.add(k); cards.push(c); };
    (st.sets || []).forEach(x => (x.questions || []).forEach(q => {
      if (!['qcm', 'vf', 'trous'].includes(q.type)) return;
      const front = q.type === 'trous' ? String(q.text || '').replace(/\{[^}]*\}/g, '……') : q.prompt;
      add({ id: 'q:' + x.assignment_id + ':' + q.id, front, back: answerText(q), extra: q.explanation || '', from: x.set_title });
    }));
    (st.courses || []).forEach(c => (c.blocks || []).filter(b => b.type === 'text').forEach(b => {
      String(b.text || '').split('\n').forEach(line => {
        const l = line.replace(/^#+\s+/, '').replace(/^[-•]\s*/, '').trim();
        (l.match(/[^.!?]+[.!?]*/g) || []).forEach(sx => {
          sx = sx.trim(); if (sx.replace(/\*\*/g, '').length < 25) return;
          (sx.match(/\*\*(.+?)\*\*/g) || []).forEach(m => {
            const term = m.slice(2, -2).trim();
            add({ id: 'c:' + c.id + ':' + norm(term), front: sx.replace(m, '……').replace(/\*\*/g, ''), back: term, extra: sx.replace(/\*\*/g, ''), from: c.title });
          });
        });
      });
    }));
    return cards;
  },
  cardState(){ try { return JSON.parse(store.get('exos_cards_' + this.code) || '{}'); } catch(e){ return {}; } },
  cardStats(){
    const st = this.cardState(), today = isoDate(new Date()), all = this.buildCards();
    const due = all.filter(c => st[c.id] && st[c.id].due <= today), fresh = all.filter(c => !st[c.id]);
    return { all, due, fresh, today: due.length + Math.min(fresh.length, 10), mastered: all.filter(c => st[c.id] && st[c.id].box >= 4).length };
  },
  startCards(){
    const c = this.cardStats();
    if (!c.all.length) return toast('Pas encore de cartes : elles apparaîtront avec tes cours et tes exercices');
    let queue = shuffle(c.due).concat(shuffle(c.fresh).slice(0, 10)).slice(0, 20);
    if (!queue.length) queue = shuffle(c.all).slice(0, 10);

  rateCard(known){
    const s = this.cardSess, it = s.queue[s.idx], st = this.cardState(), cur = st[it.c.id] || { box: 0 };
    if (!it.again && known) s.known++;

    st[it.c.id] = { box, due: isoDate(d) };
    store.set('exos_cards_' + this.code, JSON.stringify(st));

  weekKey(d){ const t = d ? new Date(d) : new Date(), m = new Date(t); m.setHours(12, 0, 0, 0); m.setDate(m.getDate() - (m.getDay() + 6) % 7); return isoDate(m); },

  recallSections(){

    const tick = () => { if (!document.getElementById('rtime')){ clearInterval(this._rInt); return; } tm.textContent = left > 0 ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Temps écoulé'; if (left > 0) left--; };
    tick(); this._rInt = setInterval(tick, 1000);
    ta.oninput = () => { done.disabled = ta.value.trim().length < 3; };
    setTimeout(() => ta.focus(), 200);
    const mic = document.getElementById('rmic');
    if (mic){
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null, on = false, base = '';
      const stop = () => { on = false; if (rec) try { rec.stop(); } catch(e){} mic.classList.remove('rec-on'); mic.querySelector('span').textContent = 'Parler au lieu d\u2019écrire'; };
      this._micStop = stop;
      mic.onclick = () => {
        if (on) return stop();
        rec = new SR(); rec.lang = 'fr-BE'; rec.continuous = true; rec.interimResults = true;
        base = ta.value.trim() ? ta.value.trim() + ' ' : '';
        rec.onresult = e => { let fin = '', tmp = ''; for (let k = 0; k < e.results.length; k++){ const r = e.results[k]; if (r.isFinal) fin += r[0].transcript + ' '; else tmp += r[0].transcript; } ta.value = base + fin + tmp; done.disabled = ta.value.trim().length < 3; };
        rec.onerror = e => { stop(); if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Autorise le micro dans les réglages du navigateur'); else if (e.error !== 'aborted' && e.error !== 'no-speech') toast('La dictée ne fonctionne pas ici : écris plutôt.'); };
        rec.onend = () => { if (on){ base = ta.value.trim() ? ta.value.trim() + ' ' : ''; try { rec.start(); } catch(e){ stop(); } } };
        try { rec.start(); on = true; mic.classList.add('rec-on'); mic.querySelector('span').textContent = 'J\u2019ai fini de parler'; } catch(e){ toast('La dictée ne fonctionne pas ici : écris plutôt.'); }
      };
    }
    document.getElementById('back').onclick = () => { clearInterval(this._rInt); if (this._micStop) this._micStop(); this.stab = 'study'; this.renderList(); };
    done.onclick = () => { clearInterval(this._rInt); if (this._micStop) this._micStop(); this.recallResult(sec, ta.value); };
  },
  recallResult(sec, text){
    const t = norm(text);
    const has = term => { const n = norm(term); if (t.includes(n)) return true; const words = n.split(' ').filter(w => w.length > 3); return words.length > 1 && words.every(w => t.includes(w.slice(0, Math.max(4, w.length - 1)))); };
    const found = sec.terms.filter(has), missing = sec.terms.filter(x => !found.includes(x));
    $app.innerHTML = nav('<button class="nav-btn" id="back">' + I.chevL + '<span>J’étudie</span></button>') +
      '<div class="wrap notab"><h1 class="large">' + esc(sec.title) + '</h1>' +
      '<div class="big-score" style="text-align:left;font-size:38px">' + found.length + ' / ' + sec.terms.length + '</div><p class="subtitle">mots-clés retrouvés</p>' +
      '<div>' + found.map(k => '<span class="kw ok">' + I.check + ' ' + esc(k) + '</span>').join('') + missing.map(k => '<span class="kw ko">' + esc(k) + '</span>').join('') + '</div>' +
      (missing.length ? '<button class="btn tinted mt" id="tocards">Revoir les ' + missing.length + ' mots oubliés dans mes cartes mémoire</button>' : '<p class="foot" style="margin-top:12px">Bravo, tu as tout retrouvé !</p>') +
      '<div class="section-h">Compare avec ton cours</div><div class="recap"><div class="course-text">' + mdLite(sec.lines.join('\n')) + '</div></div>' +
      '<div class="section-h">Ce que tu as écrit</div><div class="group inner-pad" style="padding:14px 16px;line-height:1.5;white-space:pre-wrap">' + esc(text) + '</div>' +
      '<div class="stack mt2"><button class="btn" id="again">Recommencer ce thème</button><button class="btn plain" id="b1">Retour à J’étudie</button></div></div>';
    window.scrollTo(0, 0);
    const tc = document.getElementById('tocards');
    if (tc) tc.onclick = () => {
      const st = this.cardState(), today = isoDate(new Date());
      missing.forEach(k => { st['c:' + sec.course.id + ':' + norm(k)] = { box: 1, due: today }; });
      store.set('exos_cards_' + this.code, JSON.stringify(st));
      tc.disabled = true; tc.textContent = 'Ajoutés à tes cartes mémoire du jour';
    };
    document.getElementById('again').onclick = () => this.renderRecall(sec);
    document.getElementById('back').onclick = document.getElementById('b1').onclick = () => { this.stab = 'study'; this.renderList(); };
  },

  scaleLab(){
    this.sl = { plan: ['ex', 'f1', 'f2', 'solo', 'solo', 'solo'], i: 0, ok: 0, done: 0 };
    this.renderScale();
  },
  newScale(){
    const scales = [10000, 15000, 20000, 25000, 50000, 100000, 200000, 250000, 500000, 1000000];
    const sc = scales[Math.floor(Math.random() * scales.length)];
    const d = Math.random() < .5 ? Math.floor(Math.random() * 15) + 2 : Math.round((Math.random() * 14 + 1.5) * 10) / 10;
    const cm = Math.round(d * sc); return { sc, d, cm, km: cm / 100000 };
  },
  renderScale(){
    const L = this.sl, kind = L.plan[L.i];
    if (!kind) return this.scaleDone();
    const pb = L.pb = this.newScale();
    const close = (x, y) => x != null && Math.abs(x - y) <= Math.max(0.001, Math.abs(y) * 0.005);
    const stepHtml = (n, txt, calc, done) => '<div class="step"><span class="n' + (done ? ' done' : '') + '">' + (done ? I.check : n) + '</span><div class="b">' + txt + (calc ? '<div class="calc">' + calc + '</div>' : '') + '</div></div>';
    const s1 = 'Je multiplie la distance sur la carte par le nombre de l’échelle.', s2 = 'Je convertis en km : 1 km = 100 000 cm, donc je divise par 100 000.';
    const c1 = fmtN(pb.d) + ' × ' + fmtN(pb.sc) + ' = ' + fmtN(pb.cm) + ' cm', c2 = fmtN(pb.cm) + ' ÷ 100 000 = ' + fmtN(pb.km) + ' km';
    const titles = { ex: 'Exemple résolu', f1: 'À toi : la dernière étape', f2: 'À toi : les deux étapes', solo: 'À toi tout seul' };
    let body;
    if (kind === 'ex') body = '<div class="steps">' + stepHtml(1, s1, c1, true) + stepHtml(2, s2, c2, true) + '</div><p class="mt" style="font-size:18px">Réponse : <b>' + fmtN(pb.km) + ' km</b></p><button class="btn mt2" id="go">J’ai compris, à moi !</button>';
    else if (kind === 'f1') body = '<div class="steps">' + stepHtml(1, s1, c1, true) + stepHtml(2, s2 + '<div class="num-in"><input id="a2" inputmode="decimal" autocomplete="off" aria-label="Distance en km"><span>km</span></div>') + '</div><button class="btn mt2" id="chk">Vérifier</button>';
    else if (kind === 'f2') body = '<div class="steps">' + stepHtml(1, s1 + '<div class="num-in"><input id="a1" inputmode="decimal" autocomplete="off" aria-label="Distance en cm"><span>cm</span></div>') + stepHtml(2, s2 + '<div class="num-in"><input id="a2" inputmode="decimal" autocomplete="off" aria-label="Distance en km"><span>km</span></div>') + '</div><button class="btn mt2" id="chk">Vérifier</button>';
    else body = '<div class="num-in"><input id="a2" inputmode="decimal" autocomplete="off" aria-label="Distance réelle en km" placeholder="Distance réelle"><span>km</span></div><button class="btn plain mt" id="hint">' + I.bulb + ' Voir les étapes</button><div id="hintx" hidden><div class="steps mt">' + stepHtml(1, s1) + stepHtml(2, s2) + '</div></div><button class="btn mt" id="chk">Vérifier</button>';
    $app.innerHTML = '<div class="quiz"><div class="quiz-top"><button class="icon-btn mute" id="quit" aria-label="Arrêter">' + I.x + '</button><div class="bar"><i style="width:' + (L.i / L.plan.length * 100) + '%"></i></div><span class="counter">' + (L.i + 1) + '/' + L.plan.length + '</span></div>' +
      '<div class="quiz-body" style="padding-bottom:60px"><div class="qtype">Échelles · ' + titles[kind] + '</div>' +
      '<div class="problem">Sur une carte au <b>1/' + fmtN(pb.sc) + '</b>, deux villes sont à <b>' + fmtN(pb.d) + ' cm</b>. Quelle est la distance réelle en km ?</div>' + body + '<div id="sfb"></div></div></div>';
    window.scrollTo(0, 0);
    document.getElementById('quit').onclick = () => { this.stab = 'study'; this.renderList(); };
    const go = document.getElementById('go'); if (go) go.onclick = () => { L.i++; this.renderScale(); };
    const hb = document.getElementById('hint'); if (hb) hb.onclick = () => { hb.remove(); document.getElementById('hintx').hidden = false; };
    const chk = document.getElementById('chk');
    if (chk){
      const ins = [...$app.querySelectorAll('.num-in input')]; setTimeout(() => ins[0].focus(), 150);
      ins.forEach((inp, k) => inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); if (ins[k + 1]) ins[k + 1].focus(); else chk.click(); } });
      chk.onclick = () => {
        const a1 = document.getElementById('a1'), a2 = document.getElementById('a2');
        if (ins.some(x => parseN(x.value) == null)) return toast('Écris un nombre dans chaque case');
        const ok1 = !a1 || close(parseN(a1.value), pb.cm), ok2 = close(parseN(a2.value), pb.km), ok = ok1 && ok2;
        if (a1) a1.classList.add(ok1 ? 'ok' : 'ko'); a2.classList.add(ok2 ? 'ok' : 'ko');
        ins.forEach(x => x.readOnly = true);
        L.done++; if (ok) L.ok++;
        chk.outerHTML = '';
        const hx = document.getElementById('hintx'); if (hx) hx.hidden = true;
        document.getElementById('sfb').innerHTML = '<div class="' + (ok ? 'msg-card' : 'hint-box') + '" style="margin-top:16px">' + (ok ? '<b>Bravo, c’est juste !</b>' : '<b>Pas tout à fait.</b> Voici la correction :') +
          '<div class="calc" style="margin-top:6px;font-variant-numeric:tabular-nums">1. ' + c1 + '<br>2. ' + c2 + '</div></div><button class="btn mt" id="nx">Continuer</button>';
        document.getElementById('nx').onclick = () => { L.i++; this.renderScale(); };
      };
    }
  },
  scaleDone(){
    const L = this.sl;
    $app.innerHTML = '<div class="screen center result"><div class="app-icon" style="background:linear-gradient(160deg,#7d7bff,#4846d6);box-shadow:none">' + I.steps + '</div>' +
      '<h1>Échelles terminées</h1><div class="big-score">' + L.ok + ' / ' + L.done + '</div><p>calculs réussis</p>' +
      '<p>' + (L.ok === L.done ? 'Parfait : tu sais calculer une distance réelle.' : 'Recommence avec d’autres nombres : l’exemple résolu est toujours là pour t’aider.') + '</p>' +
      '<div class="stack mt2"><button class="btn" id="again">Recommencer avec d’autres nombres</button><button class="btn plain" id="b1">Retour à J’étudie</button></div></div>';
    document.getElementById('again').onclick = () => this.scaleLab();
    document.getElementById('b1').onclick = () => { this.stab = 'study'; this.renderList(); };
  },

  /* ---------- Lire les consignes ---------- */
  consLab(){
    const order = shuffle(CONSIGNES.map((x, i) => i)).slice(0, 6);
    this.co = { list: order, i: 0, ok: 0, done: 0, perfect: 0 };
    this.renderCons();
  },
  verbsSheet(){
    openSheet('<div class="grabber"></div><div class="sheet-head"><span></span><h2>Les verbes des consignes</h2><button class="nav-btn bold" data-close>OK</button></div>' +
      '<div class="group">' + CONS_VERBS.map(v => '<div class="row"><div class="main"><div class="t">' + v[0] + '</div><div class="s" style="color:var(--label)">' + nb(esc(v[1])) + '</div></div></div>').join('') + '</div>' +
      '<p class="foot">Avant de répondre : je souligne le verbe, je repère ce qu’on me demande en plus, puis je relis ma réponse avec la consigne.</p>');
  },
  renderCons(){
    const L = this.co;
    if (L.i >= L.list.length) return this.labDone(I.consigne, 'linear-gradient(160deg,#ffb340,#ff8a00)', 'Atelier terminé', L.ok, L.done, 'étapes réussies',
      L.ok === L.done ? 'Parfait : tu lis les consignes comme un pro.' : 'Garde le réflexe : 1. le verbe, 2. ce qu’on demande en plus, 3. je relis ma réponse avec la consigne.', () => this.consLab());
    const x = CONSIGNES[L.list[L.i]], ex = L.i === 0;
    const norm = t => String(t).toLowerCase().replace(/[.,;:!?«»()]/g, '').replace(/^.*[’']/, '');
    const words = x.c.split(' '), isV = w => x.v.includes(norm(w));
    const right = x.a[0][0], answers = ex ? x.a.slice() : shuffle(x.a.slice());
    const others = shuffle(Object.keys(CONS_CONDS).filter(k => !x.k.includes(k) && k !== 'none')).slice(0, x.k.includes('none') ? 3 : Math.max(1, 3 - x.k.length));
    const chips = shuffle(x.k.concat(others).concat(x.k.includes('none') ? [] : ['none']));
    const step = (n, title, inner, done) => '<div class="step"><span class="n' + (done ? ' done' : '') + '">' + (done ? I.check : n) + '</span><div class="b"><b>' + title + '</b>' + inner + '</div></div>';
    const ctext = '<div class="ctext">' + words.map((w, i) => ex ? (isV(w) ? '<span class="wtok ok">' + esc(w) + '</span>' : esc(w)) : '<button class="wtok" data-w="' + i + '">' + esc(w) + '</button>').join(' ') + '</div>';
    let body;
    if (ex){
      body = '<div class="steps">' +
        step(1, 'Je repère le verbe d’action', '<div class="res" style="color:var(--label2)">C’est le mot qui dit ce que je dois faire. ' + nb(esc(x.m)) + '</div>', true) +
        step(2, 'Je repère ce qu’on demande en plus', '<div class="ans">' + x.k.map(k => CONS_CONDS[k]).join(' · ') + '</div>', true) +
        step(3, 'Je vérifie que ma réponse respecte tout', x.a.map((a, j) => '<div class="why-opt ' + (j === 0 ? 'correct' : 'wrong') + '" style="cursor:default">' + nb(esc(a[0])) + (a[1] ? '<span class="note">' + nb(esc(a[1])) + '</span>' : '<span class="note">Elle respecte la consigne.</span>') + '</div>').join(''), true) +
        '</div><button class="btn mt2" id="go">J’ai compris, à moi !</button>';
    } else {
      body = '<div class="steps">' +
        step(1, 'Touche le ou les verbes d’action', '<div class="res" id="r1" style="color:var(--label2)">Touche les mots dans la consigne, en haut.</div>') +
        step(2, 'Qu’est-ce que la consigne demande en plus ?', '<div class="chips multi" style="padding:8px 0 0">' + chips.map(k => '<button class="chip" data-k="' + k + '">' + CONS_CONDS[k] + '</button>').join('') + '</div><div class="res" id="r2"></div>') +
        step(3, 'Quelle réponse respecte la consigne ?', answers.map((a, j) => '<button class="why-opt" data-a="' + j + '">' + nb(esc(a[0])) + '<span class="note" hidden></span></button>').join('') + '<div class="res" id="r3"></div>') +
        '</div><button class="btn plain mt" id="lex">' + I.book + ' Les verbes des consignes</button><button class="btn mt" id="chk">Vérifier</button>';
    }
    $app.innerHTML = this.labTop(L.i, L.list.length, 'Lire les consignes · ' + (ex ? 'Exemple résolu' : 'À toi')) +
      '<div class="problem">' + (ex ? 'Voici comment lire une consigne, étape par étape.' : 'Lis bien la consigne avant de choisir.') + '</div>' +
      ctext + (x.ctx ? '<div class="ctx">' + nb(esc(x.ctx)) + '</div>' : '') + body + '<div id="sfb"></div></div></div>';
    this.labQuit();
    const go = document.getElementById('go'); if (go) go.onclick = () => { L.i++; this.renderCons(); };
    const lx = document.getElementById('lex'); if (lx) lx.onclick = () => this.verbsSheet();
    const selW = new Set(), selK = new Set(); let selA = null; L.lk = false;
    $app.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { if (L.lk) return; const i = +b.dataset.w; if (selW.has(i)){ selW.delete(i); b.classList.remove('on'); } else { selW.add(i); b.classList.add('on'); } });
    $app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      if (L.lk) return; const k = b.dataset.k;
      if (k === 'none'){ selK.clear(); $app.querySelectorAll('[data-k]').forEach(y => y.classList.remove('on')); }
      else if (selK.has('none')){ selK.delete('none'); $app.querySelector('[data-k="none"]').classList.remove('on'); }
      if (selK.has(k)){ selK.delete(k); b.classList.remove('on'); } else { selK.add(k); b.classList.add('on'); }
    });
    $app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { if (L.lk) return; selA = +b.dataset.a; $app.querySelectorAll('[data-a]').forEach(y => y.classList.toggle('sel', y === b)); });
    const chk = document.getElementById('chk'); if (!chk) return;
    chk.onclick = () => {
      if (!selW.size) return toast('Touche d’abord le verbe dans la consigne');
      if (!selK.size) return toast('Choisis ce que la consigne demande en plus');
      if (selA == null) return toast('Choisis la réponse qui respecte la consigne');
      L.lk = true; let all = true;
      const mark = (id, ok, txt) => { document.getElementById(id).innerHTML = '<span style="color:var(--' + (ok ? 'green' : 'red') + ');font-weight:600">' + (ok ? 'Juste. ' : 'Pas tout à fait. ') + '</span>' + txt; L.done++; if (ok) L.ok++; else all = false; };
      const vIdx = words.map((w, i) => isV(w) ? i : -1).filter(i => i >= 0);
      const ok1 = vIdx.length === selW.size && vIdx.every(i => selW.has(i));
      $app.querySelectorAll('[data-w]').forEach(b => { const i = +b.dataset.w; b.classList.remove('on'); if (vIdx.includes(i)) b.classList.add(selW.has(i) ? 'ok' : 'miss'); else if (selW.has(i)) b.classList.add('ko'); });
      mark('r1', ok1, nb(esc(x.m)));
      const ok2 = x.k.length === selK.size && x.k.every(k => selK.has(k));
      $app.querySelectorAll('[data-k]').forEach(b => { const k = b.dataset.k; b.classList.remove('on'); if (x.k.includes(k)) b.classList.add(selK.has(k) ? 'ok' : 'miss'); else if (selK.has(k)) b.classList.add('ko'); });
      mark('r2', ok2, 'Il fallait : ' + x.k.map(k => CONS_CONDS[k].toLowerCase()).join(', ') + '.');
      const ok3 = answers[selA][0] === right;
      $app.querySelectorAll('[data-a]').forEach(b => { const a = answers[+b.dataset.a], n = b.querySelector('.note'); b.classList.remove('sel'); b.classList.add(a[0] === right ? 'correct' : +b.dataset.a === selA ? 'wrong' : 'dim'); n.hidden = false; n.textContent = a[1] || 'Elle respecte la consigne.'; });
      mark('r3', ok3, ok3 ? '' : 'La bonne réponse est en vert. Lis pourquoi les autres ne vont pas.');
      if (all) L.perfect++;
      chk.remove(); const lx2 = document.getElementById('lex'); if (lx2) lx2.remove();
      document.getElementById('sfb').innerHTML = '<div class="' + (all ? 'msg-card' : 'hint-box') + '" style="margin-top:16px">' + (all ? '<b>Bravo !</b> Tu as bien lu la consigne.' : '<b>Relis les corrections</b>, puis relis la consigne une dernière fois.') + '</div><button class="btn mt" id="nx">Continuer</button>';
      document.getElementById('nx').onclick = () => { L.i++; this.renderCons(); };
    };
  },

  /* ---------- Avant le cours (pré-test) ---------- */
  preTest(){
    const sets = this.studySets();
    if (!sets.length) return toast('Pas encore d’exercices pour t’entraîner');
    this.chapterPicker('Avant le cours', 'Choisis le chapitre que tu vas étudier. Réponds sans regarder ton cours : te tromper est normal, et même utile. Rien n’est noté.',
      sets.map(x => ({ x, sub: Math.min(6, x.questions.length) + ' questions' + (x.subject ? ' · ' + x.subject : '') })), false, pick => {
        const x = pick[0], pool = x.questions.map(q => ({ ...q, id: x.assignment_id + ':' + q.id, _aid: x.assignment_id, _qid: q.id, _from: x.set_title, hint: '' }));
        this.practice = true; this.practiceKind = 'pre'; this.conf = false;
        this.set = { assignment_id: null, title: 'Avant le cours', pass_score: 0, questions: shuffle(pool).slice(0, 6), previously_missed: [] };
        this.startSession();
      });
  },

  /* ---------- Trouve l'erreur ---------- */
  errSentences(x){
    const out = [], PRON = /^(il|elle|ils|elles|ce|c[’']|cela|ça|on|celui|celle|ceux|leur|son|sa|ses|cette|ces)\b/i;
    const isNum = t => /^\d{3,4}$/.test(String(t).trim());
    const shiftYear = y => String(+y + [10, 20, 30, 50][Math.floor(Math.random() * 4)] * (Math.random() < .5 ? -1 : 1));
    const blanksAll = []; x.questions.filter(q => q.type === 'trous').forEach(q => parseTrous(q.text).filter(p => p.blank).forEach(p => blanksAll.push(p.answers[0])));
    x.questions.forEach(q => {
      const g = x.assignment_id + ':' + q.id;
      if (q.type === 'vf' && String(q.prompt || '').trim() && !q.doc) out.push({ g, t: q.prompt.trim(), err: !q.answer, fix: q.answer ? '' : (q.explanation || 'Cette phrase est fausse.') });
      if (q.type === 'trous'){
        const parts = parseTrous(q.text), bl = parts.filter(p => p.blank); if (!bl.length) return;
        const fill = (alt, v) => parts.map(p => p.blank ? (p === alt ? v : p.answers[0]) : p.text).join('').replace(/\s+/g, ' ').trim();

        let v = null;

        if (v) out.push({ g: g + 't', t: fill(pb, v), err: true, fix: 'Il fallait : ' + fill(null) });

  errRound(pool){
    const groups = {}; pool.forEach(x => { (groups[x.g] = groups[x.g] || { ok: [], ko: [] })[x.err ? 'ko' : 'ok'].push(x); });
    const gs = shuffle(Object.keys(groups)), withKo = gs.filter(g => groups[g].ko.length);
    if (!withKo.length) return null;
    const nErr = Math.min(withKo.length, Math.random() < .5 ? 1 : 2), used = new Set(), round = [];
    withKo.slice(0, nErr).forEach(g => { used.add(g); round.push(groups[g].ko[0]); });

  },

  docFacts(e){

    const own = [...new Set(e.qs.map(q => String(q.explanation || '').trim()).filter(t => t.length >= 12))].sort((a, b) => b.length - a.length);
