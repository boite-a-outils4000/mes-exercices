  answer(ok, given, correctText, explanation){
    TTS.stop();
    if (this.ctl){
      const se = this.sess, cur = se.queue[se.idx];
      se.first[cur.q.id] = ok; se.given[cur.q.id] = given; se.idx++;
      setTimeout(() => { if (this.ctl) this.renderQuestion(); }, 260);
      return;
    }
    if (this.exam){
      const se = this.sess, cur = se.queue[se.idx];
      se.first[cur.q.id] = ok; se.given[cur.q.id] = given; se.idx++;
      this.examSave();
      setTimeout(() => { if (this.exam && !this.examLocked) this.renderQuestion(); }, 260);
      return;
    }
    if (this.conf && !this._confNow){
      const it0 = this.sess.queue[this.sess.idx];
      if (!it0.repeat){
        const fbc = document.getElementById('fb');
        fbc.className = 'feedback';
        fbc.innerHTML = '<div><h3 style="color:var(--label)">Tu es sûr de ta réponse ?</h3><p class="fb-exp">Réponds honnêtement : c’est ce qui t’aide à savoir ce que tu maîtrises vraiment.</p>' +
          '<div class="conf-row"><button class="btn green" data-cf="sur">Sûr de moi</button><button class="btn orange" data-cf="pas">Pas sûr</button><button class="btn gray" data-cf="devine">J’ai deviné</button></div></div>';
        requestAnimationFrame(() => requestAnimationFrame(() => fbc.classList.add('show')));
        fbc.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => {
          const q = it0.q; this.sess.conf = this.sess.conf || {}; this.sess.conf[q.id] = b.dataset.cf;
          $app.querySelectorAll('.opt').forEach(o => {
            const isC = q.type === 'qcm' ? +o.dataset.i === q.answer : q.type === 'vf' ? (o.dataset.v === '1') === !!q.answer : false;
            if (isC) o.classList.add('correct'); else if (o.classList.contains('picked')) o.classList.add('wrong'); else o.classList.add('dim');
            o.classList.remove('picked');
          });
          fbc.classList.remove('show');
          setTimeout(() => { this._confNow = true; this.answer(ok, given, correctText, explanation); this._confNow = false; }, 220);
        });
        return;
      }
    }
    const s = this.sess, it = s.queue[s.idx];
    if (!(it.q.id in s.first)){ s.first[it.q.id] = ok; s.given[it.q.id] = given; }
    const isPre = this.practice && this.practiceKind === 'pre';
    if (!ok && it.repeat < 2 && !isPre) s.queue.push({ q: it.q, repeat: it.repeat + 1 });
    if (!ok && navigator.vibrate) try { navigator.vibrate(60); } catch(e){}
    const fb = document.getElementById('fb');
    const why = ok && !it.repeat ? this.whyChoices(it.q, explanation) : null;
    fb.className = 'feedback ' + (ok ? 'ok' : 'ko');
    fb.innerHTML = '<div><h3>' + (ok ? I.okCircle + ' Bonne réponse !' : I.koCircle + ' Pas tout à fait') + '</h3>' +
      (!ok ? '<p class="fb-ans">Réponse correcte : <strong>' + esc(correctText) + '</strong></p>' : '') +
      (why ? '<div class="why-q">Pourquoi c\u2019est la bonne réponse ?</div>' + why.map((t, k) => '<button class="why-opt" data-why="' + k + '">' + nb(esc(t)) + '</button>').join('') + '<p class="fb-exp" id="whyr" style="margin-top:8px" hidden></p>'
        : explanation ? '<p class="fb-exp">' + esc(explanation) + '</p>' : '') +
      (!ok && it.repeat < 2 && !isPre ? '<p class="fb-exp">Cette question reviendra plus loin.</p>' : '') +
      (!this.preview ? '<button class="flag-btn" id="flag">' + I.flag + ' Je n’ai pas compris</button>' : '') +
      '<button class="btn ' + (ok ? 'green' : 'red') + '" id="next"' + (why ? ' hidden' : '') + '>Continuer</button></div>';
    requestAnimationFrame(() => requestAnimationFrame(() => fb.classList.add('show')));
    const next = document.getElementById('next');
    if (why) fb.querySelectorAll('[data-why]').forEach(b => b.onclick = () => {
      if (fb.querySelector('.why-opt.correct')) return;
      const right = why.indexOf(explanation), k = +b.dataset.why;
      fb.querySelectorAll('[data-why]').forEach((x, j) => x.classList.add(j === right ? 'correct' : j === k ? 'wrong' : 'dim'));
      const r = document.getElementById('whyr'); r.hidden = false;
      r.textContent = k === right ? 'Exactement : tu as compris, pas seulement deviné.' : 'Pas tout à fait : la bonne explication est en vert. Relis-la bien.';
      s.why = s.why || {}; s.why[it.q.id] = k === right;
      next.hidden = false; setTimeout(() => next.focus({ preventScroll: true }), 50);
    });
    next.onclick = () => { s.idx++; this.saveRun(); this.renderQuestion(); };
    const fl = document.getElementById('flag');
    if (fl) fl.onclick = async () => {
      if (fl.classList.contains('done')) return;
      fl.disabled = true;
      const q = it.q, aid = q._aid || this.set.assignment_id, qid = q._qid || q.id;
      const { error } = await sb.rpc('student_flag', { p_code: this.code, p_assignment_id: aid, p_qid: qid });
      fl.disabled = false;
      if (error) return toast('Envoi impossible, réessaie');
      fl.classList.add('done'); fl.innerHTML = I.check + ' Ton professeur est prévenu';
    };
    setTimeout(() => next.focus({ preventScroll: true }), 350);
  },

  whyChoices(q, explanation){
    const s = this.sess;
    if (!explanation || this.exam || (this.practice && this.practiceKind === 'pre') || !['qcm', 'vf', 'trous', 'chrono'].includes(q.type)) return null;
    const norm = t => String(t || '').trim();
    const ok_ = t => t.length >= 12 && t !== norm(explanation);
    const same = this.set.questions.filter(x => x.id !== q.id && (!q._aid || x._aid === q._aid));
    let pool = [...new Set(same.map(x => norm(x.explanation)))].filter(ok_);
    const home = q._aid && this.study && (this.study.sets || []).find(x => x.assignment_id === q._aid);
    if (pool.length < 2 && home) pool = [...new Set(pool.concat(home.questions.filter(y => y.id !== q._qid).map(y => norm(y.explanation))))].filter(ok_);
    if (pool.length < 2 && this.study && this.study.sets){ const more = []; this.study.sets.forEach(x => x.questions.forEach(y => more.push(norm(y.explanation)))); pool = [...new Set(pool.concat(more))].filter(t => t.length >= 12 && t !== norm(explanation)); }
    if (pool.length < 2) return null;
    s.whyN = (s.whyN || 0) + 1;
    if (s.whyN % 3 !== 1) return null;
    return shuffle([explanation].concat(shuffle(pool).slice(0, 2)));
  },

  async startControl(){
    loading();
    const { data, error } = await sb.rpc('student_get_control', { p_code: this.code, p_assignment_id: this.set.assignment_id });
    if (error || !data){ toast('Le test n\u2019est pas disponible'); return this.open(this.set.assignment_id); }
    this.ctlSet = this.set; this.ctl = true; this.practice = false; this.conf = false; this.preview = false;
    this.set = { assignment_id: data.assignment_id, title: data.title, pass_score: data.pass_score, questions: data.questions, previously_missed: [] };
    this.sess = { queue: data.questions.map(q => ({ q, repeat: 0 })), first: {}, given: {}, hintUsed: {}, idx: 0, start: Date.now(), total: data.questions.length, locked: false };
    this.renderQuestion();
  },
  async ctlFinish(){
    const s = this.sess, qs = s.qs || this.set.questions;
    const score = qs.filter(q => s.first[q.id]).length;
    const answers = qs.map(q => ({ qid: q.id, correct: !!s.first[q.id], given: s.given[q.id] ?? null }));
    const duration = Math.round((Date.now() - s.start) / 1000);
    $app.innerHTML = '<div class="screen center"><div class="spinner" style="margin:0 auto 16px"></div><p style="text-align:center;color:var(--label2)">Enregistrement…</p></div>';
    const { data, error } = await sb.rpc('student_submit_control', { p_code: this.code, p_assignment_id: this.set.assignment_id, p_score: score, p_duration: duration, p_answers: answers });
    if (error){
      $app.innerHTML = '<div class="screen center"><div class="empty"><b>Ton résultat n\u2019a pas pu être envoyé</b>Vérifie ta connexion internet puis réessaie. Ne quitte pas cette page.</div><button class="btn mt" id="retry">Réessayer l\u2019envoi</button></div>';
      document.getElementById('retry').onclick = () => { s.start = Date.now() - duration * 1000; this.ctlFinish(); };
      return;
    }
    this.ctl = false;
    this.renderCtlResult(data, score, qs);
  },
  renderCtlResult(res, score, qs){
    const s = this.sess, before = this.ctlSet ? this.ctlSet.eval_before : null, okp = res.percent >= (this.set.pass_score || 0);
    const R = 62, Cc = 2 * Math.PI * R, col = okp ? 'var(--green)' : 'var(--orange)';
    $app.innerHTML = nav('<button class="nav-btn" id="back">' + I.chevL + '<span>Mes exercices</span></button>') + '<div class="wrap notab" style="text-align:center">' +
      '<svg class="ring" width="150" height="150" viewBox="0 0 150 150" style="margin:6px auto 0;display:block"><circle cx="75" cy="75" r="' + R + '" fill="none" stroke="var(--fill2)" stroke-width="13"/>' +
      '<circle id="arc" cx="75" cy="75" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="13" stroke-linecap="round" stroke-dasharray="' + Cc + '" stroke-dashoffset="' + Cc + '" transform="rotate(-90 75 75)"/>' +
      '<text x="75" y="86" text-anchor="middle" font-size="32" font-weight="700" fill="var(--label)" font-family="-apple-system,Inter,sans-serif">' + res.percent + '%</text></svg>' +
      '<h1 class="large" style="font-size:28px;margin-top:10px">' + (okp ? 'Test de contrôle réussi !' : 'Test de contrôle terminé') + '</h1>' +
      '<p class="subtitle">' + score + ' bonne' + (score > 1 ? 's' : '') + ' réponse' + (score > 1 ? 's' : '') + ' sur ' + qs.length + '. Ton professeur voit ton résultat.</p>' +
      (before != null ? '<div class="tiles" style="grid-template-columns:1fr 1fr;text-align:left;margin-top:12px"><div class="tile"><div class="n">' + before + ' %</div><div class="l">À l\u2019évaluation</div></div><div class="tile"><div class="n" style="color:' + col + '">' + res.percent + ' %</div><div class="l">Au test de contrôle</div></div></div>' +
        '<p class="foot" style="text-align:center">' + (res.percent > before ? 'Tu as progressé de ' + (res.percent - before) + ' points. Ton travail a payé !' : 'Relis la correction ci-dessous : ce sont les points à retravailler.') + '</p>' : '') +
      '<div class="section-h" style="text-align:left">Correction</div><div class="group" style="text-align:left">' + qs.map((q, k) => {
        const ok = !!s.first[q.id], g = s.given[q.id];
        return '<div class="row"><span style="color:var(--' + (ok ? 'green' : 'red') + ');display:flex;flex:none">' + (ok ? I.okCircle : I.koCircle).replace('width="26" height="26"', 'width="22" height="22"') + '</span><div class="main"><div class="t clamp2" style="font-size:15px">' + (k + 1) + '. ' + esc(qLabel(q).replace(/\[[^\]]*\]/g, '……')) + '</div>' +
          (ok ? '' : (g != null && g !== '' ? '<div class="s">Ta réponse : ' + esc(String(g)) + '</div>' : '') + '<div class="s" style="color:var(--green)">Bonne réponse : ' + esc(answerText(q)) + '</div>') + '</div></div>';
      }).join('') + '</div>' +
      '<button class="btn mt2" id="b1">Mes exercices</button></div>';
    window.scrollTo(0, 0);
    requestAnimationFrame(() => requestAnimationFrame(() => { const a = document.getElementById('arc'); if (a) a.style.strokeDashoffset = Cc * (1 - res.percent / 100); }));
    document.getElementById('back').onclick = () => this.loadList();
    document.getElementById('b1').onclick = () => this.loadList();
  },

  async finish(){
    if (this.ctl) return this.ctlFinish();
    if (this.exam) return this.examFinish();
    const s = this.sess, qs = s.qs || this.set.questions;
    const score = qs.filter(q => s.first[q.id]).length;
    const answers = qs.map(q => ({ qid: q.id, correct: !!s.first[q.id], given: s.given[q.id] ?? null, hint: !!s.hintUsed[q.id] }));
    const duration = Math.round((Date.now() - s.start) / 1000);
    let res;
    if (this.preview || this.practice){
      const p = Math.round(100 * score / qs.length);
      res = { percent: p, passed: p >= this.set.pass_score, pass_score: this.set.pass_score };
      if (this.practice){
        const m = new Set(this.mastered()); qs.forEach(q => { if (s.first[q.id]) m.add(q.id); });
        store.set('exos_ok_' + this.code, JSON.stringify([...m]));
        return this.renderPracticeResult(score, qs.length);
      }
    } else {
      $app.innerHTML = '<div class="screen center"><div class="spinner" style="margin:0 auto 16px"></div><p style="text-align:center;color:var(--label2)">Enregistrement…</p></div>';
      const { data, error } = await sb.rpc('student_submit_attempt', { p_code: this.code, p_assignment_id: this.set.assignment_id, p_score: score, p_duration: duration, p_answers: answers });
      if (error){
        $app.innerHTML = '<div class="screen center"><div class="empty"><b>Ton résultat n\u2019a pas pu être envoyé</b>Vérifie ta connexion internet puis réessaie. Ne quitte pas cette page.</div><button class="btn mt" id="retry">Réessayer l\u2019envoi</button></div>';
        document.getElementById('retry').onclick = () => { s.start = Date.now() - duration * 1000; this.finish(); };
        return;
      }
      res = data; this.clearRun();
    }
    this.renderResult(res, score, qs.length);
  },

  renderResult(res, score, total){
    const R = 70, C = 2 * Math.PI * R, col = res.passed ? 'var(--green)' : 'var(--orange)';
    $app.innerHTML = '<div class="screen center result">' +
      '<svg class="ring" width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="' + R + '" fill="none" stroke="var(--fill2)" stroke-width="14"/>' +
      '<circle id="arc" cx="85" cy="85" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" transform="rotate(-90 85 85)"/>' +
      '<text x="85" y="96" text-anchor="middle" font-size="36" font-weight="700" fill="var(--label)" font-family="-apple-system,Inter,sans-serif">' + res.percent + '%</text></svg>' +
      '<h1>' + (res.passed ? 'Exercice validé !' : 'Encore un effort') + '</h1>' +
      '<p>' + score + ' bonne' + (score > 1 ? 's' : '') + ' réponse' + (score > 1 ? 's' : '') + ' du premier coup sur ' + total + '.</p>' +
      '<p>' + (res.passed ? (this.preview ? '' : 'Ton professeur verra que tu l\u2019as terminé.') : 'Il faut ' + res.pass_score + ' % pour valider. Les questions ratées reviendront en premier.') + '</p>' +
      (res.passed && !this.preview && (this.set.anchor || 1) > 1 ? (() => {
        const before = anchorInfo(this.set.passes, this.set.anchor), after = anchorInfo((this.set.passes || []).concat([todayLocal()]), this.set.anchor);
        const txt = after.anchored && !before.anchored ? 'Série acquise ! Tu l\u2019as réussie ' + after.anchor + ' fois, à plusieurs jours d\u2019écart : c\u2019est comme ça qu\u2019on retient vraiment.'
          : after.anchored ? 'Cette série est déjà acquise. Bravo pour la révision !'
          : after.level > before.level ? 'Réussite ' + after.level + ' sur ' + after.anchor + '. Reviens à partir du ' + fmtDate(after.next) + ' pour la suivante : laisser passer quelques jours aide ta mémoire.'
          : 'Bien joué ! Pour l\u2019ancrage, la prochaine réussite comptera à partir du ' + fmtDate(after.next) + '.';
        return '<div class="msg-card" style="text-align:left"><div class="from">Ancrage</div>' + txt + '</div>'; })() : '') +
      (res.passed && this.set.success_message && !this.preview ? '<div class="msg-card"><div class="from">Message de ton professeur</div>' + esc(this.set.success_message.replace(/\{pr[ée]nom\}/gi, this.me ? this.me.first_name : '')) + '</div>' : '') +
      (this.preview ? '<p><span class="pill blue">Aperçu : rien n\u2019a été enregistré</span></p>' : '') +
      (res.passed && !this.preview && this.set.control && !this.set.control.done && anchorInfo((this.set.passes || []).concat([todayLocal()]), this.set.anchor).anchored ? '<div class="msg-card" style="text-align:left"><div class="from">Étape suivante</div>Ton test de contrôle est débloqué : ' + this.set.control.count + ' questions nouvelles, un seul essai.</div>' : '') +
      '<div class="stack mt2">' +
      (res.passed
        ? (res.passed && !this.preview && this.set.control && !this.set.control.done && anchorInfo((this.set.passes || []).concat([todayLocal()]), this.set.anchor).anchored ? '<button class="btn" id="b3">Passer le test de contrôle</button><button class="btn plain" id="b1">Plus tard</button>' : '<button class="btn" id="b1">' + (this.preview ? 'Terminer l\u2019aperçu' : 'Mes exercices') + '</button><button class="btn plain" id="b2">Refaire pour réviser</button>')
        : '<button class="btn" id="b2">Recommencer</button><button class="btn plain" id="b1">' + (this.preview ? 'Terminer l\u2019aperçu' : 'Mes exercices') + '</button>') +
      '</div></div>';
    requestAnimationFrame(() => requestAnimationFrame(() => { document.getElementById('arc').style.strokeDashoffset = C * (1 - res.percent / 100); }));
    document.getElementById('b1').onclick = () => this.exit();
    const b3 = document.getElementById('b3'); if (b3) b3.onclick = () => this.startControl();
    const b2 = document.getElementById('b2'); if (b2) b2.onclick = async () => {
      if (!this.preview){ const r = await sb.rpc('student_get_set', { p_code: this.code, p_assignment_id: this.set.assignment_id }); if (r.data) this.set = r.data; }
      this.startSession();
    };
  },

  renderPracticeResult(score, total){
    if (this.practiceKind === 'conf') return this.renderConfResult(score, total);
    if (this.practiceKind === 'pre'){
      $app.innerHTML = '<div class="screen center result"><div class="app-icon" style="background:linear-gradient(160deg,#d17bff,#9b3fe0);box-shadow:none">' + I.pre + '</div>' +
        '<h1>Pré-test terminé</h1><div class="big-score">' + score + ' / ' + total + '</div><p>sans avoir étudié</p>' +
        '<p>' + nb(score === total ? 'Tu en sais déjà beaucoup ! Lis quand même le cours pour tout vérifier.' : 'C\u2019est normal de se tromper avant d\u2019étudier. Ton cerveau a maintenant ces questions en tête : en lisant le cours, il va mieux retenir les réponses.') + '</p>' +
        '<div class="stack mt2"><button class="btn" id="b1">Lire mes cours</button><button class="btn plain" id="b2">Retour à J\u2019étudie</button></div></div>';
      document.getElementById('b1').onclick = () => { this.practice = false; this.stab = 'cours'; this.renderList(); window.scrollTo(0, 0); };
      document.getElementById('b2').onclick = () => this.exit();
      return;
    }
    if (this.practiceKind === 'week'){
      const w = this.weekState(), wk = this.weekKey(), first = !w.weeks[wk];
      if (first){ w.weeks[wk] = { score, total }; store.set('exos_week_' + this.code, JSON.stringify({ weeks: w.weeks })); }
      const st = this.weekState().streak, ws = (first ? { score, total } : w.weeks[wk]);
      $app.innerHTML = '<div class="screen center result"><div class="app-icon" style="background:linear-gradient(160deg,#ff6961,#ff3b30);box-shadow:none">' + I.week + '</div>' +
        '<h1>Quiz de la semaine terminé</h1><p>' + score + ' bonne' + (score > 1 ? 's' : '') + ' réponse' + (score > 1 ? 's' : '') + ' du premier coup sur ' + total + '.' + (!first ? ' Ton score de la semaine reste ' + ws.score + ' / ' + ws.total + '.' : '') + '</p>' +
        '<p>' + nb(score === total ? 'Parfait : tu te souviens bien de tes chapitres.' : 'Les questions ratées te montrent ce qu’il faut revoir. Elles sont dans « Mes erreurs ».') + '</p>' +
        (st > 1 ? '<p><span class="pill green">' + st + ' semaines d’affilée</span></p>' : '') +
        '<p style="color:var(--label2)">Reviens lundi : un nouveau quiz t’attend.</p>' +
        '<div class="stack mt2"><button class="btn" id="b1">Retour à J’étudie</button></div></div>';
      document.getElementById('b1').onclick = () => this.exit();
      return;
    }
    $app.innerHTML = '<div class="screen center result"><div class="app-icon" style="background:linear-gradient(160deg,#ffb340,#ff8a00);box-shadow:none">' + I.book + '</div>' +
      '<h1>' + (this.practiceKind === 'free' ? 'Entraînement terminé' : this.practiceKind === 'map' ? 'Cartes muettes terminées' : 'Révision terminée') + '</h1><p>' + score + ' question' + (score > 1 ? 's' : '') + ' réussie' + (score > 1 ? 's' : '') + ' du premier coup sur ' + total + '.</p>' +
      '<p>' + nb(score ? 'Les questions réussies sont retirées de « Mes erreurs ».' : 'Relis le cours, puis réessaie : tu vas y arriver.') + '</p>' +
      '<div class="stack mt2"><button class="btn" id="b1">Mes exercices</button></div></div>';
    document.getElementById('b1').onclick = () => this.exit();
  },

  renderConfResult(score, total){
    const s = this.sess, qs = this.set.questions, cf = s.conf || {};
    const g = { sureOk: [], sureKo: [], unsureOk: [], unsureKo: [] };
    qs.forEach(q => { const c = cf[q.id], ok = !!s.first[q.id]; if (!c) return; if (c === 'sur') g[ok ? 'sureOk' : 'sureKo'].push(q); else g[ok ? 'unsureOk' : 'unsureKo'].push(q); });
    const toCards = g.sureKo.concat(g.unsureOk).filter(q => ['qcm', 'vf', 'trous'].includes(q.type) && q._aid);
    if (toCards.length){
      const st = this.cardState(), today = isoDate(new Date());
      toCards.forEach(q => { st['q:' + q._aid + ':' + q._qid] = { box: 1, due: today }; });
      store.set('exos_cards_' + this.code, JSON.stringify(st));
    }
    const row = (col, title, sub, n) => '<div class="row"><span class="pill ' + col + '" style="min-width:34px;justify-content:center">' + n + '</span><div class="main"><div class="t">' + title + '</div><div class="s">' + sub + '</div></div></div>';
    $app.innerHTML = nav('', '') + '<div class="wrap notab"><h1 class="large">Bilan de ta confiance</h1><p class="subtitle">' + score + ' / ' + total + ' réussies du premier coup.</p>' +
      '<div class="group">' +
        row('green', 'Sûr et juste', 'Tu le maîtrises.', g.sureOk.length) +
        row('red', 'Sûr mais faux', 'À revoir en priorité : tu croyais savoir. Ce sont les erreurs qu’on corrige le mieux.', g.sureKo.length) +
        row('orange', 'Pas sûr mais juste', 'Tu le sais à moitié : revois-le pour en être sûr.', g.unsureOk.length) +
        row('', 'Pas sûr et faux', 'Normal : c’est encore à apprendre.', g.unsureKo.length) +
      '</div>' +
      (g.sureKo.length ? '<div class="section-h">Tu étais sûr, mais…</div><div class="group">' + g.sureKo.map(q => '<div class="row"><div class="main"><div class="t" style="font-size:15px">' + esc(qLabel(q).replace(/\[[^\]]*\]/g, '……')) + '</div><div class="s">Bonne réponse : ' + esc(answerText(q)) + '</div></div></div>').join('') + '</div>' : '') +
      (toCards.length ? '<p class="foot">' + toCards.length + ' question' + (toCards.length > 1 ? 's' : '') + ' ajoutée' + (toCards.length > 1 ? 's' : '') + ' à tes cartes mémoire du jour.</p>' : '') +
      '<div class="stack mt2"><button class="btn" id="b1">Retour à J’étudie</button></div></div>';
    window.scrollTo(0, 0);
    document.getElementById('b1').onclick = () => { this.conf = false; this.practice = false; this.stab = 'study'; this.renderList(); };
  },

  runPreview(set){
    this.preview = true; this.practice = false; this.conf = false;
    this.set = { ...set, assignment_id: null, previously_missed: [], course_title: ((Prof.courses || []).find(c => c.id === set.course_id) || {}).title };
    this.startSession();
  }
};

/* ================= ENSEIGNANT ================= */
const Prof = {
  user: null, loaded: false, classes: [], sets: [], assignments: [], studentById: {}, classFilter: 'all', draft: null,

  async route(parts){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return this.renderAuth();
    this.user = session.user;
    const [tab, id] = parts;
    try {
      if (!this.loaded){ loading(); await this.load(); const k = store.get('prof_classe'); if (k && (k === 'all' || this.classes.some(c => c.id === k))) this.classFilter = k; }
      else if (!tab || tab === 'suivi') await this.load();
    } catch(e){ console.error(e); $app.innerHTML = '<div class="screen center"><div class="empty"><b>Erreur de chargement</b>' + esc(e.message || '') + '</div><button class="btn mt" onclick="route()">Réessayer</button></div>'; return; }
    if (tab === 'suivi' && id) return this.renderSetProgress(id);
    if (tab === 'exercices' && id) return this.renderEditor(id === 'nouveau' ? null : id);
    if (tab === 'exercices') return this.renderSets();
    if (tab === 'eleve' && id) return this.renderStudent(id);
    if (tab === 'copie' && id) return this.renderCopyEditor(id);
    if (tab === 'evals' && id) return this.renderEval(id);
    if (tab === 'evals') return this.renderEvals();
    if (tab === 'cours' && id) return this.renderCourseEditor(id === 'nouveau' ? null : id);
    if (tab === 'cours') return this.renderCourses();
    if (tab === 'classes' && id) return this.renderClass(id);
    if (tab === 'classes') return this.renderClasses();
    return this.renderDashboard();
  },

  async load(){
    const [ev, ea, co, fl, c, s, a, cp] = await Promise.all([
      sb.from('evaluations').select('*').order('created_at', { ascending: false }),
      sb.from('eval_attempts').select('*'),
      sb.from('courses').select('*').order('updated_at', { ascending: false }),
      sb.from('flags').select('*'),
      sb.from('classes').select('id,name,created_at,hidden_tools,challenge,students(id,first_name,code,class_id,created_at)').order('name'),
      sb.from('exercise_sets').select('*').order('created_at', { ascending: false }),
      sb.from('assignments').select('id,set_id,student_id,due_date,reason,success_message,created_at,from_eval_id,control_qids,attempts(id,score,total,percent,passed,duration_seconds,answers,created_at,kind)'),
      sb.from('copies').select('id,student_id,title,copy_date,score,total,comments,published,published_at,seen_at,created_at').order('created_at', { ascending: false })
    ]);
    this.copies = cp.error ? [] : (cp.data || []);
    const err = c.error || s.error || a.error || co.error || fl.error; if (err) throw err;
    if (ev.error || ea.error) throw (ev.error || ea.error);
    this.courses = co.data || []; this.flags = fl.data || []; this.evals = ev.data || []; this.evalAtts = ea.data || [];
    this.classes = c.data.map(cl => ({ ...cl, students: cl.students.sort((x, y) => x.first_name.localeCompare(y.first_name, 'fr')) }));
    this.classes.sort((x, y) => x.name.localeCompare(y.name, 'fr', { numeric: true }));
    this.sets = s.data; this.assignments = a.data;
    this.studentById = {};
    this.classes.forEach(cl => cl.students.forEach(st => { this.studentById[st.id] = { ...st, class_name: cl.name }; }));
    if (this.classFilter !== 'all' && !this.classes.some(c => c.id === this.classFilter)) this.classFilter = 'all';
    this.loaded = true;
  },

  beforePct(a){
    if (!a.from_eval_id) return null;
    const ea = this.evalAtts.find(x => x.evaluation_id === a.from_eval_id && x.student_id === a.student_id && x.status === 'done');
    return ea && ea.total ? Math.round(finalScore(ea) / ea.total * 100) : null;
  },
  stat(a){
    const ctl = (a.attempts || []).find(x => x.kind === 'control') || null;
    const atts = (a.attempts || []).filter(x => x.kind !== 'control').sort((x, y) => x.created_at.localeCompare(y.created_at));
    const done = atts.some(x => x.passed);
    const late = !done && a.due_date && a.due_date < todayLocal();
    return {
      atts, done, late, count: atts.length, ctl,
      best: atts.length ? Math.max(...atts.map(x => x.percent)) : null,
      time: atts.reduce((t, x) => t + (x.duration_seconds || 0), 0),
      last: atts.length ? atts[atts.length - 1].created_at : null,
      status: done ? 'done' : late ? 'late' : atts.length ? 'progress' : 'todo',
      anc: done ? anchorInfo(atts.filter(x => x.passed).map(x => isoDate(new Date(x.created_at))), ((this.sets || []).find(z => z.id === a.set_id) || {}).anchor || 1) : null
    };
  },

  shell(active, html){
    const tab = (k, label, icon) => '<a href="#/prof/' + k + '" class="' + (active === k ? 'on' : '') + '">' + icon + '<span>' + label + '</span></a>';
    $app.innerHTML = html + '<nav class="tabbar">' + tab('suivi', 'Suivi', I.tabChart) + tab('exercices', 'Exercices', I.tabDoc) + tab('cours', 'Cours', I.tabBook) + tab('evals', 'Évaluations', I.tabEval) + tab('classes', 'Classes', I.tabPeople) + '</nav>';
    window.scrollTo(0, 0);
  },

  classSeg(){
    if (this.classes.length < 2) return '';
    return '<div class="seg" id="cseg" style="margin-bottom:14px"><button data-c="all" class="' + (this.classFilter === 'all' ? 'on' : '') + '">Toutes</button>' +
      this.classes.map(c => '<button data-c="' + c.id + '" class="' + (this.classFilter === c.id ? 'on' : '') + '">' + esc(c.name) + '</button>').join('') + '</div>';
  },
  bindSeg(rerender){
    const seg = document.getElementById('cseg'); if (!seg) return;
    seg.querySelectorAll('button').forEach(b => b.onclick = () => { this.classFilter = b.dataset.c; store.set('prof_classe', b.dataset.c); rerender(); });
  },
  filteredAssignments(){
    return this.assignments.filter(a => {
      const st = this.studentById[a.student_id]; if (!st) return false;
      return this.classFilter === 'all' || st.class_id === this.classFilter;
    });
  },

  /* --- Connexion --- */
  renderAuth(mode, msg){
    mode = mode || 'login';
    $app.innerHTML = '<div class="screen center"><div class="hero"><div class="app-icon">' + I.tabChart + '</div><h1 class="large">Espace enseignant</h1><p>Crée des exercices et suis le travail de tes élèves.</p></div>' +
      '<div class="seg" style="margin-bottom:16px"><button data-m="login" class="' + (mode === 'login' ? 'on' : '') + '">Connexion</button><button data-m="signup" class="' + (mode === 'signup' ? 'on' : '') + '">Créer un compte</button></div>' +
      '<form id="af"><div class="group"><input class="field" id="em" type="email" placeholder="Adresse e-mail" autocomplete="email" required><div style="height:.5px;background:var(--sep);margin-left:16px"></div>' +
      '<input class="field" id="pw" type="password" placeholder="Mot de passe' + (mode === 'signup' ? ' (8 caractères min.)' : '') + '" autocomplete="' + (mode === 'signup' ? 'new-password' : 'current-password') + '" minlength="' + (mode === 'signup' ? 8 : 1) + '" required></div>' +
      (msg ? '<p class="' + (msg.ok ? '' : 'err') + '" style="margin-top:12px;text-align:center;font-size:15px;' + (msg.ok ? 'color:var(--label2)' : '') + '">' + esc(msg.text) + '</p>' : '') +
      '<button class="btn mt" id="ab" type="submit">' + (mode === 'signup' ? 'Créer mon compte' : 'Se connecter') + '</button></form>' +
      '<a class="link-quiet" href="#/">Retour à l\u2019espace élève</a></div>';
    $app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => this.renderAuth(b.dataset.m));
    document.getElementById('af').onsubmit = async e => {
      e.preventDefault();
      const email = document.getElementById('em').value.trim(), password = document.getElementById('pw').value;
      const btn = document.getElementById('ab'); btn.disabled = true; btn.textContent = 'Un instant…';
      if (mode === 'signup'){
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname + '#/prof' } });
        if (error) return this.renderAuth('signup', { text: this.authErr(error) });
        if (data.session) return go('#/prof');
        return this.renderAuth('login', { ok: true, text: 'Compte créé. Ouvre le mail de confirmation et clique sur le lien, puis connecte-toi ici.' });
      }
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return this.renderAuth('login', { text: this.authErr(error) });
      this.loaded = false; route();
    };
  },
  authErr(e){
    const m = String(e.message || '');
    if (/invalid login/i.test(m)) return 'Adresse ou mot de passe incorrect.';
    if (/not confirmed/i.test(m)) return 'Adresse pas encore confirmée : clique sur le lien reçu par mail.';
    if (/already registered/i.test(m)) return 'Un compte existe déjà avec cette adresse.';
    if (/password/i.test(m)) return 'Mot de passe trop faible (8 caractères minimum).';
    if (/rate limit/i.test(m)) return 'Trop de tentatives, réessaie dans quelques minutes.';
    return m;
  },

  /* --- Suivi --- */
  setStats(as){
    const bySet = {};
    as.forEach(x => (bySet[x.a.set_id] = bySet[x.a.set_id] || []).push(x));
    return this.sets.filter(s => bySet[s.id]).map(s => {
      const list = bySet[s.id];
      const due = list.filter(x => !x.st.done && x.a.due_date).map(x => x.a.due_date).sort();
      return { s, total: list.length, done: list.filter(x => x.st.done).length, late: list.filter(x => x.st.late).length,
        progress: list.filter(x => x.st.status === 'progress').length, todo: list.filter(x => x.st.status === 'todo').length,
        due: due.find(d => d >= todayLocal()) || null, lastAct: list.map(x => x.st.last || x.a.created_at).sort().pop() };
    }).sort((x, y) => (y.lastAct || '').localeCompare(x.lastAct || ''));
  },
  closedDashFolders(){ try { return JSON.parse(store.get('suivi_dossiers_fermes') || '[]'); } catch(e){ return []; } },
  ring(pct, col){
    const r = 17, c = 2 * Math.PI * r;
    return '<span class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="' + r + '" fill="none" stroke="var(--fill2)" stroke-width="5"/>' +
      '<circle cx="22" cy="22" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 22 22)"/></svg><b>' + pct + '</b></span>';
  },
  stackBar(x){
    const seg = (n, col) => n ? '<i style="width:' + (n / x.total * 100) + '%;background:' + col + '"></i>' : '';
    return '<div class="sbar">' + seg(x.done, 'var(--green)') + seg(x.progress, 'var(--orange)') + seg(x.late, 'var(--red)') + seg(x.todo, 'var(--fill)') + '</div>';
  },
  dashCols(sets, as){
    const left = this.dashSetsHtml(sets, as);
    if (!wideScreen()) return left;
    const cname = id => (this.classes.find(c => c.id === id) || {}).name || '';
    const evs = this.evals.filter(e => this.classFilter === 'all' || e.class_id === this.classFilter)
      .sort((x, y) => String(y.opened_at || y.created_at || '').localeCompare(String(x.opened_at || x.created_at || ''))).slice(0, 10);
    const right = '<div class="section-h">Évaluations</div>' + (evs.length ? '<div class="group">' + evs.map(e => {
      const [lab, col] = this.evalStatus(e), done = this.evalAtts.filter(x => x.evaluation_id === e.id && x.status === 'done' && x.score != null);
      const tot = done.length ? done[0].total : evQN(e, true), avg = done.length ? Math.round(done.reduce((t, a) => t + finalScore(a) / (a.total || 1), 0) / done.length * 100) : null;
      return '<a class="row evrow" href="#/prof/evals/' + e.id + '"><div class="main"><div class="t">' + esc(e.title) + '</div><div class="s">' + esc(cname(e.class_id)) + (done.length ? ' · ' + done.length + ' copie' + (done.length > 1 ? 's' : '') + ' · moyenne ' + avg + ' %' : '') + '</div></div><span class="pill ' + col + '">' + lab + '</span><span class="chev">' + I.chevR + '</span></a>';
    }).join('') + '</div>' : '<div class="empty">Pas encore d\u2019évaluation.</div>') + '<p class="foot">Les évaluations faites en classe, en violet. Les séries d\u2019exercices, en bleu.</p>';
    return '<div class="cols"><div class="col-ex">' + left + '</div><div class="col-ev">' + right + '</div></div>';
  },
  dashSetsHtml(sets, as){
    if (!sets.length) return '<div class="section-h">Séries assignées</div>';
    const view = store.get('suivi_vue') === 'finies' ? 'finies' : 'cours';
    const multiC = this.classFilter === 'all' && new Set(as.map(x => (this.studentById[x.a.student_id] || {}).class_id)).size > 1;
    const perC = multiC ? this.classes.flatMap(c => this.setStats(as.filter(x => (this.studentById[x.a.student_id] || {}).class_id === c.id))) : sets;
    const fin = perC.filter(x => x.done === x.total), cur = perC.filter(x => x.done < x.total);
    const shown = view === 'finies' ? fin : cur;
    const legend = x => [x.done ? '<span style="color:var(--green)">' + x.done + ' validé' + (x.done > 1 ? 's' : '') + '</span>' : '', x.progress ? '<span style="color:var(--orange)">' + x.progress + ' en cours</span>' : '',
      x.late ? '<span style="color:var(--red)">' + x.late + ' en retard</span>' : '', x.todo ? x.todo + ' pas commencé' + (x.todo > 1 ? 's' : '') : ''].filter(Boolean).join(' · ');
    const row = x => {
      const pct = Math.round(x.done / x.total * 100);
      return '<a class="row srow" href="#/prof/suivi/' + x.s.id + '">' + this.ring(pct, x.late ? 'var(--red)' : pct === 100 ? 'var(--green)' : 'var(--blue)') +
        '<div class="main"><div class="t">' + esc(x.s.title) + '</div>' + this.stackBar(x) + '<div class="s" style="font-size:13px">' + legend(x) + '</div></div>' +
        (x.due && x.done < x.total ? '<span class="sdue">pour le<br><b>' + fmtDate(x.due) + '</b></span>' : '') + '<span class="chev">' + I.chevR + '</span></a>';
    };
    const closed = this.closedDashFolders();
    const foldersHtml = (items, ck) => {
    const by = new Map();
    items.forEach(x => { const f = (x.s.folder || '').trim(); if (!by.has(f)) by.set(f, []); by.get(f).push(x); });
    const keys = [...by.keys()].sort((a, b) => !a ? 1 : !b ? -1 : (by.get(b).map(x => x.lastAct || '').sort().pop() || '').localeCompare(by.get(a).map(x => x.lastAct || '').sort().pop() || ''));
    const useF = keys.some(Boolean);
    return keys.map(f => {
      const list = by.get(f).sort((x, y) => useF ? x.s.title.localeCompare(y.s.title, 'fr', { numeric: true }) : 0);
      if (!useF) return '<div class="group">' + list.map(row).join('') + '</div>';
      const t = list.reduce((a, x) => ({ total: a.total + x.total, done: a.done + x.done, progress: a.progress + x.progress, late: a.late + x.late, todo: a.todo + x.todo }), { total: 0, done: 0, progress: 0, late: 0, todo: 0 });
      const key = ck + (f || '·'), open = !closed.includes(key);
      return '<div class="group fold" style="margin-top:12px"><button class="row fold-h' + (open ? ' open' : '') + '" data-dfold="' + esc(key) + '"><span class="fic"' + (f ? '' : ' style="background:var(--gray)"') + '>' + I.folder + '</span><div class="main"><div class="t" style="font-weight:600">' + esc(f || 'Sans dossier') + '</div>' +
        this.stackBar(t) + '<div class="s" style="font-size:13px">' + list.length + ' série' + (list.length > 1 ? 's' : '') + ' · ' + Math.round(t.done / t.total * 100) + ' % validé' + '</div></div>' +
        (t.late ? '<span class="pill red">' + t.late + ' en retard</span>' : '') + '<span class="chev">' + I.chevR + '</span></button>' + (open ? list.map(row).join('') : '') + '</div>';
    }).join('');
    };
    const multi = this.classFilter === 'all' && new Set(as.map(x => (this.studentById[x.a.student_id] || {}).class_id)).size > 1;
    let body;
    if (!multi) body = foldersHtml(shown, '');
    else {
      const ids = new Set(sets.map(x => x.s.id));
      body = this.classes.map(c => {
        const items = this.setStats(as.filter(x => (this.studentById[x.a.student_id] || {}).class_id === c.id)).filter(x => ids.has(x.s.id) && (view === 'finies' ? x.done === x.total : x.done < x.total));
        if (!items.length) return '';
        const late = items.reduce((t, x) => t + x.late, 0), key = 'c:' + c.id, open = !closed.includes(key);
        return '<button class="cls-h' + (open ? ' open' : '') + '" data-dfold="' + key + '"><span class="chev">' + I.chevR + '</span><span class="n">' + esc(c.name) + '</span><span class="m">' + items.length + ' série' + (items.length > 1 ? 's' : '') + '</span>' + (late ? '<span class="pill red">' + late + ' en retard</span>' : '') + '</button>' +
          (open ? foldersHtml(items, c.id + '|') : '');
      }).join('');
    }
    return '<div class="section-h">Séries assignées</div>' +
      '<div class="seg"><button data-dview="cours" class="' + (view === 'cours' ? 'on' : '') + '">En cours (' + cur.length + ')</button><button data-dview="finies" class="' + (view === 'finies' ? 'on' : '') + '">Terminées (' + fin.length + ')</button></div>' +
      (shown.length ? body : '<div class="empty">' + (view === 'finies' ? 'Aucune série n\u2019est encore validée par tous ses élèves.' : 'Toutes les séries assignées sont validées. Bravo !') + '</div>') +
      '<p class="foot"><span style="color:var(--green)">■</span> validé · <span style="color:var(--orange)">■</span> en cours · <span style="color:var(--red)">■</span> en retard · <span style="color:var(--label3)">■</span> pas commencé. Le cercle donne le pourcentage d\u2019élèves qui ont validé.</p>';
  },

  renderDashboard(){
    const as = this.filteredAssignments().map(a => ({ a, st: this.stat(a) }));
    const nDone = as.filter(x => x.st.done).length, nLate = as.filter(x => x.st.late).length, nTodo = as.length - nDone;
    const bySet = {};
    as.forEach(x => (bySet[x.a.set_id] = bySet[x.a.set_id] || []).push(x));
    const sets = this.setStats(as);
    const late = as.filter(x => x.st.late).map(x => ({ ...x, stu: this.studentById[x.a.student_id], set: this.sets.find(s => s.id === x.a.set_id) })).filter(x => x.set)
      .sort((x, y) => x.stu.class_name.localeCompare(y.stu.class_name, 'fr', { numeric: true }) || x.stu.first_name.localeCompare(y.stu.first_name, 'fr'));
    this._late = late;
    const inCls = sid => this.studentById[sid] && (this.classFilter === 'all' || this.studentById[sid].class_id === this.classFilter);
    const attn = [];
    this.evals.filter(e => e.status === 'open' && (this.classFilter === 'all' || e.class_id === this.classFilter)).forEach(e => {
      const lk = this.evalAtts.filter(x => x.evaluation_id === e.id && x.status === 'locked').length;
      attn.push(['#/prof/evals/' + e.id, lk ? 'red' : 'purple', lk ? I.lock : I.tabEval, lk ? lk + ' copie' + (lk > 1 ? 's' : '') + ' bloquée' + (lk > 1 ? 's' : '') : 'Évaluation en cours', e.title]);
    });
    const flBy = {}; (this.flags || []).filter(f => inCls(f.student_id)).forEach(f => { const a = this.assignments.find(x => x.id === f.assignment_id); if (a) flBy[a.set_id] = (flBy[a.set_id] || 0) + 1; });
    Object.keys(flBy).forEach(sid => { const st = this.sets.find(x => x.id === sid); if (st) attn.push(['#/prof/suivi/' + sid, 'blue', I.flag, flBy[sid] + ' « Je n’ai pas compris »', st.title]); });
    const wk = Date.now() - 7 * 864e5, ctlBy = {};
    as.forEach(x => { if (x.st.ctl && new Date(x.st.ctl.created_at) > wk) ctlBy[x.a.set_id] = (ctlBy[x.a.set_id] || 0) + 1; });
    Object.keys(ctlBy).forEach(sid => { const st = this.sets.find(x => x.id === sid); if (st) attn.push(['#/prof/suivi/' + sid, 'purple', I.check, ctlBy[sid] + ' test' + (ctlBy[sid] > 1 ? 's' : '') + ' de contrôle fait' + (ctlBy[sid] > 1 ? 's' : '') + ' cette semaine', st.title]); });
    const html = nav('', '<button class="nav-btn" id="acct">Compte</button>') +
      '<div class="wrap' + (wideScreen() ? ' wide' : '') + '"><h1 class="large">Suivi</h1>' + this.classSeg() +
      '<div class="section-h">À traiter</div>' + (attn.length || late.length
        ? '<div class="group attn">' + (late.length ? '<button class="row" id="golate"><span class="ic" style="background:var(--red)">' + I.alert + '</span><div class="main"><div class="t">' + late.length + ' exercice' + (late.length > 1 ? 's' : '') + ' en retard</div><div class="s">' + [...new Set(late.map(x => x.stu.first_name))].slice(0, 5).map(esc).join(', ') + (new Set(late.map(x => x.stu.first_name)).size > 5 ? '…' : '') + '</div></div><span class="chev">' + I.chevR + '</span></button>' : '') +
          attn.map(x => '<a class="row" href="' + x[0] + '"><span class="ic" style="background:var(--' + x[1] + ')">' + x[2].replace(/width="\d+" height="\d+"/, 'width="17" height="17"') + '</span><div class="main"><div class="t">' + x[3] + '</div><div class="s">' + esc(x[4]) + '</div></div><span class="chev">' + I.chevR + '</span></a>').join('') + '</div>'
        : '<div class="group"><div class="row"><div class="main"><div class="t">Rien d’urgent</div><div class="s">Pas de retard, pas de question en attente.</div></div><span style="color:var(--green);display:flex">' + I.okCircle.replace('width="26" height="26"', 'width="22" height="22"') + '</span></div></div>') +
      '<div class="tiles"><div class="tile"><div class="n">' + nTodo + '</div><div class="l">À faire</div></div>' +
      '<div class="tile"><div class="n" style="color:var(--red)">' + nLate + '</div><div class="l">En retard</div></div>' +
      '<div class="tile"><div class="n" style="color:var(--green)">' + nDone + '</div><div class="l">Validés</div></div></div>' +
      (late.length ? '<div class="section-h" id="latehead">À relancer (' + late.length + ')<button id="board">Afficher au tableau</button></div><div class="group">' +
        late.map(x => '<a class="row" href="#/prof/eleve/' + x.stu.id + '"><div class="avatar">' + initials(x.stu.first_name) + '</div><div class="main"><div class="t">' + esc(x.stu.first_name) +
          (this.classes.length > 1 && this.classFilter === 'all' ? ' <span style="color:var(--label2);font-size:15px">· ' + esc(x.stu.class_name) + '</span>' : '') + '</div><div class="s">' + esc(x.set.title) + (x.st.count ? ' · ' + x.st.count + ' essai' + (x.st.count > 1 ? 's' : '') + ', meilleur ' + x.st.best + ' %' : ' · pas commencé') + '</div></div>' +
          '<span class="late-due">' + fmtDate(x.a.due_date) + '</span></a>').join('') +
        '<button class="row center" id="copylate">Copier la liste pour un message</button></div>' : '') +
      this.dashCols(sets, as) +
      (sets.length ? ''
        : '<div class="empty"><b>Rien à suivre pour l\u2019instant</b>' + (this.classes.length ? 'Crée une série dans l\u2019onglet Exercices, puis assigne-la à des élèves.' : 'Commence par créer une classe et ses élèves dans l\u2019onglet Classes.') + '</div>') +
      '</div>';
    this.shell('suivi', html);
    this.bindSeg(() => this.renderDashboard());
    $app.querySelectorAll('[data-dview]').forEach(b => b.onclick = () => { store.set('suivi_vue', b.dataset.dview); const y = window.scrollY; this.renderDashboard(); window.scrollTo(0, y); });
    $app.querySelectorAll('[data-dfold]').forEach(b => b.onclick = () => {
      const f = b.dataset.dfold, c = this.closedDashFolders(), k = c.indexOf(f);
      if (k >= 0) c.splice(k, 1); else c.push(f);
      store.set('suivi_dossiers_fermes', JSON.stringify(c)); const y = window.scrollY; this.renderDashboard(); window.scrollTo(0, y);
    });
    const cl = document.getElementById('copylate'); if (cl) cl.onclick = () => copyText(this.lateText(late), 'Liste copiée');
    const gl = document.getElementById('golate'); if (gl) gl.onclick = () => document.getElementById('latehead').scrollIntoView({ behavior: 'smooth', block: 'start' });
    const bd = document.getElementById('board'); if (bd) bd.onclick = () => this.showBoard(late);
    document.getElementById('acct').onclick = () => actionSheet(this.user.email, [{ label: 'Apparence (clair ou sombre)', run: () => openSheet('<div class="grabber"></div><div class="sheet-head"><span></span><h2>Apparence</h2><button class="nav-btn bold" data-close>OK</button></div>' + themeSeg() + '<p class="foot">Ce réglage reste sur cet appareil.</p>', el => bindThemeSeg(el)) }, { label: 'Se déconnecter', red: true, run: async () => { await sb.auth.signOut(); this.loaded = false; go('#/prof'); } }]);
  },

  flagsHtml(all, set){
    const aIds = new Set(all.map(a => a.id));
    const fl = (this.flags || []).filter(f => aIds.has(f.assignment_id) && this.studentById[f.student_id] && (this.classFilter === 'all' || this.studentById[f.student_id].class_id === this.classFilter));
    if (!fl.length) return '';
    const by = {}; fl.forEach(f => { (by[f.qid] = by[f.qid] || []).push(this.studentById[f.student_id].first_name); });
    const rows = (set.questions || []).filter(q => by[q.id]).map(q => '<div class="row"><div class="main"><div class="t clamp2" style="font-size:15px">' + esc(qLabel(q)) + '</div><div class="s">' + esc(by[q.id].join(', ')) + '</div></div><span class="pill blue">' + by[q.id].length + '</span></div>').join('');
    if (!rows) return '';
    return '<div class="section-h">« Je n’ai pas compris »</div><div class="group">' + rows + '</div><p class="foot">Questions signalées par les élèves après leur réponse : utile pour savoir quoi reprendre en classe.</p>';
  },
  lateText(late){
    const by = {};
    late.forEach(x => { (by[x.stu.class_name] = by[x.stu.class_name] || []).push(x); });
    return Object.keys(by).map(cn => 'Exercices en retard (' + cn + ') :\n' + by[cn].map(x => '- ' + x.stu.first_name + ' : ' + x.set.title + ' (pour le ' + new Date(x.a.due_date + 'T12:00:00').toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long' }) + ')').join('\n')).join('\n\n') +
      '\n\nOuvre l’appli Mes exercices avec ton code pour les terminer.';
  },
  showBoard(late){
    const by = {};
    late.forEach(x => { const k = x.stu.id; (by[k] = by[k] || { stu: x.stu, sets: [] }).sets.push(x.set.title); });
    const el = document.createElement('div'); el.className = 'board';
    el.innerHTML = '<button class="btn small gray board-x" id="bx">Fermer</button><div class="board-in"><h1>Exercices à terminer</h1><p class="board-sub">Ouvre l’appli avec ton code pour les finir.</p><div class="board-grid">' +
      Object.values(by).sort((a, b) => a.stu.first_name.localeCompare(b.stu.first_name, 'fr')).map(g => '<div class="board-card"><div class="bn">' + esc(g.stu.first_name) + '</div><div class="bs">' + g.sets.map(esc).join('<br>') + '</div></div>').join('') + '</div></div>';
    document.body.appendChild(el);
    const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    el.querySelector('#bx').onclick = close; document.addEventListener('keydown', onKey);
  },

  renderSetProgress(setId){
    const set = this.sets.find(s => s.id === setId);
    if (!set) return go('#/prof');
    const all = this.assignments.filter(a => a.set_id === setId && this.studentById[a.student_id]);
    const list = all.filter(a => this.classFilter === 'all' || this.studentById[a.student_id].class_id === this.classFilter)
      .map(a => ({ a, st: this.stat(a), stu: this.studentById[a.student_id] }));
    const hasCtl = !!set.control_set_id;
    list.forEach(x => { x.before = this.beforePct(x.a); x.ph = hasCtl && x.st.ctl ? 'ctl' : hasCtl && x.st.done ? 'ctlwait' : x.st.status; });
    const order = { late: 0, todo: 1, progress: 2, ctlwait: 3, ctl: 4, done: 5 };
    list.sort((x, y) => order[x.ph] - order[y.ph] || x.stu.first_name.localeCompare(y.stu.first_name, 'fr'));
    const ST = { done: ['Validé', 'green'], late: ['En retard', 'red'], progress: ['Pas validé', 'orange'], todo: ['Pas commencé', ''], ctlwait: ['Test à faire', 'blue'] };
    const both = list.filter(x => x.before != null && x.st.ctl), withB = list.filter(x => x.before != null), withC = list.filter(x => x.st.ctl);
    const avg = arr => arr.length ? Math.round(arr.reduce((t, v) => t + v, 0) / arr.length) : null;
    const aB = avg(both.map(x => x.before)), aA = avg(both.map(x => x.st.ctl.percent));
    const pathHtml = (hasCtl || withB.length) ? '<div class="section-h">Remédiation en deux temps</div><div class="tiles">' +
        '<div class="tile"><div class="n">' + (avg(withB.map(x => x.before)) ?? '—') + (withB.length ? ' %' : '') + '</div><div class="l">Avant (évaluation)</div></div>' +
        '<div class="tile"><div class="n" style="color:var(--green)">' + list.filter(x => x.st.done).length + ' / ' + list.length + '</div><div class="l">Série validée</div></div>' +
        '<div class="tile"><div class="n" style="color:var(--blue)">' + (avg(withC.map(x => x.st.ctl.percent)) ?? '—') + (withC.length ? ' %' : '') + '</div><div class="l">Après (contrôle)</div></div></div>' +
        '<p class="foot">' + (both.length ? 'Pour les ' + both.length + ' élève' + (both.length > 1 ? 's' : '') + ' qui ont fait l\u2019évaluation et le test : ' + aB + ' % avant, ' + aA + ' % après (' + (aA - aB >= 0 ? '+' : '') + (aA - aB) + ' points).' : hasCtl ? 'Le test de contrôle se débloque quand l\u2019élève a validé la série : ' + (set.control_count || 10) + ' questions tirées de « ' + esc((this.sets.find(z => z.id === set.control_set_id) || {}).title || '') + ' ».' : 'Ajoute un test de contrôle à cette série dans l\u2019éditeur pour mesurer les progrès.') + '</p>' : '';
    // Questions les plus ratées
    const stats = {};
    list.forEach(x => x.st.atts.forEach(at => (at.answers || []).forEach(an => { const r = stats[an.qid] = stats[an.qid] || { n: 0, ok: 0 }; r.n++; if (an.correct) r.ok++; })));
    const hard = (set.questions || []).map(q => ({ q, ...(stats[q.id] || { n: 0, ok: 0 }) })).filter(x => x.n && x.ok < x.n)
      .sort((a, b) => a.ok / a.n - b.ok / b.n).slice(0, 5);
    const classesHere = [...new Set(all.map(a => this.studentById[a.student_id].class_id))];
    const multi = classesHere.length > 1;
    const html = nav(backBtn('#/prof/suivi', 'Suivi'), '<button class="nav-btn" id="asg">Assigner</button>') +
      '<div class="wrap"><h1 class="large">' + esc(set.title) + '</h1><p class="subtitle">' + set.questions.length + ' questions · ' + set.pass_score + ' % pour valider' + (set.subject ? ' · ' + esc(set.subject) : '') + '</p>' +
      this.classSeg() + pathHtml +
      '<div class="section-h">Élèves (' + list.length + ')</div>' +
      (list.length ? '<div class="group">' + list.map(x => {
        const [lab, col] = x.ph === 'ctl' ? ['Contrôle ' + x.st.ctl.percent + ' %', x.st.ctl.percent >= set.pass_score ? 'green' : 'orange'] : ST[x.ph];
        let meta = x.st.count ? 'Meilleur ' + x.st.best + ' % · ' + x.st.count + ' essai' + (x.st.count > 1 ? 's' : '') + ' · ' + fmtDuration(x.st.time) : (x.a.due_date ? 'Pour le ' + fmtDate(x.a.due_date) : 'Aucun essai');
        if (x.st.anc && x.st.anc.anchor > 1) meta += ' · ' + (x.st.anc.anchored ? '<span style="color:var(--green)">acquise</span>' : 'ancrage ' + x.st.anc.level + '/' + x.st.anc.anchor);
        if (hasCtl || x.before != null) meta = [x.before != null ? 'Éval ' + x.before + ' %' : null, x.st.done ? 'série validée' : x.st.count ? 'série ' + x.st.best + ' %' : 'série pas commencée', hasCtl ? (x.st.ctl ? 'contrôle ' + x.st.ctl.percent + ' %' : 'contrôle') : null].filter(Boolean).join(' → ');
        return '<button class="row" data-a="' + x.a.id + '"><div class="avatar">' + initials(x.stu.first_name) + '</div><div class="main"><div class="t">' + esc(x.stu.first_name) +
          (multi && this.classFilter === 'all' ? ' <span style="color:var(--label2);font-size:15px">· ' + esc(x.stu.class_name) + '</span>' : '') + '</div><div class="s">' + meta + '</div></div><span class="pill ' + col + '">' + lab + '</span></button>';
      }).join('') + (list.some(x => !x.st.done) ? '<button class="row center" id="copynot">Copier les élèves qui n\u2019ont pas validé</button>' : '') + '</div>' : '<div class="empty">Aucun élève de cette classe n\u2019a cette série.</div>') +
      (hard.length ? '<div class="section-h">Questions les plus ratées</div><div class="group">' + hard.map(h => {
        const r = Math.round(h.ok / h.n * 100);
        return '<div class="row"><div class="main"><div class="t clamp2" style="font-size:15px">' + esc(qLabel(h.q)) + '</div><div class="s">' + TYPE_LABEL[h.q.type] + ' · ' + h.n + ' réponse' + (h.n > 1 ? 's' : '') + '</div></div><span class="pill ' + (r < 50 ? 'red' : 'orange') + '">' + r + ' % réussite</span></div>';
      }).join('') + '</div><p class="foot">Calculé sur toutes les tentatives (réponses du premier coup).</p>' : '') +
      this.flagsHtml(all, set) +
      '</div>';
    this.shell('suivi', html);
    this.bindSeg(() => this.renderSetProgress(setId));
    document.getElementById('asg').onclick = () => this.assignSheet(set);
    const cn = document.getElementById('copynot');
    if (cn) cn.onclick = () => copyText(set.title + ', pas encore validé :\n' + list.filter(x => !x.st.done).map(x => '- ' + x.stu.first_name + (x.st.late ? ' (en retard)' : x.st.count ? ' (meilleur score ' + x.st.best + ' %, il faut ' + set.pass_score + ' %)' : ' (pas commencé)')).join('\n'), 'Liste copiée');
    $app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => this.attemptSheet(list.find(x => x.a.id === b.dataset.a), set));
  },

  attemptSheet(x, set, fromStudent){
    const atts = x.st.atts.slice().reverse();
    const html = '<div class="grabber"></div><div class="sheet-head"><span></span><h2>' + esc(fromStudent ? set.title : x.stu.first_name) + '</h2><button class="nav-btn bold" data-close>OK</button></div>' +
      '<div class="group">' +
      '<div class="row"><div class="main t">Classe</div><span class="val">' + esc(x.stu.class_name) + '</span></div>' +
      '<div class="row"><div class="main t">À faire pour le</div><span class="val">' + (x.a.due_date ? fmtDate(x.a.due_date) : '—') + '</span></div>' +
      (x.a.reason ? '<div class="row"><div class="main t">Motif</div><span class="val">' + esc(x.a.reason) + '</span></div>' : '') +
      (x.a.from_eval_id ? (() => { const e = this.evals.find(v => v.id === x.a.from_eval_id), b = this.beforePct(x.a); return '<div class="row"><div class="main"><div class="t">Suite à l\u2019évaluation</div><div class="s">' + esc(e ? e.title : '') + (b != null ? ' · ' + b + ' %' : '') + '</div></div></div>'; })() : '') +
      '<div class="row"><div class="main t">Temps total</div><span class="val">' + fmtDuration(x.st.time) + '</span></div></div>' +
      '<div class="section-h">Essais (' + atts.length + ')</div>' +
      (atts.length ? '<div class="group">' + atts.map((at, k) => '<button class="row" data-att="' + k + '"><div class="main"><div class="t">' + at.percent + ' % <span style="color:var(--label2);font-size:15px">(' + at.score + '/' + at.total + ')</span></div><div class="s">' + fmtDateTime(at.created_at) + ' · ' + fmtDuration(at.duration_seconds) + ' · voir les réponses</div></div>' + (at.passed ? '<span class="pill green">Validé</span>' : '') + '<span class="chev">' + I.chevR + '</span></button>').join('') + '</div>'
        : '<div class="empty">Pas encore d\u2019essai.</div>') +
      (set.control_set_id ? (() => {
        const c = x.st.ctl, cs = this.sets.find(z => z.id === set.control_set_id) || { questions: [] };
        if (!c) return '<div class="section-h">Test de contrôle</div><div class="group"><div class="row"><div class="main t">' + (x.st.done ? 'Débloqué, pas encore fait' : 'Se débloque quand la série est validée') + '</div></div></div>';
        const ko = (c.answers || []).filter(a => !a.correct).map(a => cs.questions.find(q => q.id === a.qid)).filter(Boolean);
        return '<div class="section-h">Test de contrôle</div><div class="group"><button class="row" data-ctl="1"><div class="main"><div class="t">' + c.percent + ' % <span style="color:var(--label2);font-size:15px">(' + c.score + '/' + c.total + ')</span></div><div class="s">' + fmtDateTime(c.created_at) + ' · ' + fmtDuration(c.duration_seconds || 0) + ' · voir les réponses</div></div>' +
          (this.beforePct(x.a) != null ? '<span class="pill ' + (c.percent > this.beforePct(x.a) ? 'green' : 'orange') + '">' + (c.percent - this.beforePct(x.a) >= 0 ? '+' : '') + (c.percent - this.beforePct(x.a)) + ' pts</span>' : '') + '<span class="chev">' + I.chevR + '</span></button>' +
          ko.map(q => '<div class="row"><div class="main"><div class="t clamp2" style="font-size:15px">' + esc(qLabel(q)) + '</div><div class="s">Ratée · réponse : ' + esc(answerText(q)) + '</div></div></div>').join('') + '</div>';
      })() : '') +
      (x.hints ? '<p class="foot">Indices utilisés : ' + x.hints + '</p>' : '') +
      (fromStudent ? '' : '<div class="group mt2"><a class="row center" href="#/prof/eleve/' + x.stu.id + '" data-close>Voir la fiche de ' + esc(x.stu.first_name) + '</a></div>') +
      '<div class="group mt2"><button class="row danger" id="unassign">Retirer cette série à ' + esc(x.stu.first_name) + '</button></div>';
    openSheet(html, (el, close) => {
      el.querySelectorAll('[data-att]').forEach(b => b.onclick = () => { const at = atts[+b.dataset.att]; close(); setTimeout(() => this.answersSheet(x, set, at, 'Essai du ' + fmtDateTime(at.created_at), set.questions, () => this.attemptSheet(x, set, fromStudent)), 280); });
      const cb = el.querySelector('[data-ctl]'); if (cb) cb.onclick = () => { const cs = this.sets.find(z => z.id === set.control_set_id) || { questions: [] }; close(); setTimeout(() => this.answersSheet(x, set, x.st.ctl, 'Test de contrôle', cs.questions, () => this.attemptSheet(x, set, fromStudent)), 280); };
      el.querySelector('#unassign').onclick = async () => {
        if (!await confirmDialog('Retirer la série ?', 'Les essais de ' + x.stu.first_name + ' sur cette série seront aussi supprimés.', 'Retirer', true)) return;
        const { error } = await sb.from('assignments').delete().eq('id', x.a.id);
        if (error) return toast('Erreur : ' + esc(error.message));
        close(); await this.load(); route(); toast('Série retirée');
      };
    });
  },

  answersSheet(x, set, at, sub, questions, back){
    const ans = at.answers || [], ok = ans.filter(a => a.correct).length;
    const byId = {}; (questions || []).forEach(q => { byId[q.id] = q; });
    const giv = v => v == null || v === '' ? '<i style="color:var(--label3,var(--label2))">pas de réponse</i>' : esc(Array.isArray(v) ? v.join(' · ') : typeof v === 'object' ? JSON.stringify(v) : String(v));
    const html = '<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" id="aback">' + I.chevL + '<span>Retour</span></button><h2>' + esc(x.stu.first_name) + '</h2><button class="nav-btn bold" data-close>OK</button></div>' +
      '<p class="subtitle" style="text-align:center;margin-top:-4px">' + esc(set.title) + ' · ' + esc(sub) + '</p>' +
      '<div class="seg" id="afil" style="margin:4px 0 12px"><button data-f="all" class="on">Toutes (' + ans.length + ')</button><button data-f="ko">Ratées (' + (ans.length - ok) + ')</button><button data-f="ok">Réussies (' + ok + ')</button></div>' +
      '<div class="group" id="alist">' + ans.map((a, k) => {
        const q = byId[a.qid];
        return '<div class="row ans-row" data-ok="' + (a.correct ? 1 : 0) + '" style="align-items:flex-start"><span class="ans-ic ' + (a.correct ? 'ok' : 'ko') + '">' + (a.correct ? I.check : I.x) + '</span><div class="main">' +
          '<div class="t" style="font-size:15px;white-space:normal">' + (k + 1) + '. ' + (q ? esc(qLabel(q)) : '<i>Question retirée de la série depuis</i>') + '</div>' +
          (q && (q.doc && q.doc.image || q.type === 'image' || q.type === 'clic') ? '<img src="' + esc(q.type === 'image' || q.type === 'clic' ? q.image : q.doc.image) + '" alt="" style="width:110px;border-radius:6px;margin-top:6px;display:block;box-shadow:inset 0 0 0 1px var(--sep)">' : '') +
          '<div class="s" style="white-space:normal;margin-top:4px">Réponse de ' + esc(x.stu.first_name) + ' : <span style="color:' + (a.correct ? 'var(--green)' : 'var(--red)') + ';font-weight:600">' + giv(a.given) + '</span></div>' +
          (!a.correct && q ? '<div class="s" style="white-space:normal">Bonne réponse : <b style="color:var(--label)">' + esc(answerText(q)) + '</b></div>' : '') +
          (a.hint ? '<div class="s"><span class="pill orange" style="margin-top:4px">Indice utilisé</span></div>' : '') + '</div></div>';
      }).join('') + '</div>' +
      (ans.length ? '' : '<div class="empty">Aucune réponse enregistrée pour cet essai.</div>');
    openSheet(html, (el, close) => {
      el.querySelector('#aback').onclick = () => { close(); setTimeout(back, 280); };
      el.querySelectorAll('#afil button').forEach(b => b.onclick = () => {
        el.querySelectorAll('#afil button').forEach(z => z.classList.toggle('on', z === b));
        el.querySelectorAll('.ans-row').forEach(r => { r.hidden = b.dataset.f !== 'all' && (r.dataset.ok === '1') !== (b.dataset.f === 'ok'); });
      });
    });
  },

  /* --- Exercices --- */
  folderNames(){
    return [...new Set(this.sets.map(s => (s.folder || '').trim()).filter(Boolean))].sort((x, y) => x.localeCompare(y, 'fr', { numeric: true }));
  },
  folderGroups(list){
    const all = list || this.sets, out = this.folderNames().map(f => [f, all.filter(s => (s.folder || '').trim() === f)
      .sort((x, y) => x.title.localeCompare(y.title, 'fr', { numeric: true }))]).filter(g => g[1].length);
    const loose = all.filter(s => !(s.folder || '').trim());
    return loose.length ? out.concat([['', loose]]) : out;
  },
  openFolders(){ try { return JSON.parse(store.get('exos_dossiers_ouverts') || '[]'); } catch(e){ return []; } },

  renderSets(){
    const countFor = id => this.assignments.filter(a => a.set_id === id).length;
    const rowS = s => {
      const n = countFor(s.id);
      return '<button class="row exrow" data-s="' + s.id + '"><div class="main"><div class="t">' + esc(s.title) + '</div><div class="s">' +
        [s.subject ? esc(s.subject) : null, s.questions.length + ' question' + (s.questions.length > 1 ? 's' : '') + (s.draw_count && s.draw_count < s.questions.length ? ' (' + s.draw_count + ' par essai)' : ''), n ? n + ' élève' + (n > 1 ? 's' : '') : 'non assignée'].filter(Boolean).join(' · ') +
        '</div></div><span class="chev">' + I.chevR + '</span></button>';
    };
    const groups = this.folderGroups(), open = this.openFolders(), hasF = groups.some(g => g[0]);
    const body = groups.map(([f, list], i) => {
      if (!f) return (hasF ? '<div class="section-h">Sans dossier</div>' : '') + '<div class="group">' + list.map(rowS).join('') + '</div>';
      const isOpen = open.includes(f), nA = list.filter(s => countFor(s.id)).length;
      return '<div class="group fold"><button class="row fold-h' + (isOpen ? ' open' : '') + '" data-fold="' + i + '"><span class="fic">' + I.folder + '</span><div class="main"><div class="t" style="font-weight:600">' + esc(f) + '</div><div class="s">' +
        list.length + ' série' + (list.length > 1 ? 's' : '') + (nA ? ' · ' + nA + ' assignée' + (nA > 1 ? 's' : '') : '') + '</div></div><span class="more" data-fmore="' + i + '">Modifier</span><span class="chev">' + I.chevR + '</span></button>' +
        (isOpen ? list.map(rowS).join('') : '') + '</div>';
    }).join('');
    const html = nav('<button class="nav-btn" id="imp">Importer</button>', (this.sets.length ? '<button class="nav-btn" id="asgm">Assigner</button>' : '') + '<button class="nav-btn" id="new" aria-label="Nouvelle série">' + I.plus + '</button>') +
      '<div class="wrap"><h1 class="large">Exercices</h1>' +
      (this.sets.length ? body + '<div class="group" style="margin-top:14px"><button class="row center" id="newfold">Nouveau dossier</button></div>'
        : '<div class="empty"><b>Aucune série</b>Crée ta première série avec le bouton +, ou importe une série préparée par Claude.</div>') +
      '<p class="foot" style="margin-top:14px">' + (this.sets.length ? 'Range tes séries dans des dossiers (par chapitre, par classe…) pour garder la liste claire. Les élèves ne voient pas les dossiers. ' : '') +
      'Astuce : demande à Claude « crée une série d\u2019exercices sur… pour mon appli ». Il peut l\u2019ajouter directement ici ou te donner un texte à importer.</p></div>';
    this.shell('exercices', html);
    document.getElementById('new').onclick = () => { this.draft = null; go('#/prof/exercices/nouveau'); };
    document.getElementById('imp').onclick = () => this.importSheet();
    const nf = document.getElementById('newfold'); if (nf) nf.onclick = () => this.folderSheet(null);
    const am = document.getElementById('asgm'); if (am) am.onclick = () => this.assignSheet(null);
    $app.querySelectorAll('[data-fold]').forEach(b => b.onclick = e => {
      const f = groups[+b.dataset.fold][0];
      if (e.target.closest('[data-fmore]')) return this.folderSheet(f);
      const o = this.openFolders(), k = o.indexOf(f);
      if (k >= 0) o.splice(k, 1); else o.push(f);
      store.set('exos_dossiers_ouverts', JSON.stringify(o));
      const y = window.scrollY; this.renderSets(); window.scrollTo(0, y);
    });
    $app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
      const s = this.sets.find(x => x.id === b.dataset.s);
      actionSheet(s.title, [
        { label: 'Assigner à des élèves', run: () => this.assignSheet(s) },
        { label: 'Voir le suivi', run: () => go('#/prof/suivi/' + s.id) },
        { label: 'Modifier', run: () => { this.draft = null; go('#/prof/exercices/' + s.id); } },
        { label: s.folder ? 'Changer de dossier' : 'Ranger dans un dossier', run: () => this.moveSheet(s) },
        { label: 'Essayer comme un élève', run: () => Student.runPreview(s) },
        { label: 'Dupliquer', run: () => this.duplicate(s) },
        { label: 'Supprimer', red: true, run: () => this.deleteSet(s) }
      ]);
    });
  },

  async setFolder(ids, folder){
    if (!ids.length) return true;
    const { error } = await sb.from('exercise_sets').update({ folder: folder || null }).in('id', ids);
    if (error){ toast('Erreur : ' + esc(error.message)); return false; }
    this.sets.forEach(s => { if (ids.includes(s.id)) s.folder = folder || null; });
    return true;
  },
  openFolder(f){ const o = this.openFolders(); if (f && !o.includes(f)){ o.push(f); store.set('exos_dossiers_ouverts', JSON.stringify(o)); } },

  moveSheet(s){
    const items = this.folderNames().filter(f => f !== s.folder).map(f => ({ label: f, run: async () => { if (await this.setFolder([s.id], f)){ this.openFolder(f); this.renderSets(); toast('Rangée dans « ' + esc(f) + ' »'); } } }));
    items.push({ label: 'Nouveau dossier…', run: () => this.folderSheet(null, [s.id]) });
    if (s.folder) items.push({ label: 'Sortir du dossier', red: true, run: async () => { if (await this.setFolder([s.id], null)){ this.renderSets(); toast('Série sortie du dossier'); } } });
    actionSheet(s.title, items);
  },

  folderSheet(folder, preselect){
    const sel = new Set(preselect || this.sets.filter(s => folder && (s.folder || '').trim() === folder).map(s => s.id));
    let name = folder || '';
    const html = '<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-close>Annuler</button><h2>' + (folder ? 'Modifier le dossier' : 'Nouveau dossier') + '</h2><button class="nav-btn bold" id="ok">OK</button></div><div id="fb"></div>';
    openSheet(html, (el, close) => {
      const draw = () => {
        const y = el.querySelector('.sheet').scrollTop;
        el.querySelector('#fb').innerHTML =
          '<div class="group"><input class="field" id="fname" placeholder="Nom du dossier (ex. Identités et migrations)" value="' + esc(name) + '" style="font-weight:600"></div>' +
          '<div class="section-h">Séries dans ce dossier (' + sel.size + ')</div>' +
          this.folderGroups().map(([f, list]) => '<div class="section-h" style="margin-top:14px;text-transform:none;font-size:14px">' + (f ? esc(f) : 'Sans dossier') + '</div><div class="group">' +
            list.map(x => '<button class="row" data-pick="' + x.id + '"><span class="check ' + (sel.has(x.id) ? 'on' : '') + '">' + (sel.has(x.id) ? I.check : '') + '</span><div class="main"><div class="t">' + esc(x.title) + '</div><div class="s">' + x.questions.length + ' questions</div></div></button>').join('') + '</div>').join('') +
          (folder ? '<div class="group" style="margin-top:22px"><button class="row danger" id="fdel">Supprimer le dossier</button></div><p class="foot">Les séries ne sont pas supprimées : elles reviennent dans « Sans dossier ».</p>' : '');
        el.querySelector('.sheet').scrollTop = y;
        el.querySelector('#fname').oninput = e => { name = e.target.value; };
        el.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { const id = b.dataset.pick; if (sel.has(id)) sel.delete(id); else sel.add(id); draw(); });
        const del = el.querySelector('#fdel');
        if (del) del.onclick = async () => {
          if (!await confirmDialog('Supprimer le dossier « ' + folder + ' » ?', 'Les séries restent dans l\u2019appli, hors dossier.', 'Supprimer', true)) return;
          if (await this.setFolder(this.sets.filter(s => (s.folder || '').trim() === folder).map(s => s.id), null)){ close(); this.renderSets(); toast('Dossier supprimé'); }
        };
      };
      draw();
      el.querySelector('#ok').onclick = async () => {
        const n = name.trim().replace(/\s+/g, ' ');
        if (!n) return toast('Donne un nom au dossier');
        if (!sel.size) return toast('Choisis au moins une série');
        const before = this.sets.filter(s => folder && (s.folder || '').trim() === folder).map(s => s.id);
        const out = before.filter(id => !sel.has(id));
        if (!await this.setFolder([...sel], n) || !await this.setFolder(out, null)) return;
        if (folder && folder !== n){ const o = this.openFolders().filter(f => f !== folder); store.set('exos_dossiers_ouverts', JSON.stringify(o)); }
        this.openFolder(n); close(); this.renderSets(); toast(folder ? 'Dossier mis à jour' : 'Dossier créé');
      };
    });
  },

  async duplicate(s){
    const { error } = await sb.from('exercise_sets').insert({ teacher_id: this.user.id, title: s.title + ' (copie)', subject: s.subject, folder: s.folder || null, description: s.description, recap: s.recap, course_id: s.course_id, pass_score: s.pass_score, questions: s.questions, draw_count: s.draw_count || null, anchor: s.anchor || 3 });

  async deleteSet(s){
    const n = this.assignments.filter(a => a.set_id === s.id).length;
    if (!await confirmDialog('Supprimer « ' + s.title + ' » ?', n ? 'Elle est assignée à ' + n + ' élève(s) : leurs résultats seront aussi supprimés.' : 'Cette action est définitive.', 'Supprimer', true)) return;
    const { error } = await sb.from('exercise_sets').delete().eq('id', s.id);
